<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Доставка заказов — ЦУИМ</title><link rel="icon" href="images/logo_cuim.png">
<style>
:root{--bg:#f4f7fb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--violet:#7c3aed;--green:#059669;--red:#dc2626;--amber:#d97706}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.topin,.wrap{width:min(1320px,calc(100% - 28px));margin:auto}.topin{height:100%;display:flex;align-items:center;gap:10px}.logo{width:185px;height:52px;object-fit:contain}.top-actions{margin-left:auto;display:flex;gap:7px}.btn{border:0;border-radius:10px;padding:9px 12px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.light{background:#fff;color:#334155;border:1px solid #cbd5e1}.btn.green{background:#059669}.btn.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca}.btn.small{padding:7px 9px;font-size:10px}.wrap{padding:22px 0 50px}.hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,#071633,#172554 62%,#312e81);color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:14px}.hero h1{margin:0 0 5px;font-size:28px}.hero p{margin:0;color:#cbd5e1}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.metric{padding:13px}.metric small{font-size:9px;color:var(--muted)}.metric b{display:block;font-size:21px;margin-top:3px}.card{padding:15px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;background:#fff;width:100%}.toolbar input{min-width:270px}.list{display:grid;gap:9px}.order{border:1px solid #e2e8f0;border-radius:14px;padding:13px}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.order h3{margin:0;font-size:13px}.meta{font-size:10px;color:var(--muted);line-height:1.55}.route{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:center;margin:9px 0;background:#f8fafc;border-radius:11px;padding:10px}.route b{display:block;font-size:10px}.route span{font-size:10px;color:#475569}.arrow{text-align:center;color:#94a3b8}.chip{display:inline-flex;padding:5px 7px;border-radius:999px;font-size:8px;font-weight:900;background:#eff6ff;color:#1d4ed8;margin:4px 4px 0 0}.chip.green{background:#ecfdf5;color:#047857}.chip.amber{background:#fffbeb;color:#b45309}.chip.red{background:#fef2f2;color:#b91c1c}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.drawer{margin-top:10px;border-top:1px solid #e2e8f0;padding-top:12px}.field{display:grid;gap:5px;margin-bottom:9px}.field label{font-size:10px;font-weight:850;color:#475569}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.msg{font-size:10px;margin-top:8px}.ok{color:var(--green)}.err{color:var(--red)}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:13px}.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.gatebox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:23px}.gatebox img{width:200px;display:block;margin:auto}.hidden{display:none!important}@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}.hero{display:block}.hero .btn{margin-top:12px}.two,.three{grid-template-columns:1fr}.route{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.top-actions .hide{display:none}.toolbar input{min-width:0}}
</style><script src="/maintenance-guard.js"></script>
</head><body>
<div id="gate" class="gate"><form id="loginForm" class="gatebox"><img src="images/logo_cuim.png"><h1>Доставка заказов</h1><p class="meta">Войдите в аккаунт продавца.</p><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Пароль</label><input id="password" type="password" required></div><button class="btn" style="width:100%">Войти</button><div id="loginMsg" class="msg err"></div></form></div>
<div id="app" class="hidden"><header class="top"><div class="topin"><a href="./"><img class="logo" src="images/logo_cuim.png"></a><div class="top-actions"><a class="btn light hide" href="seller-orders.html">← Заказы</a><a class="btn light hide" href="seller-catalog.html">Каталог</a><button class="btn" id="logout">Выйти</button></div></div></header><main class="wrap"><section class="hero"><div><h1>Доставка заказов</h1><p>Передавайте заказы курьерам ЦУИМ и следите за выполнением.</p></div><button class="btn" id="refresh">↻ Обновить</button></section><div class="metrics"><div class="metric"><small>Нужна доставка</small><b id="mNeed">0</b></div><div class="metric"><small>Ищут курьера</small><b id="mSearch">0</b></div><div class="metric"><small>В работе</small><b id="mWork">0</b></div><div class="metric"><small>Доставлено</small><b id="mDone">0</b></div></div><section class="card"><div class="toolbar"><input id="q" placeholder="Заказ, покупатель, адрес"><select id="filter"><option value="ACTIVE">Активные доставки</option><option value="NEED">Нужно передать</option><option value="SEARCH">Ищут курьера</option><option value="WORK">У курьера</option><option value="DONE">Доставлено</option><option value="ALL">Все</option></select></div><div id="orders" class="list"></div></section></main></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));const dt=v=>v?new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';const stName={OPEN:'Ищет курьера',ASSIGNED:'Курьер назначен',GOING_TO_PICKUP:'Едет за заказом',PICKED_UP:'Заказ забран',IN_TRANSIT:'В пути',DELIVERED:'Доставлено',CANCELLED:'Отменено'};let partnerId=null,orders=[],deliveryMap=new Map(),partner={};
function badge(st){return`<span class="chip ${st==='DELIVERED'?'green':st==='CANCELLED'?'red':['OPEN','ASSIGNED'].includes(st)?'amber':''}">${esc(stName[st]||st||'Не передан')}</span>`}function itemText(o){return(o.items||[]).map(i=>`${i.title} × ${i.quantity}`).join(', ')}
async function guard(){const{data:{session}}=await s.auth.getSession();if(!session)return false;const{data,error}=await s.rpc('current_partner_id');if(error||!data)return false;partnerId=data;const p=await s.from('partners').select('marketplace_address,address,marketplace_city,name').eq('id',partnerId).maybeSingle();partner=p.data||{};$('gate').classList.add('hidden');$('app').classList.remove('hidden');return true}
$('loginForm').onsubmit=async e=>{e.preventDefault();const{error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('loginMsg').textContent=error.message;if(await guard())loadAll();else $('loginMsg').textContent='У аккаунта нет профиля продавца.'};$('logout').onclick=async()=>{await s.auth.signOut();location.reload()};$('refresh').onclick=()=>loadAll();
async function loadAll(){const[a,b]=await Promise.all([s.rpc('marketplace_partner_orders',{p_status:null,p_limit:500}),s.rpc('partner_courier_delivery_overview')]);orders=(a.data||[]).filter(o=>o.delivery_method&&!['PICKUP','DIGITAL'].includes(o.delivery_method)&&o.delivery_address);deliveryMap=new Map((b.data||[]).map(x=>[x.marketplace_order_id,x]));metrics();render()}
function metrics(){let need=0,search=0,work=0,done=0;for(const o of orders){const d=deliveryMap.get(o.id);if(!d||d.status==='CANCELLED')need++;else if(d.status==='OPEN')search++;else if(d.status==='DELIVERED')done++;else work++}$('mNeed').textContent=need;$('mSearch').textContent=search;$('mWork').textContent=work;$('mDone').textContent=done}
function matches(o){const d=deliveryMap.get(o.id),f=$('filter').value;if(f==='ACTIVE'&&d?.status==='DELIVERED')return false;if(f==='NEED'&&d&&d.status!=='CANCELLED')return false;if(f==='SEARCH'&&d?.status!=='OPEN')return false;if(f==='WORK'&&!d||f==='WORK'&&!['ASSIGNED','GOING_TO_PICKUP','PICKED_UP','IN_TRANSIT'].includes(d.status))return false;if(f==='DONE'&&d?.status!=='DELIVERED')return false;const q=$('q').value.trim().toLowerCase();return!q||[o.id,o.customer_name,o.customer_phone,o.delivery_city,o.delivery_address,itemText(o),d?.courier_name].join(' ').toLowerCase().includes(q)}
function render(){const a=orders.filter(matches);$('orders').innerHTML=a.length?a.map(o=>orderHtml(o)).join(''):'<div class="empty">Заказов по фильтру нет.</div>';document.querySelectorAll('[data-create]').forEach(b=>b.onclick=()=>toggleForm(b.dataset.create));document.querySelectorAll('[data-submit-delivery]').forEach(b=>b.onclick=()=>createDelivery(b.dataset.submitDelivery));document.querySelectorAll('[data-cancel-delivery]').forEach(b=>b.onclick=()=>cancelDelivery(b.dataset.cancelDelivery))}
function orderHtml(o){const d=deliveryMap.get(o.id);const active=d&&!['CANCELLED'].includes(d.status);const canCreate=!active&&o.status!=='CANCELLED'&&o.status!=='COMPLETED';return`<article class="order"><div class="order-head"><div><h3>Заказ #${esc(o.id.slice(0,8).toUpperCase())} · ${esc(o.customer_name||'Покупатель')}</h3><div class="meta">${esc(dt(o.created_at))} · ${money(o.total)} · доставка покупателю ${money(o.delivery_price||0)}</div></div>${badge(d?.status)}</div><div class="route"><div><b>${esc(partner.marketplace_city||o.delivery_city||'')} · продавец</b><span>${esc(partner.marketplace_address||partner.address||'Укажите адрес забора')}</span></div><div class="arrow">→</div><div><b>${esc(o.delivery_city||'')} · покупатель</b><span>${esc(o.delivery_address||'')}</span></div></div><div class="meta">${esc(itemText(o)||'Товары заказа')}${d?.courier_name?'<br>Курьер: '+esc(d.courier_name)+(d.courier_phone?' · '+esc(d.courier_phone):'')+' · '+esc(stName[d.status]||d.status):''}</div><div class="actions">${canCreate?`<button class="btn green small" data-create="${o.id}">Передать курьеру</button>`:''}${d&&['OPEN','ASSIGNED','GOING_TO_PICKUP'].includes(d.status)?`<button class="btn danger small" data-cancel-delivery="${o.id}">Отменить курьерскую заявку</button>`:''}<a class="btn light small" href="order.html?id=${encodeURIComponent(o.id)}" target="_blank">Открыть заказ ↗</a></div>${canCreate?deliveryForm(o):''}</article>`}
function deliveryForm(o){const pickup=partner.marketplace_address||partner.address||'';const pack=itemText(o);const payout=Number(o.delivery_price||0);return`<div class="drawer hidden" id="form-${o.id}"><div class="two"><div class="field"><label>Адрес забора *</label><input id="pickup-${o.id}" value="${esc(pickup)}"></div><div class="field"><label>Оплата курьеру, ₽ *</label><input id="price-${o.id}" type="number" min="0" step="1" value="${esc(payout)}"></div></div><div class="two"><div class="field"><label>Подсказка на заборе</label><input id="pickupHint-${o.id}" placeholder="стойка, вход, этаж"></div><div class="field"><label>Подсказка у получателя</label><input id="deliveryHint-${o.id}" placeholder="подъезд, домофон"></div></div><div class="field"><label>Что везём</label><textarea id="package-${o.id}" rows="2">${esc(pack)}</textarea></div><div class="three"><div class="field"><label>Вес, кг</label><input id="weight-${o.id}" type="number" min="0" step="0.1"></div><div class="field"><label>Габариты</label><input id="dims-${o.id}" placeholder="40×30×20 см"></div><div class="field"><label>Нужен транспорт</label><select id="vehicle-${o.id}"><option value="">Любой</option><option value="FOOT">Пеший</option><option value="BICYCLE">Велосипед</option><option value="SCOOTER">Самокат</option><option value="CAR">Авто</option><option value="VAN">Фургон</option><option value="TRUCK">Грузовой</option></select></div></div><div class="two"><div class="field"><label>Забрать до</label><input id="pickupUntil-${o.id}" type="datetime-local"></div><div class="field"><label>Доставить до</label><input id="deliverUntil-${o.id}" type="datetime-local"></div></div><button class="btn small" data-submit-delivery="${o.id}">Опубликовать заявку курьерам</button><div id="msg-${o.id}" class="msg"></div></div>`}
function toggleForm(id){$('form-'+id)?.classList.toggle('hidden')}
async function createDelivery(id){const el=x=>$(x+'-'+id),iso=x=>el(x).value?new Date(el(x).value).toISOString():null,num=x=>el(x).value===''?null:Number(el(x).value);const m=$('msg-'+id);m.className='msg';m.textContent='Создаём заявку…';const{error}=await s.rpc('partner_create_courier_offer',{p_order_id:id,p_pickup_address:el('pickup').value.trim(),p_pickup_hint:el('pickupHint').value.trim()||null,p_delivery_hint:el('deliveryHint').value.trim()||null,p_package_description:el('package').value.trim()||null,p_price:Number(el('price').value||0),p_weight_kg:num('weight'),p_dimensions_text:el('dims').value.trim()||null,p_vehicle_required:el('vehicle').value||null,p_pickup_until:iso('pickupUntil'),p_deliver_until:iso('deliverUntil')});if(error){m.className='msg err';m.textContent=error.message;return}m.className='msg ok';m.textContent='Заявка опубликована. Ищем курьера.';await loadAll()}
async function cancelDelivery(id){if(!confirm('Отменить курьерскую заявку? Заказ останется активным, но потребуется выбрать доставку заново.'))return;const{error}=await s.rpc('partner_cancel_courier_offer',{p_order_id:id,p_note:'Отменено продавцом'});if(error)return alert(error.message);await loadAll()}
$('q').oninput=render;$('filter').onchange=render;setInterval(()=>{if(!document.hidden&&partnerId)loadAll()},20000);if(await guard())loadAll();
</script><script type="module" src="/seller-delivery-tariff.js"></script></body></html>
