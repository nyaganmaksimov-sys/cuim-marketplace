<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071633"><title>Расширенная админка — ЦУИМ Управление</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#071633}body{display:grid;grid-template-rows:56px minmax(0,1fr)}.bar{height:56px;background:#071633;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #ffffff18}.back{border:1px solid #ffffff22;background:#ffffff0d;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;text-decoration:none}.title{min-width:0}.title b{display:block;font-size:13px}.title span{display:block;color:#94a3b8;font-size:10px;margin-top:2px}.open{margin-left:auto;border:1px solid #ffffff22;background:#ffffff0d;color:#cbd5e1;border-radius:10px;padding:8px 11px;text-decoration:none;font-size:11px;font-weight:800}iframe{border:0;width:100%;height:100%;background:#f4f7fb}@media(max-width:600px){.title span,.open{display:none}.bar{padding:0 8px}}</style></head><body><header class="bar"><a class="back" href="./">← В приложение</a><div class="title"><b>Расширенная админка</b><span>Открыта внутри ЦУИМ Управление</span></div><a class="open" id="direct" href="../admin/">Обновить админку ↻</a></header><iframe id="adminFrame" title="Расширенная админка ЦУИМ"></iframe><script>const p=new URLSearchParams(location.search),requested=p.get('url')||'/admin/';let u;try{u=new URL(requested,location.origin)}catch{u=new URL('/admin/',location.origin)}if(u.origin!==location.origin||!u.pathname.startsWith('/admin/'))u=new URL('/admin/',location.origin);document.getElementById('adminFrame').src=u.pathname+u.search+u.hash;document.getElementById('direct').onclick=e=>{e.preventDefault()
