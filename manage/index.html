<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071633"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>ЦУИМ Управление</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./app.css"><style>.classified-mod-link{position:relative;text-decoration:none;display:inline-flex!important;align-items:center;gap:6px}.classified-mod-count{display:none;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#ef4444;color:#fff;align-items:center;justify-content:center;font-size:9px;font-weight:950}.classified-mod-link.has-items .classified-mod-count{display:inline-flex}.classified-mod-link.has-items{border-color:#fb7185!important;background:#fff1f2!important;color:#9f1239!important}@media(max-width:720px){.classified-mod-label{display:none}}</style></head><body><div id="login" class="login-screen"><form id="loginForm" class="login-card"><img src="../images/logo_cuim.png" alt="ЦУИМ"><div class="eyebrow">Control Center</div><h1>Управление ЦУИМ</h1><p>Браузерное приложение для управления городским маркетплейсом.</p><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Войти</button><div id="loginErr" class="msg error"></div></form></div><div id="app" class="app hidden"><aside class="sidebar"><div class="brand"><img src="../images/logo_cuim_white.png" alt="ЦУИМ"><small>Управление Marketplace</small></div><nav id="sideNav"></nav><div class="side-foot"><a href="../" target="_blank">Открыть сайт ↗</a><a href="./admin.html?url=%2Fadmin%2F">Расширенная админка →</a></div></aside><main><header class cation.href)}catch{return}if(u.origin===location.origin&&u.pathname.startsWith('/admin/')){e.preventDefault();const target=u.pathname+u.search+u.hash;location.href='./admin.html?url='+encodeURIComponent(target)}},true);</script></body></html>
