<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЦУИМ — товары, услуги и исполнители</title><meta name="description" content="ЦУИМ — Центральный универсальный интернет магазин. Товары, услуги и исполнители рядом."><link rel="icon" href="images/logo_cuim.png"><style>:root{--blue:#2563eb;--violet:#7c3aed;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}.wrap{width:min(1280px,calc(100% - 28px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.topin{min-height:88px;display:flex;align-items:center;gap:18px}.brand{flex:0 0 300px}.brand img{width:100%;height:70px;object-fit:contain}.nav{display:flex;gap:18px;margin-left:auto}.nav a{color:#334155;text-decoration:none;font-weight:800}.actions{display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.light{background:#fff;color:#334155;border:1px solid var(--line)}.hero{padding:45px 0;background:#fff}.hero h1{font-size:clamp(40px,5vw,64px);margin:0 0 10px}.hero h1 span{color:#5b4cf0}.searchbar{background:#fff;border:1px solid var(--line);border-radius:20px;padding:11px;display:grid;grid-template-columns:1fr 230px auto;gap:8px;margin-top:-22px;box-shadow:0 18px 45px #0f172a14}.searchbar input,.searchbar select{padding:13px;border:1px solid var(--line);border-radius:11px}.tabs{display:flex;gap:8px;margin:26px 0 18px}.tab{padding:10px 16px;border:1px solid var(--line);background:#fff;border-radius:999px;font-weight:850}.tab.active{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.product{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}.product-img{height:205px;background:#eef2f7;display:grid;place-items:center;overflow:hidden}.product-img img{width:100%;height:100%;object-fit:cover}.body{padding:15px;display:flex;flex-direction:column;flex:1}.seller{font-size:12px;color:var(--blue);font-weight:900}.product h3{font-size:17px;margin:6px 0}.muted{color:var(--muted)}.price{font-size:21px;font-weight:950;margin-top:auto;padding-top:12px}.product-actions{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:11px}.ask{grid-column:1/-1}.fav{width:44px}.executors{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.executor{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.hidden{display:none!important}.empty{grid-column:1/-1;padding:40px;text-align:center}.notice{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:50}footer{margin-top:50px;background:#0b1736;color:#fff;padding:34px 0}@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}.nav{display:none}}@media(max-width:520px){.products{grid-template-columns:1fr}.brand{flex-basis:160px}.searchbar{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap topin"><a class="brand" href="./"><img src="images/logo_cuim.png" alt="ЦУИМ"></a><nav class="nav"><a href="#catalog">Каталог</a><a href="#executorsSection">Исполнители</a></nav><div class="actions"><a class="btn light" href="./cart.html">Корзина</a><a class="btn" id="accountLink" href="./login.html">Войти</a></div></div></header><section class="hero"><div class="wrap"><h1>Товары и услуги <span>в одном месте</span></h1><p class="muted">Выбирайте предложения, задавайте продавцам вопросы до заказа и оформляйте покупку, когда всё согласовано.</p></div></section><main class="wrap"><section class="searchbar"><input id="q" placeholder="Что ищете?"><select id="category"><option value="">Все категории</option></select><button class="btn" id="searchBtn">Найти</button></section><nav class="tabs" id="catalog"><button class="tab active" data-tab="products">Товары и услуги</button><button class="tab" data-tab="executors">Исполнители</button></nav><section id="productsSection"><div class="head"><div><h2>Каталог предложений</h2><div class="muted">Можно написать продавцу ещё до оформления заказа</div></div><b id="productCount"></b></div><div id="products" class="products"></div></section><section id="executorsSection" class="hidden"><div class="head"><h2>Исполнители</h2></div><div id="executors" class="executors"></div></section></main><footer><div class="wrap">ЦУИМ · Товары · Услуги · Решения · Для всех</div></footer><div class="notice" id="notice"></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])),money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB'}).format(Number(v||0)),KEY='cuim-cart:v1';let products=[],allProducts=[],session=null,favorites=new Set;function toast(t){$('notice').textContent=t;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2200)}function cart(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function addCart(id){const a=cart(),x=a.find(v=>v.product_id===id);x?x.quantity++:a.push({product_id:id,quantity:1});localStorage.setItem(KEY,JSON.stringify(a));toast('Добавлено в корзину')}async function auth(){const{data:{session:x}}=await s.auth.getSession();session=x;if(x){$('accountLink').textContent='Личный кабинет';$('accountLink').href='./account.html';const{data}=await s.from('marketplace_favorites').select('product_id');favorites=new Set((data||[]).map(x=>x.product_id))}}function card(x){return`<article class="product"><div class="product-img">${x.image_url?`<img src="${esc(x.image_url)}" loading="lazy">`:'<span class="muted">Нет фото</span>'}</div><div class="body"><div class="seller">${esc(x.partner_name)}</div><h3>${esc(x.title)}</h3><div class="muted">${esc(x.category||'Товар')}</div><div class="price">${x.price==null?'Цена по запросу':money(x.price)} ${x.unit?'/ '+esc(x.unit):''}</div><div class="product-actions"><button class="btn" data-cart="${x.id}">В корзину</button><button class="btn light fav" data-fav="${x.id}">${favorites.has(x.id)?'♥':'♡'}</button><button class="btn light ask" data-ask="${x.id}">Написать продавцу</button></div></div></article>`}function renderProducts(){$('productCount').textContent=products.length?products.length+' поз.':'';$('products').innerHTML=products.map(card).join('')||'<div class="empty">Ничего не найдено</div>';document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>addCart(b.dataset.cart));document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>toggleFav(b.dataset.fav));document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>askSeller(b.dataset.ask))}async function askSeller(id){if(!session){location.href='./login.html?next='+encodeURIComponent('index.html?ask='+id);return}const{data,error}=await s.rpc('marketplace_open_product_conversation',{p_product_id:id});if(error){toast(error.message);return}location.href='./messages.html?conversation='+encodeURIComponent(data)}async function toggleFav(id){if(!session){location.href='./login.html';return}if(favorites.has(id)){await s.from('marketplace_favorites').delete().eq('product_id',id);favorites.delete(id)}else{await s.from('marketplace_favorites').insert({user_id:session.user.id,product_id:id});favorites.add(id)}renderProducts()}function renderExecutors(){const g=new Map;for(const x of allProducts){if(!g.has(x.partner_id))g.set(x.partner_id,{...x,items:[]});g.get(x.partner_id).items.push(x)}$('executors').innerHTML=[...g.values()].map(x=>`<article class="executor"><h3>${esc(x.partner_name)}</h3><div class="muted">${x.items.length} предложений</div><button class="btn light" data-seller="${x.partner_id}">Смотреть предложения</button></article>`).join('');document.querySelectorAll('[data-seller]').forEach(b=>b.onclick=()=>{products=allProducts.filter(x=>x.partner_id===b.dataset.seller);showTab('products');renderProducts()})}async function load(){const{data,error}=await s.rpc('marketplace_products',{p_query:$('q').value.trim()||null,p_category:$('category').value||null,p_partner_id:null});if(error){$('products').textContent=error.message;return}allProducts=data||[];products=[...allProducts];renderProducts();renderExecutors()}async function cats(){const{data}=await s.rpc('marketplace_product_categories');$('category').innerHTML='<option value="">Все категории</option>'+((data||[]).map(x=>`<option>${esc(x.category)}</option>`).join(''))}function showTab(n){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===n));$('productsSection').classList.toggle('hidden',n!=='products');$('executorsSection').classList.toggle('hidden',n!=='executors')}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>showTab(x.dataset.tab));$('searchBtn').onclick=load;$('q').onkeydown=e=>{if(e.key==='Enter')load()};$('category').onchange=load;await auth();await cats();await load();const ask=new URLSearchParams(location.search).get('ask');if(ask&&session)askSeller(ask);</script></body></html>
