<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Корзина — ЦУИМ</title><link rel="icon" href="images/logo_cuim.png"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8fc;color:#0f172a}.top{background:#fff;border-bottom:1px solid #e2e8f0}.topin,.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.topin{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{width:240px;max-height:66px;object-fit:contain}.btn{border:0;border-radius:11px;padding:11px 14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:850;text-decoration:none;cursor:pointer}.btn.light{background:#fff;color:#334155;border:1px solid #cbd5e1}.wrap{padding:28px 0 60px}.grid{display:grid;grid-template-columns:1.45fr .75fr;gap:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:14px}.item{display:grid;grid-template-columns:74px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #eef2f7}.item:first-child{border-top:0}.item img{width:74px;height:74px;border-radius:12px;object-fit:cover;background:#f1f5f9}.muted{color:#64748b;font-size:13px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:32px;height:32px;border:1px solid #cbd5e1;background:#fff;border-radius:9px;cursor:pointer}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.field textarea{min-height:90px}.total{font-size:26px;font-weight:950;margin:12px 0}.empty{padding:38px;text-align:center;color:#94a3b8}.success{padding:18px;border-radius:14px;background:#ecfdf5;color:#166534;margin-top:12px}.danger{color:#b91c1c}@media(max-width:760px){.grid{grid-template-columns:1fr}.topin{min-height:70px}.logo{width:170px}.item{grid-template-columns:58px 1fr}.item img{width:58px;height:58px}.item>div:last-child{grid-column:2}.btn{font-size:13px}}</style></head><body><header class="top"><div class="topin"><a href="./"><img class="logo" src="images/logo_cuim.png" alt="ЦУИМ"></a><a class="btn light" href="./">← В каталог</a></div></header><main class="wrap"><h1>Корзина</h1><div class="grid"><section><div id="cart"></div></section><aside class="card"><h2>Оформление</h2><div class="muted">Товары разных компаний автоматически оформляются отдельными заказами каждому исполнителю.</div><div class="field"><label>Имя</label><input id="name"></div><div class="field"><label>Телефон</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Получение</label><select id="delivery"><option value="PICKUP">Самовывоз</option><option value="DELIVERY">Доставка</option></select></div><div class="field"><label>Город</label><input id="city"></div><div class="field" id="addressField"><label>Адрес</label><input id="address"></div><div class="field"><label>Комментарий</label><textarea id="comment" placeholder="Пожелания к заказу"></textarea></div><div class="total" id="total">0 ₽</div><button class="btn" id="checkout" style="width:100%">Оформить заказ</button><div id="msg"></div></aside></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'),$=id=>document.getElementById(id),KEY='cuim-cart:v1',money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:2}).format(Number(v||0)),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));let cart=JSON.parse(localStorage.getItem(KEY)||'[]'),products=[];function save(){localStorage.setItem(KEY,JSON.stringify(cart));render()}async function loadProducts(){const{data,error}=await s.rpc('marketplace_products',{p_query:null,p_category:null,p_partner_id:null});if(error){$('cart').innerHTML='<div class="card danger">'+esc(error.message)+'</div>';return}products=(data||[]).filter(p=>cart.some(c=>c.product_id===p.id));render()}function render(){const groups=new Map();for(const c of cart){const p=products.find(x=>x.id===c.product_id);if(!p)continue;if(!groups.has(p.partner_id))groups.set(p.partner_id,{name:p.partner_name,items:[]});groups.get(p.partner_id).items.push({c,p})}let total=0,html='';for(const g of groups.values()){html+=`<div class="card"><h3>${esc(g.name)}</h3>`;for(const{c,p}of g.items){total+=Number(p.price||0)*Number(c.quantity||1);html+=`<div class="item">${p.image_url?`<img src="${esc(p.image_url)}">`:'<div></div>'}<div><b>${esc(p.title)}</b><div class="muted">${p.price==null?'Цена по запросу':money(p.price)} ${p.unit?' / '+esc(p.unit):''}</div></div><div><div class="qty"><button data-minus="${p.id}">−</button><b>${Number(c.quantity||1)}</b><button data-plus="${p.id}">+</button></div><button data-remove="${p.id}" style="border:0;background:none;color:#b91c1c;margin-top:8px;cursor:pointer">Удалить</button></div></div>`}html+='</div>'}$('cart').innerHTML=html||'<div class="card empty">Корзина пуста. <a href="./">Перейти в каталог</a></div>';$('total').textContent=money(total);document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const c=cart.find(x=>x.product_id===b.dataset.plus);c.quantity=(Number(c.quantity)||1)+1;save()});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const c=cart.find(x=>x.product_id===b.dataset.minus);c.quantity=Math.max(1,(Number(c.quantity)||1)-1);save()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.product_id!==b.dataset.remove);save()});$('checkout').disabled=!cart.length}const{data:{session}}=await s.auth.getSession();if(session){$('email').value=session.user.email||'';const{data:p}=await s.from('marketplace_profiles').select('*').eq('user_id',session.user.id).maybeSingle();$('name').value=p?.full_name||session.user.user_metadata?.full_name||'';$('phone').value=p?.phone||'';$('city').value=p?.city||''}$('delivery').onchange=()=>{$('addressField').style.display=$('delivery').value==='DELIVERY'?'grid':'none'};$('delivery').dispatchEvent(new Event('change'));$('checkout').onclick=async()=>{if(!session){location.href='./login.html?next=cart.html';return}if(!cart.length)return;const btn=$('checkout');btn.disabled=true;btn.textContent='Создаём заказы…';$('msg').textContent='';const{data,error}=await s.rpc('checkout_marketplace_cart',{p_items:cart.map(x=>({product_id:x.product_id,quantity:Number(x.quantity)||1})),p_customer_name:$('name').value.trim(),p_customer_phone:$('phone').value.trim(),p_customer_email:$('email').value.trim(),p_delivery_method:$('delivery').value,p_delivery_city:$('city').value.trim(),p_delivery_address:$('delivery').value==='DELIVERY'?$('address').value.trim():null,p_comment:$('comment').value.trim()});if(error){$('msg').className='danger';$('msg').textContent='Ошибка: '+error.message;btn.disabled=false;btn.textContent='Оформить заказ';return}localStorage.removeItem(KEY);cart=[];render();$('msg').className='success';$('msg').innerHTML=`Заказ оформлен. Создано заказов: <b>${(data||[]).length}</b>. <a href="./account.html">Открыть личный кабинет</a>`;btn.textContent='Готово'};await loadProducts();</script></body></html>
