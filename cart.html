<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Корзина — ЦУИМ</title><link rel="icon" href="images/logo_cuim.png"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8fc;color:#0f172a}.top{background:#fff;border-bottom:1px solid #e2e8f0}.topin,.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.topin{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{width:240px;max-height:66px;object-fit:contain}.btn{border:0;border-radius:11px;padding:11px 14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:850;text-decoration:none;cursor:pointer}.btn.light{background:#fff;color:#334155;border:1px solid #cbd5e1}.wrap{padding:28px 0 60px}.grid{display:grid;grid-template-columns:1.45fr .75fr;gap:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:14px}.seller-head{display:flex;justify-content:space-between;align-items:start;gap:12px}.item{display:grid;grid-template-columns:74px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #eef2f7}.item img{width:74px;height:74px;border-radius:12px;object-fit:cover;background:#f1f5f9}.muted{color:#64748b;font-size:13px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:32px;height:32px;border:1px solid #cbd5e1;background:#fff;border-radius:9px;cursor:pointer}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.field textarea{min-height:90px}.delivery-box{margin-top:14px;padding:14px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0}.delivery-box label{font-size:12px;font-weight:850}.delivery-meta{margin-top:7px;color:#64748b;font-size:12px;line-height:1.5}.seller-total{margin-top:10px;font-weight:900}.total{font-size:26px;font-weight:950;margin:12px 0}.summary-row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.empty{padding:38px;text-align:center;color:#94a3b8}.success{padding:18px;border-radius:14px;background:#ecfdf5;color:#166534;margin-top:12px}.danger{color:#b91c1c}@media(max-width:760px){.grid{grid-template-columns:1fr}.topin{min-height:70px}.logo{width:170px}.item{grid-template-columns:58px 1fr}.item img{width:58px;height:58px}.item>div:last-child{grid-column:2}.btn{font-size:13px}}</style><script src="/maintenance-guard.js"></script>
</head><body><header class="top"><div class="topin"><a href="./"><img class="logo" src="images/logo_cuim.png" alt="ЦУИМ"></a><a class="btn light" href="./">← В каталог</a></div></header><main class="wrap"><h1>Корзина</h1><div class="grid"><section><div id="cart"></div></section><aside class="card"><h2>Оформление</h2><div class="muted">Для каждого продавца можно выбрать свой способ получения. ЦУИМ создаст отдельный заказ каждому исполнителю.</div><div class="field"><label>Имя</label><input id="name"></div><div class="field"><label>Телефон</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Город</label><input id="city"></div><div class="field" id="addressField"><label>Адрес доставки</label><input id="address" placeholder="Улица, дом, квартира/офис"></div><div class="field"><label>Комментарий</label><textarea id="comment" placeholder="Пожелания к заказу"></textarea></div><div class="summary-row"><span>Товары</span><b id="goodsTotal">0 ₽</b></div><div class="summary-row"><span>Доставка</span><b id="deliveryTotal">0 ₽</b></div><div class="total" id="total">0 ₽</div><button class="btn" id="checkout" style="width:100%">Оформить заказ</button><div id="msg"></div></aside></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'),$=id=>document.getElementById(id),KEY='cuim-cart:v1',money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:2}).format(Number(v||0)),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));let cart=JSON.parse(localStorage.getItem(KEY)||'[]'),products=[],methods=[],selected={};function save(){localStorage.setItem(KEY,JSON.stringify(cart));render()}async function loadProducts(){const[{data,error},{data:m}]=await Promise.all([s.rpc('marketplace_products',{p_query:null,p_category:null,p_partner_id:null}),s.from('partner_delivery_methods').select('*').eq('is_active',true).order('sort_order')]);if(error){$('cart').innerHTML='<div class="card danger">'+esc(error.message)+'</div>';return}products=(data||[]).filter(p=>cart.some(c=>c.product_id===p.id));methods=m||[];for(const p of products){if(selected[p.partner_id])continue;const opts=methods.filter(x=>x.partner_id===p.partner_id);if(opts.length)selected[p.partner_id]=opts[0].id}render()}function methodPrice(method,goods){if(!method)return 0;if(method.free_from!=null&&goods>=Number(method.free_from))return 0;return Number(method.price||0)}function render(){const groups=new Map();for(const c of cart){const p=products.find(x=>x.id===c.product_id);if(!p)continue;if(!groups.has(p.partner_id))groups.set(p.partner_id,{id:p.partner_id,name:p.partner_name,items:[]});groups.get(p.partner_id).items.push({c,p})}let goodsAll=0,deliveryAll=0,html='',needsAddress=false;for(const g of groups.values()){let goods=0;for(const{c,p}of g.items)goods+=Number(p.price||0)*Number(c.quantity||1);goodsAll+=goods;const opts=methods.filter(x=>x.partner_id===g.id);let method=opts.find(x=>x.id===selected[g.id])||opts[0]||null;if(method)selected[g.id]=method.id;const dprice=methodPrice(method,goods);deliveryAll+=dprice;if(method&&!['PICKUP','DIGITAL'].includes(method.code))needsAddress=true;html+=`<div class="card"><div class="seller-head"><div><h3 style="margin:0">${esc(g.name)}</h3><div class="muted">Товары этого продавца оформятся отдельным заказом</div></div><b>${money(goods)}</b></div>`;for(const{c,p}of g.items){html+=`<div class="item">${p.image_url?`<img src="${esc(p.image_url)}">`:'<div></div>'}<div><b>${esc(p.title)}</b><div class="muted">${p.price==null?'Цена по запросу':money(p.price)} ${p.unit?' / '+esc(p.unit):''}</div></div><div><div class="qty"><button data-minus="${p.id}">−</button><b>${Number(c.quantity||1)}</b><button data-plus="${p.id}">+</button></div><button data-remove="${p.id}" style="border:0;background:none;color:#b91c1c;margin-top:8px;cursor:pointer">Удалить</button></div></div>`}html+=`<div class="delivery-box"><label>Получение заказа</label>`;if(opts.length){html+=`<select data-delivery="${g.id}" style="width:100%;margin-top:7px;padding:11px;border:1px solid #cbd5e1;border-radius:10px">${opts.map(x=>`<option value="${x.id}" ${x.id===method?.id?'selected':''}>${esc(x.title)}${methodPrice(x,goods)?' · '+money(methodPrice(x,goods)):' · бесплатно'}</option>`).join('')}</select><div class="delivery-meta">${esc(method?.description||'')}${method?.city?' · '+esc(method.city):''}${method?.eta_text?' · '+esc(method.eta_text):''}${method?.free_from!=null?' · бесплатно от '+money(method.free_from):''}</div><div class="seller-total">Итого у продавца: ${money(goods+dprice)}</div>`}else{html+=`<div class="delivery-meta">Продавец пока не настроил доставку. Заказ будет оформлен как самовывоз, детали можно согласовать с исполнителем.</div><div class="seller-total">Итого у продавца: ${money(goods)}</div>`}html+='</div></div>'}$('cart').innerHTML=html||'<div class="card empty">Корзина пуста. <a href="./">Перейти в каталог</a></div>';$('goodsTotal').textContent=money(goodsAll);$('deliveryTotal').textContent=money(deliveryAll);$('total').textContent=money(goodsAll+deliveryAll);$('addressField').style.display=needsAddress?'grid':'none';document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const c=cart.find(x=>x.product_id===b.dataset.plus);c.quantity=(Number(c.quantity)||1)+1;save()});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const c=cart.find(x=>x.product_id===b.dataset.minus);c.quantity=Math.max(1,(Number(c.quantity)||1)-1);save()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.product_id!==b.dataset.remove);save()});document.querySelectorAll('[data-delivery]').forEach(el=>el.onchange=()=>{selected[el.dataset.delivery]=el.value;render()});$('checkout').disabled=!cart.length}const{data:{session}}=await s.auth.getSession();if(session){$('email').value=session.user.email||'';const{data:p}=await s.from('marketplace_profiles').select('*').eq('user_id',session.user.id).maybeSingle();$('name').value=p?.full_name||session.user.user_metadata?.full_name||'';$('phone').value=p?.phone||'';$('city').value=p?.city||''}$('checkout').onclick=async()=>{if(!session){location.href='./login.html?next=cart.html';return}if(!cart.length)return;const selections={};for(const p of products){if(selected[p.partner_id])selections[p.partner_id]={method_id:selected[p.partner_id]}}const needsDelivery=Object.values(selected).some(id=>{const m=methods.find(x=>x.id===id);return m&&!['PICKUP','DIGITAL'].includes(m.code)});if(needsDelivery&&!$('address').value.trim()){$('msg').className='danger';$('msg').textContent='Укажите адрес доставки';return}const btn=$('checkout');btn.disabled=true;btn.textContent='Создаём заказы…';$('msg').textContent='';const{data,error}=await s.rpc('checkout_marketplace_cart_v2',{p_items:cart.map(x=>({product_id:x.product_id,quantity:Number(x.quantity)||1})),p_customer_name:$('name').value.trim(),p_customer_phone:$('phone').value.trim(),p_customer_email:$('email').value.trim(),p_delivery_city:$('city').value.trim(),p_delivery_address:$('address').value.trim()||null,p_comment:$('comment').value.trim(),p_delivery_selections:selections});if(error){$('msg').className='danger';$('msg').textContent='Ошибка: '+error.message;btn.disabled=false;btn.textContent='Оформить заказ';return}localStorage.removeItem(KEY);cart=[];render();$('msg').className='success';$('msg').innerHTML=`Заказ оформлен. Создано заказов: <b>${(data||[]).length}</b>. <a href="./account.html">Открыть личный кабинет</a>`;btn.textContent='Готово'};await loadProducts();</script></body></html>
