<style>
:root{--b:#2563eb;--v:#7c3aed;--ink:#0f172a;--m:#64748b;--line:#e2e8f0;--bg:#f6f8fc;--nav:#071633;--green:#059669;--red:#b91c1c;--amber:#b45309}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,a,input,textarea,select{font:inherit}.wrap{width:min(1220px,calc(100% - 28px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}.topin{min-height:78px;display:flex;align-items:center;gap:18px}.logo{width:215px;max-height:58px;object-fit:contain}.top-actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:13px;min-height:44px;padding:10px 16px;background:linear-gradient(135deg,var(--b),var(--v));color:#fff;font-weight:900;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.light{background:#fff;color:#334155;border:1px solid var(--line)}.btn.soft{background:#eef2ff;color:#3730a3}.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}.btn:disabled{opacity:.5;cursor:not-allowed}.main{padding:26px 0 64px}.head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:17px}.head h1{font-size:34px;margin:0}.head p{margin:5px 0 0;color:var(--m);font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,.72fr);gap:18px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:21px;box-shadow:0 8px 28px #0f172a08}.seller-card{padding:19px;margin-bottom:14px}.seller-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:10px}.seller-head h3{margin:0;font-size:17px}.muted{color:var(--m);font-size:12px;line-height:1.5}.seller-total-top{font-size:17px;font-weight:950}.item{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #eef2f7}.photo{width:82px;height:82px;border-radius:14px;background:#f1f5f9;display:grid;place-items:center;overflow:hidden;color:#94a3b8;font-size:11px}.photo img{width:100%;height:100%;object-fit:contain;padding:4px}.item-title{font-weight:850;line-height:1.35;text-decoration:none;color:var(--ink)}.item-title:hover{color:var(--b)}.item-price{margin-top:6px;font-weight:900}.stock{font-size:11px;margin-top:5px;color:var(--green);font-weight:800}.stock.bad{color:var(--red)}.stock.warn{color:var(--amber)}.qty{display:flex;align-items:center;gap:7px;justify-content:flex-end}.qty button{width:34px;height:34px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;cursor:pointer;font-weight:900}.qty button:disabled{opacity:.35;cursor:not-allowed}.remove{border:0;background:none;color:var(--red);margin-top:8px;cursor:pointer;font-size:11px;font-weight:800;float:right}.delivery-box{margin-top:10px;padding:14px;border-radius:15px;background:#f8fafc;border:1px solid #e2e8f0}.delivery-box label{font-size:11px;font-weight:900;text-transform:uppercase;color:#475569}.delivery-box select{width:100%;margin-top:8px;padding:11px;border:1px solid #cbd5e1;border-radius:11px;background:#fff}.delivery-meta{margin-top:8px;color:var(--m);font-size:11px;line-height:1.55}.seller-total{margin-top:10px;font-weight:900}.checkout-card{padding:20px;position:sticky;top:96px}.checkout-card h2{margin:0 0 5px}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:11px;font-weight:900;color:#475569}.field input,.field textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;outline:none}.field input:focus,.field textarea:focus{border-color:#818cf8;box-shadow:0 0 0 3px #eef2ff}.field textarea{min-height:82px;resize:vertical}.summary{border-top:1px solid #eef2f7;margin-top:17px;padding-top:13px}.summary-row{display:flex;justify-content:space-between;gap:12px;margin:8px 0;font-size:13px}.total{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:14px 0 16px}.total b{font-size:28px}.notice{border-radius:15px;padding:13px 14px;margin-bottom:14px;font-size:12px;line-height:1.55}.notice.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}.notice.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.notice.good{background:#ecfdf5;color:#166534;border:1px solid #a7f3d0}.empty{padding:48px 24px;text-align:center;color:#94a3b8}.empty strong{display:block;color:var(--ink);font-size:20px;margin-bottom:7px}.invalid-card{padding:17px;margin-bottom:14px;border-color:#fed7aa;background:#fffbeb}.invalid-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #fde68a}.invalid-row:first-of-type{border-top:0}.invalid-row b{font-size:13px}.success{padding:24px}.success h2{margin:0 0 7px;color:#166534}.order-link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid #dcfce7;color:inherit;text-decoration:none}.order-link:first-of-type{margin-top:12px}.order-link span{font-size:12px;color:#64748b}.order-link b:last-child{white-space:nowrap}.success-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}@media(max-width:860px){.grid{grid-template-columns:1fr}.checkout-card{position:static}.logo{width:178px}.head h1{font-size:30px}}@media(max-width:560px){.wrap{width:min(100% - 18px,1220px)}.topin{min-height:68px}.logo{width:158px}.top-actions .catalog-text{display:none}.main{padding-top:18px}.head{align-items:flex-start}.head h1{font-size:28px}.item{grid-template-columns:65px 1fr}.photo{width:65px;height:65px}.item>div:last-child{grid-column:2}.qty{justify-content:flex-start;margin-top:6px}.remove{float:none}.seller-head{display:block}.seller-total-top{margin-top:8px}.checkout-card{padding:17px}.success-actions .btn{width:100%}}
.stock.order{color:#6d28d9}

<body>
<header class="top"><div class="wrap topin"><a href="/"><img class="logo" src="/images/logo_cuim.png" alt="ЦУИМ"></a><div class="top-actions"><a class="btn light" href="/catalog/"><span>←</span><span class="catalog-text">В каталог</span></a><a class="btn light" href="/account.html">Кабинет</a></div></div></header>
<main class="wrap main"><div class="head"><div><h1>Корзина</h1><p id="cartCaption">Проверяем товары и условия получения…</p></div></div><div id="pageNotice"></div><div class="grid" id="cartGrid"><section><div id="cart"></div></section><aside class="card checkout-card" id="checkoutCard"><h2>Оформление</h2><div class="muted">Если товары у разных продавцов, ЦУИМ создаст отдельный заказ каждому.</div><div class="field"><label>Имя *</label><input id="name" autocomplete="name"></div><div class="field"><label>Телефон</label><input id="phone" type="tel" autocomplete="tel"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Город</label><input id="city" autocomplete="address-level2"></div><div class="field" id="addressField" style="display:none"><label>Адрес доставки *</label><input id="address" autocomplete="street-address" placeholder="Улица, дом, квартира/офис"></div><div class="field"><label>Комментарий</label><textarea id="comment" placeholder="Пожелания к заказу"></textarea></div><div class="summary"><div class="summary-row"><span>Товары</span><b id="goodsTotal">0 ₽</b></div><div class="summary-row"><span>Доставка</span><b id="deliveryTotal">0 ₽</b></div><div class="total"><span>Итого</span><b id="total">0 ₽</b></div></div><button class="btn" id="checkout" style="width:100%">Оформить заказ</button><div id="msg" style="margin-top:12px"></div></aside></div><div id="successBox"></div></main>
<script type="module">
import'/geo-core.js';
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';
const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu');
const $=id=>document.getElementById(id),KEY='cuim-cart:v1',INTENT='cuim-checkout-intent:v1';
const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:2}).format(Number(v||0));
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let cart=[],products=[],methods=[],selected={},session=null,blocking=[];
function readCart(){let a=[];try{a=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}const map=new Map;for(const x of Array.isArray(a)?a:[]){const id=String(x?.product_id||'').trim();if(!id)continue;const q=Math.max(1,Math.min(99,Math.trunc(Number(x?.quantity)||1)));const prev=map.get(id);map.set(id,{product_id:id,quantity:Math.min(99,(prev?.quantity||0)+q)})}return[...map.values()]}
function cartSignature(){return JSON.stringify(cart.slice().sort((a,b)=>a.product_id.localeCompare(b.product_id)))}
function resetIntent(){localStorage.removeItem(INTENT)}
function checkoutKey(){const sig=cartSignature();try{const x=JSON.parse(localStorage.getItem(INTENT)||'{}');if(x.signature===sig&&x.key)return x.key}catch{}const key=crypto.randomUUID();localStorage.setItem(INTENT,JSON.stringify({signature:sig,key}));return key}
function save(){localStorage.setItem(KEY,JSON.stringify(cart));resetIntent();render()}
function cartEligible(p){return ['PRODUCT','FOOD'].includes(p?.marketplace_offer_type)}
function methodAllowed(m,items){const ps=(items||[]).map(x=>x.p||x).filter(Boolean);if(m.code==='PICKUP')return ps.every(p=>p.marketplace_offer_type!=='PRODUCT'||p.marketplace_details?.pickup!==false);if(m.code==='DIGITAL')return true;return ps.every(p=>p.marketplace_offer_type!=='PRODUCT'||p.marketplace_details?.delivery!==false)}
function methodPrice(m,goods){if(!m)return 0;if(m.free_from!=null&&goods>=Number(m.free_from))return 0;return Number(m.price||0)}
const STOCK_STATES=['IN_STOCK','LOW_STOCK','ON_ORDER','OUT_OF_STOCK'];function stockStatus(p){const explicit=p?.marketplace_details?.stock_status;if(STOCK_STATES.includes(explicit))return explicit;if(p?.quantity==null)return'IN_STOCK';const n=Number(p.quantity);if(!Number.isFinite(n))return'IN_STOCK';if(n<=0)return'OUT_OF_STOCK';if(n<=3)return'LOW_STOCK';return'IN_STOCK'}function stockMax(p){if(stockStatus(p)==='OUT_OF_STOCK')return 0;const n=Number(p?.quantity);return p?.quantity==null||!Number.isFinite(n)?99:Math.max(0,Math.min(99,Math.trunc(n)))}function stockText(p,q){const st=stockStatus(p),n=Number(p?.quantity);if(st==='OUT_OF_STOCK')return['Нет в наличии','bad'];if(st==='ON_ORDER')return['Под заказ','order'];if(Number.isFinite(n)&&q>n)return[`Доступно только ${n}`,'bad'];if(st==='LOW_STOCK')return[Number.isFinite(n)&&n>0?`Осталось ${n}`:'Ограниченный остаток','warn'];return[Number.isFinite(n)&&n>0?`В наличии: ${n}`:'В наличии','']}
function errorText(raw){const x=String(raw||'');if(x.includes('AUTH_REQUIRED'))return'Войдите в аккаунт, чтобы оформить заказ.';if(x.includes('CART_EMPTY'))return'Корзина пуста.';if(x.includes('CUSTOMER_NAME_REQUIRED'))return'Укажите имя получателя.';if(x.includes('CUSTOMER_CONTACT_REQUIRED'))return'Укажите телефон или email.';if(x.includes('PRODUCT_UNAVAILABLE'))return'Один из товаров больше недоступен. Обновите корзину.';if(x.includes('PRICE_REQUIRED'))return'У одного из товаров не указана цена. Его нельзя оформить через корзину.';if(x.includes('INSUFFICIENT_STOCK'))return'Количество одного из товаров превышает остаток. Уменьшите количество.';if(x.includes('DELIVERY_ADDRESS_REQUIRED'))return'Укажите адрес доставки.';if(x.includes('DELIVERY_CITY_REQUIRED'))return'Укажите город доставки.';if(x.includes('MIN_ORDER'))return'Сумма заказа меньше минимальной для выбранного способа доставки.';return x.replace(/^.*?message[: ]*/i,'')||'Не удалось оформить заказ.'}
async function loadAuth(){session=(await s.auth.getSession()).data.session;if(!session)return;const u=session.user;$('email').value=u.email||'';const{data:p}=await s.from('marketplace_profiles').select('full_name,phone,city').eq('user_id',u.id).maybeSingle();$('name').value=p?.full_name||u.user_metadata?.full_name||'';$('phone').value=p?.phone||u.user_metadata?.phone||'';const geo=window.CUIM_GEO?.get?.()||{};$('city').value=p?.city||geo.city_name||''}
async function loadProducts(){cart=readCart();if(!cart.length){products=[];methods=[];render();return}const ids=cart.map(x=>x.product_id);const[{data,error},{data:m,error:me}]=await Promise.all([s.rpc('marketplace_cart_products_v2',{p_product_ids:ids}),s.from('partner_delivery_methods').select('id,partner_id,code,title,description,price,free_from,min_order,city,eta_text,sort_order').eq('is_active',true).order('sort_order')]);if(error){$('pageNotice').innerHTML=`<div class="notice error">Не удалось проверить корзину: ${esc(error.message)}</div>`;return}products=data||[];methods=me?[]:(m||[]);for(const p of products){if(selected[p.partner_id])continue;const opts=methods.filter(x=>x.partner_id===p.partner_id);if(opts.length)selected[p.partner_id]=opts[0].id}render()}
function renderInvalid(){const found=new Map(products.map(x=>[x.id,x])),rows=[];for(const c of cart){const p=found.get(c.product_id);let reason='';if(!p)reason='Предложение снято с публикации или больше недоступно';else if(!cartEligible(p))reason='Это предложение оформляется через заявку, а не через корзину';else if(p.price==null)reason='Продавец не указал фиксированную цену';else if(p.currency!=='RUB')reason='Эта валюта пока не поддерживается в корзине';else if(stockStatus(p)==='OUT_OF_STOCK')reason='Товар сейчас нет в наличии';else if(p.quantity!=null&&Number(p.quantity)<Number(c.quantity))reason=`Недостаточный остаток — доступно ${p.quantity}`;if(reason)rows.push({c,p,reason})}blocking=rows;return rows}
function render(){const invalid=renderInvalid(),invalidIds=new Set(invalid.map(x=>x.c.product_id)),groups=new Map;for(const c of cart){if(invalidIds.has(c.product_id))continue;const p=products.find(x=>x.id===c.product_id);if(!p||!cartEligible(p)||p.price==null)continue;if(!groups.has(p.partner_id))groups.set(p.partner_id,{id:p.partner_id,name:p.partner_name||'Продавец',items:[]});groups.get(p.partner_id).items.push({c,p})}let goodsAll=0,deliveryAll=0,html='',needsAddress=false,itemCount=0,receivingBlocked=false;
if(invalid.length){html+=`<div class="card invalid-card"><b>Нужно проверить ${invalid.length} ${invalid.length===1?'позицию':'позиции'}</b><div class="muted">Эти предложения не попадут в заказ, пока проблема не исправлена.</div>${invalid.map(x=>`<div class="invalid-row"><div><b>${esc(x.p?.title||'Недоступное предложение')}</b><div class="muted">${esc(x.reason)}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${x.p?`<a class="btn light" href="/offer.html?id=${encodeURIComponent(x.c.product_id)}">Открыть</a>`:''}<button class="btn danger" data-remove="${x.c.product_id}">Удалить</button></div></div>`).join('')}</div>`}
for(const g of groups.values()){let goods=0;for(const{c,p}of g.items){goods+=Number(p.price)*Number(c.quantity);itemCount+=Number(c.quantity)}goodsAll+=goods;const opts=methods.filter(x=>x.partner_id===g.id&&methodAllowed(x,g.items));let method=opts.find(x=>x.id===selected[g.id])||opts[0]||null;if(method)selected[g.id]=method.id;const dprice=methodPrice(method,goods);deliveryAll+=dprice;if(method&&!['PICKUP','DIGITAL'].includes(method.code))needsAddress=true;html+=`<div class="card seller-card"><div class="seller-head"><div><h3>${esc(g.name)}</h3><div class="muted">Будет создан отдельный заказ этому продавцу</div></div><div class="seller-total-top">${money(goods)}</div></div>`;for(const{c,p}of g.items){const[stock,stockClass]=stockText(p,c.quantity),max=stockMax(p);html+=`<div class="item"><a class="photo" href="/offer.html?id=${encodeURIComponent(p.id)}">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.title)}">`:'Нет фото'}</a><div><a class="item-title" href="/offer.html?id=${encodeURIComponent(p.id)}">${esc(p.title)}</a><div class="item-price">${money(p.price)} ${p.unit?`<span class="muted">/ ${esc(p.unit)}</span>`:''}</div><div class="stock ${stockClass}">${esc(stock)}</div></div><div><div class="qty"><button data-minus="${p.id}" aria-label="Уменьшить">−</button><b>${c.quantity}</b><button data-plus="${p.id}" aria-label="Увеличить" ${c.quantity>=max?'disabled':''}>+</button></div><button class="remove" data-remove="${p.id}">Удалить</button></div></div>`}html+=`<div class="delivery-box"><label>Получение заказа</label>`;if(opts.length){html+=`<select data-delivery="${g.id}">${opts.map(x=>{const mp=methodPrice(x,goods);return`<option value="${x.id}" ${x.id===method?.id?'selected':''}>${esc(x.title)} · ${mp?money(mp):'бесплатно'}</option>`}).join('')}</select><div class="delivery-meta">${esc(method?.description||'')}${method?.city?' · '+esc(method.city):''}${method?.eta_text?' · '+esc(method.eta_text):''}${method?.free_from!=null?' · бесплатно от '+money(method.free_from):''}${method?.min_order!=null?' · минимум '+money(method.min_order):''}</div><div class="seller-total">Итого у продавца: ${money(goods+dprice)}</div>`}else{const deliveryOnly=g.items.some(({p})=>p.marketplace_offer_type==='PRODUCT'&&p.marketplace_details?.delivery===true&&p.marketplace_details?.pickup===false);if(deliveryOnly){receivingBlocked=true;html+=`<div class="delivery-meta" style="color:#b91c1c">Для этого товара продавец включил доставку, но активный способ доставки сейчас не настроен. Оформление временно недоступно.</div><div class="seller-total">Итого у продавца: ${money(goods)}</div>`}else{html+=`<div class="delivery-meta">Способы получения пока не настроены. Заказ оформится как самовывоз, детали можно согласовать с продавцом.</div><div class="seller-total">Итого у продавца: ${money(goods)}</div>`}}html+='</div></div>'}
$('cart').innerHTML=html||'<div class="card empty"><strong>Корзина пуста</strong>Добавьте товар из каталога.<div style="margin-top:14px"><a class="btn" href="/catalog/">Перейти в каталог</a></div></div>';$('goodsTotal').textContent=money(goodsAll);$('deliveryTotal').textContent=money(deliveryAll);$('total').textContent=money(goodsAll+deliveryAll);$('addressField').style.display=needsAddress?'grid':'none';$('cartCaption').textContent=itemCount?`${itemCount} поз. · ${groups.size} ${groups.size===1?'продавец':'продавца/продавцов'}`:'Здесь появятся товары, которые можно оформить онлайн';const canCheckout=cart.length>0&&groups.size>0&&!blocking.length&&!receivingBlocked;$('checkout').disabled=!canCheckout;
document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const c=cart.find(x=>x.product_id===b.dataset.plus);if(!c)return;const p=products.find(x=>x.id===c.product_id),max=stockMax(p);c.quantity=Math.min(max,c.quantity+1);save()});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const c=cart.find(x=>x.product_id===b.dataset.minus);if(!c)return;c.quantity=Math.max(1,c.quantity-1);save()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.product_id!==b.dataset.remove);save();loadProducts()});document.querySelectorAll('[data-delivery]').forEach(el=>el.onchange=()=>{selected[el.dataset.delivery]=el.value;render()})}
function showSuccess(orders){$('cartGrid').style.display='none';$('pageNotice').innerHTML='';$('cartCaption').textContent='Заказ успешно передан продавцу';$('successBox').innerHTML=`<div class="card success"><h2>✓ Заказ оформлен</h2><div class="muted">${orders.length>1?`Мы создали ${orders.length} отдельных заказа — по одному каждому продавцу.`:'Продавец получил новый заказ. Статус можно отслеживать в личном кабинете.'}</div>${orders.map(o=>`<a class="order-link" href="/order.html?id=${encodeURIComponent(o.order_id)}"><div><b>${esc(o.partner_name||'Продавец')}</b><span>Заказ ${esc(String(o.order_id).slice(0,8).toUpperCase())} · ${esc(o.delivery_method_title||'Самовывоз')}</span></div><b>${money(o.order_total)} →</b></a>`).join('')}<div class="success-actions"><a class="btn" href="/account.html">Мои заказы</a><a class="btn light" href="/catalog/">Продолжить покупки</a></div></div>`}
await window.CUIM_GEO?.ready?.catch?.(()=>{});await loadAuth();await loadProducts();
$('checkout').onclick=async()=>{if(!session){location.href='/login.html?next='+encodeURIComponent('/cart.html');return}if(!cart.length||blocking.length)return;const name=$('name').value.trim(),phone=$('phone').value.trim(),email=$('email').value.trim();if(!name){$('msg').innerHTML='<div class="notice error">Укажите имя получателя.</div>';$('name').focus();return}if(!phone&&!email){$('msg').innerHTML='<div class="notice error">Укажите телефон или email.</div>';$('phone').focus();return}const selections={};for(const p of products){if(cartEligible(p)&&selected[p.partner_id])selections[p.partner_id]={method_id:selected[p.partner_id]}}const needsDelivery=Object.values(selected).some(mid=>{const m=methods.find(x=>x.id===mid);return m&&!['PICKUP','DIGITAL'].includes(m.code)});if(needsDelivery&&!$('city').value.trim()){$('msg').innerHTML='<div class="notice error">Укажите город доставки.</div>';$('city').focus();return}if(needsDelivery&&!$('address').value.trim()){$('msg').innerHTML='<div class="notice error">Укажите адрес доставки.</div>';$('address').focus();return}const btn=$('checkout');btn.disabled=true;btn.textContent='Создаём заказ…';$('msg').innerHTML='';const payload=cart.map(x=>({product_id:x.product_id,quantity:Number(x.quantity)||1}));const{data,error}=await s.rpc('checkout_marketplace_cart_v3',{p_items:payload,p_customer_name:name,p_customer_phone:phone,p_customer_email:email,p_delivery_city:$('city').value.trim()||null,p_delivery_address:$('address').value.trim()||null,p_comment:$('comment').value.trim()||null,p_delivery_selections:selections,p_checkout_key:checkoutKey()});if(error){$('msg').innerHTML=`<div class="notice error">${esc(errorText(error.message))}</div>`;btn.disabled=false;btn.textContent='Оформить заказ';await loadProducts();return}try{await s.from('marketplace_profiles').upsert({user_id:session.user.id,full_name:name,phone,city:$('city').value.trim()||null,updated_at:new Date().toISOString()})}catch{}localStorage.removeItem(KEY);localStorage.removeItem(INTENT);cart=[];showSuccess(data||[])};
</script>
