name: Install favorites and verified reviews
on:
  push:
    paths:
      - '.github/workflows/install-favorites-reviews.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install favorites and reviews
        run: python .github/scripts/install_favorites_reviews.py
      - name: Check JavaScript
        run: |
          node --check marketplace-favorites.js
          node --check marketplace-reviews.js
          node --check marketplace-card-ui.js
          node --check catalog/catalog.js
      - name: Verify integration
        run: |
          grep -q '/marketplace-favorites.js' index.html
          grep -q '/marketplace-reviews.js' index.html
          grep -q '/marketplace-favorites.js' seller.html
          grep -q '/marketplace-reviews.js' seller.html
          grep -q '/marketplace-favorites.js' offer.html
          grep -q '/marketplace-reviews.js' offer.html
          grep -q '/marketplace-reviews.js' order.html
          grep -q "import'/marketplace-favorites.js';" catalog/catalog.js
          grep -q "import'/marketplace-reviews.js';" catalog/catalog.js
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html seller.html offer.html order.html account.html cart.html catalog/catalog.js
          if ! git diff --cached --quiet; then
            git commit -m 'Connect favorites and verified reviews'
            git push
          fi
