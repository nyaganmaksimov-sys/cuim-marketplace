name: Validate product gallery integration
on:
  push:
    paths:
      - '.github/workflows/install-product-gallery.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix empty gallery cover and validate scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('seller-gallery.js')
          s=p.read_text(encoding='utf-8')
          old="function removeItem(i){const x=items[i];if(!x)return;revoke(x);items.splice(i,1);normalized();render();setMsg('Изображение убрано из галереи. Изменение применится после сохранения публикации.')}"
          new="function removeItem(i){const x=items[i];if(!x)return;revoke(x);items.splice(i,1);normalized();if(!items.length&&$('imageUrl'))$('imageUrl').value='';render();setMsg('Изображение убрано из галереи. Изменение применится после сохранения публикации.')}"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          node --check seller-gallery.js
          node --check offer-gallery.js
          node --check seller-media-guide.js
          grep -q 'src="/seller-gallery.js"' seller-catalog.html
          grep -q 'src="/offer-gallery.js"' offer.html
      - name: Commit final gallery fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add seller-gallery.js
          git commit -m "Clear legacy cover when gallery is emptied"
          git push
