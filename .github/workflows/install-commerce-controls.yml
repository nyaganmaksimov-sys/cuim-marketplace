name: Install seller commerce controls
on:
  push:
    paths:
      - '.github/workflows/install-commerce-controls.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch seller editor and cart
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('seller-catalog.html')
          s=p.read_text(encoding='utf-8')
          old='<script type="module" src="/seller-gallery.js"></script>\n<script src="/seller-media-guide.js"></script>'
          new='<script type="module" src="/seller-gallery.js"></script>\n<script type="module" src="/seller-commerce.js"></script>\n<script src="/seller-media-guide.js"></script>'
          if '/seller-commerce.js' not in s:
              if old not in s: raise SystemExit('seller script anchor not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')

          p=Path('cart.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("s.rpc('marketplace_cart_products',{p_product_ids:ids})","s.rpc('marketplace_cart_products_v2',{p_product_ids:ids})")

          old="function cartEligible(p){return ['PRODUCT','FOOD'].includes(p?.marketplace_offer_type)}"
          new="function cartEligible(p){return ['PRODUCT','FOOD'].includes(p?.marketplace_offer_type)}\nfunction methodAllowed(m,items){const ps=(items||[]).map(x=>x.p||x).filter(Boolean);if(m.code==='PICKUP')return ps.every(p=>p.marketplace_offer_type!=='PRODUCT'||p.marketplace_details?.pickup!==false);if(m.code==='DIGITAL')return true;return ps.every(p=>p.marketplace_offer_type!=='PRODUCT'||p.marketplace_details?.delivery!==false)}"
          if 'function methodAllowed(' not in s:
              if old not in s: raise SystemExit('cartEligible anchor not found')
              s=s.replace(old,new,1)

          s=s.replace("let goodsAll=0,deliveryAll=0,html='',needsAddress=false,itemCount=0;","let goodsAll=0,deliveryAll=0,html='',needsAddress=false,itemCount=0,receivingBlocked=false;")
          s=s.replace("const opts=methods.filter(x=>x.partner_id===g.id);","const opts=methods.filter(x=>x.partner_id===g.id&&methodAllowed(x,g.items));")

          old="}else{html+=`<div class=\"delivery-meta\">Способы получения пока не настроены. Заказ оформится как самовывоз, детали можно согласовать с продавцом.</div><div class=\"seller-total\">Итого у продавца: ${money(goods)}</div>`}html+='</div></div>'}"
          new="}else{const deliveryOnly=g.items.some(({p})=>p.marketplace_offer_type==='PRODUCT'&&p.marketplace_details?.delivery===true&&p.marketplace_details?.pickup===false);if(deliveryOnly){receivingBlocked=true;html+=`<div class=\"delivery-meta\" style=\"color:#b91c1c\">Для этого товара продавец включил доставку, но активный способ доставки сейчас не настроен. Оформление временно недоступно.</div><div class=\"seller-total\">Итого у продавца: ${money(goods)}</div>`}else{html+=`<div class=\"delivery-meta\">Способы получения пока не настроены. Заказ оформится как самовывоз, детали можно согласовать с продавцом.</div><div class=\"seller-total\">Итого у продавца: ${money(goods)}</div>`}}html+='</div></div>'}"
          if old in s:
              s=s.replace(old,new,1)
          elif 'const deliveryOnly=g.items.some' not in s:
              raise SystemExit('delivery fallback anchor not found')

          s=s.replace("const canCheckout=cart.length>0&&groups.size>0&&!blocking.length;","const canCheckout=cart.length>0&&groups.size>0&&!blocking.length&&!receivingBlocked;")
          p.write_text(s,encoding='utf-8')
          PY
          node --check seller-commerce.js
          grep -q 'seller-commerce.js' seller-catalog.html
          grep -q "marketplace_cart_products_v2" cart.html
          grep -q 'function methodAllowed' cart.html
      - name: Commit commerce integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add seller-catalog.html cart.html
          git commit -m "Connect seller commerce fields to checkout"
          git push
