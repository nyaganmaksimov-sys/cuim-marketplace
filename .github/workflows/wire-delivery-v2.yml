name: Wire delivery v2
on:
  push:
    paths:
      - '.github/workflows/wire-delivery-v2.yml'
concurrency:
  group: wire-delivery-v2
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Patch pages idempotently
        run: |
          python - <<'PY'
          from pathlib import Path
          def add_before(path, marker, addition, check):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if check in s: return
              if marker not in s: raise SystemExit(f'{path}: marker not found')
              p.write_text(s.replace(marker,addition+marker,1),encoding='utf-8')
          add_before('admin/delivery.html','<a class="btn light" href="/courier.html" target="_blank">','<a class="btn light" href="./delivery-settings.html">Тарифы и выплаты</a>','delivery-settings.html')
          add_before('courier.html','</body>','<script type="module" src="/courier-push.js"></script><script type="module" src="/courier-payouts.js"></script>','/courier-push.js')
          add_before('seller-delivery.html','</body>','<script type="module" src="/seller-delivery-tariff.js"></script>','/seller-delivery-tariff.js')
          PY
      - name: Verify JavaScript
        run: |
          node --check courier-push.js
          node --check courier-payouts.js
          node --check seller-delivery-tariff.js
          python - <<'PY'
          from pathlib import Path
          import re
          for f in ['admin/delivery.html','admin/delivery-settings.html','courier.html','seller-delivery.html']:
              s=Path(f).read_text(encoding='utf-8')
              mods=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
              for i,m in enumerate(mods): Path(f'/tmp/{f.replace("/","_")}_{i}.mjs').write_text(m,encoding='utf-8')
          PY
          for f in /tmp/admin_delivery.html_*.mjs /tmp/admin_delivery-settings.html_*.mjs /tmp/courier.html_*.mjs /tmp/seller-delivery.html_*.mjs; do node --check "$f"; done
          grep -q 'delivery-settings.html' admin/delivery.html
          grep -q '/courier-push.js' courier.html
          grep -q '/courier-payouts.js' courier.html
          grep -q '/seller-delivery-tariff.js' seller-delivery.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/delivery.html courier.html seller-delivery.html
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Connect delivery tariffs payouts and courier push'
            git push origin main
          fi
