name: Refactor seller offer save
on:
  push:
    paths:
      - '.github/workflows/refactor-seller-offer-save.yml'
      - '.github/scripts/refactor_seller_offer_save.py'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/refactor_seller_offer_save.py
      - name: Check JavaScript
        run: |
          node --check seller-gallery.js
          node --check seller-commerce.js
          node --check seller-location.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('seller-catalog.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('inline module not found')
          Path('/tmp/seller-catalog.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/seller-catalog.mjs
      - name: Verify atomic save integration
        run: |
          grep -q "marketplace_partner_save_offer" seller-catalog.html
          grep -q "CUIM_SELLER_COMMERCE" seller-catalog.html
          grep -q "CUIM_SELLER_LOCATION" seller-catalog.html
          grep -q "beforeId||productId()" seller-gallery.js
          ! grep -q "resolveSavedProduct" seller-commerce.js
          ! grep -q "persistLocation" seller-location.js
          grep -q "'PRODUCT','FOOD'" seller-commerce.js
          grep -q "d_food_pickup" seller-catalog.html
          grep -q "q.step='1'" seller-commerce.js
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seller-catalog.html seller-gallery.js seller-commerce.js seller-location.js
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Use atomic seller offer save flow'
            git push
          fi
