name: Finalize customer checkout flow
on:
  push:
    paths:
      - '.github/workflows/finalize-checkout.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch account order links and status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('account.html')
          s=p.read_text(encoding='utf-8')
          if "IN_PROGRESS:'В работе'" not in s:
              raise SystemExit('old IN_PROGRESS mapping not found')
          s=s.replace("IN_PROGRESS:'В работе'","IN_WORK:'В работе'",1)
          old='<b>Заказ ${esc(o.id.slice(0,8))}</b> <span class="status">'
          new='<a href="./order.html?id=${encodeURIComponent(o.id)}" style="color:inherit;text-decoration:none"><b>Заказ ${esc(o.id.slice(0,8))}</b></a> <span class="status">'
          if old not in s:
              raise SystemExit('order title pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Check module JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for name in ('cart.html','order.html','account.html'):
              s=Path(name).read_text(encoding='utf-8')
              blocks=re.findall(r'<script\s+type=["\']module["\']>(.*?)</script>',s,re.S|re.I)
              if not blocks:
                  raise SystemExit(f'No module script found in {name}')
              for i,code in enumerate(blocks):
                  out=Path(f'/tmp/{name}.{i}.mjs')
                  out.write_text(code,encoding='utf-8')
                  subprocess.run(['node','--check',str(out)],check=True)
          print('JavaScript syntax OK')
          PY
      - name: Commit account update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add account.html
          git commit -m "Link customer orders to order details"
          git push
