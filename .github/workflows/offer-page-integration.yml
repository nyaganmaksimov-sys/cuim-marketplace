name: Integrate offer page links
on:
  push:
    paths:
      - '.github/workflows/offer-page-integration.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link cards to offer page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Shared catalog: whole non-classified card opens offer page; actions remain independent.
          replace('catalog/catalog.js',
          "if(['PRODUCT','FOOD'].includes(t))return`<button class=\"primary\" data-cart=\"${x.id}\">В корзину</button><a class=\"secondary\" href=\"/seller.html?id=${encodeURIComponent(x.partner_id)}\">Компания</a>`;",
          "if(['PRODUCT','FOOD'].includes(t))return`<button class=\"primary\" data-cart=\"${x.id}\">В корзину</button><a class=\"secondary\" href=\"/offer.html?id=${encodeURIComponent(x.id)}\">Подробнее</a>`;")
          replace('catalog/catalog.js',
          "return`<a class=\"primary\" href=\"/seller.html?id=${encodeURIComponent(x.partner_id)}\">${label}</a><a class=\"secondary\" href=\"/seller.html?id=${encodeURIComponent(x.partner_id)}\">Компания</a>`;",
          "return`<a class=\"primary\" href=\"/offer.html?id=${encodeURIComponent(x.id)}\">${label}</a><a class=\"secondary\" href=\"/seller.html?id=${encodeURIComponent(x.partner_id)}\">Компания</a>`;")
          replace('catalog/catalog.js',
          "return`<article class=\"product\"><div class=\"product-img\">${x.image_url?`<img src=\"${esc(x.image_url)}\" loading=\"lazy\" alt=\"${esc(x.title)}\">`:'<span class=\"empty\" style=\"padding:10px;border:0;background:transparent\">Нет фото</span>'}<span class=\"badge\">${esc(taxonomyLabel(x))}</span></div>",
          "return`<article class=\"product\" data-offer=\"${x.id}\"><div class=\"product-img\">${x.image_url?`<img src=\"${esc(x.image_url)}\" loading=\"lazy\" alt=\"${esc(x.title)}\">`:'<span class=\"empty\" style=\"padding:10px;border:0;background:transparent\">Нет фото</span>'}<span class=\"badge\">${esc(taxonomyLabel(x))}</span></div>")
          replace('catalog/catalog.js',
          "  bindCart();bindAdFavorites();",
          "  bindOfferCards();bindCart();bindAdFavorites();")
          replace('catalog/catalog.js',
          "function bindCart(){document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{",
          "function bindOfferCards(){document.querySelectorAll('[data-offer]').forEach(el=>el.onclick=e=>{if(e.target.closest('a,button'))return;location.href='/offer.html?id='+encodeURIComponent(el.dataset.offer)})}\nfunction bindCart(){document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=e=>{e.stopPropagation();")

          # Homepage card click should open the offer itself, not just the seller profile.
          replace('index.html',
          "location.href='./seller.html?id='+encodeURIComponent(all.find(x=>x.id===el.dataset.open)?.partner_id||'')",
          "location.href='./offer.html?id='+encodeURIComponent(el.dataset.open)")

          # Seller profile cards should also open the offer while action buttons keep their own behavior.
          replace('seller.html',
          "function card(x){return`<article class=\"product\"><div class=\"product-img\">",
          "function card(x){return`<article class=\"product\" data-offer=\"${x.id}\"><div class=\"product-img\">")
          replace('seller.html',
          "document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{addCart(b.dataset.cart);b.textContent='Добавлено ✓';setTimeout(()=>b.textContent='В корзину',1200)});document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>askSeller(b.dataset.ask))",
          "document.querySelectorAll('[data-offer]').forEach(el=>el.onclick=e=>{if(e.target.closest('a,button'))return;location.href='/offer.html?id='+encodeURIComponent(el.dataset.offer)});document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=e=>{e.stopPropagation();addCart(b.dataset.cart);b.textContent='Добавлено ✓';setTimeout(()=>b.textContent='В корзину',1200)});document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=e=>{e.stopPropagation();askSeller(b.dataset.ask)})")
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.js index.html seller.html
          git commit -m "Open marketplace cards on offer page"
          git push