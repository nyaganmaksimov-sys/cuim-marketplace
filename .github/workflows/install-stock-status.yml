name: Cleanup stock status installer
on:
  push:
    paths:
      - '.github/workflows/install-stock-status.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-off installer
        run: |
          rm -f .github/scripts/install_stock_status.py
          rm -f .github/workflows/install-stock-status.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-off stock status installer"
          git push
