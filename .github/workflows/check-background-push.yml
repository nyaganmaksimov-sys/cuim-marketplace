name: Check background push
on:
  push:
    paths:
      - '.github/workflows/check-background-push.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check seller-attention.js
      - run: node --check sw.js
      - run: |
          grep -q "serviceWorker.register('/sw.js'" seller-attention.js
          grep -q "marketplace_partner_upsert_push_subscription" seller-attention.js
          grep -q "addEventListener('push'" sw.js
          grep -q "notificationclick" sw.js
