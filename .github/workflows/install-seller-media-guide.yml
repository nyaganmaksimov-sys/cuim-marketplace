name: Install seller infographic guidance
on:
  push:
    paths:
      - '.github/workflows/install-seller-media-guide.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject media guidance script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('seller-catalog.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/seller-media-guide.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('seller-catalog.html has no </body>')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit seller guidance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add seller-catalog.html
          git commit -m "Show infographic guidance in seller editor"
          git push
