name: Install seller location and geo fallback
on:
  push:
    paths:
      - '.github/workflows/install-seller-location.yml'
      - '.github/scripts/install_seller_location.py'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch seller editor and geo core
        run: |
          python3 .github/scripts/install_seller_location.py
          node --check seller-location.js
          node --check geo-core.js
          grep -q '/seller-location.js' seller-catalog.html
          grep -q 'LOCAL_CITIES' geo-core.js
      - name: Commit location integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add seller-catalog.html geo-core.js
          git commit -m "Add seller location and resilient city loading"
          git push
