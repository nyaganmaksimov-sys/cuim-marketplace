name: Check seller attention
on:
  push:
    paths:
      - '.github/workflows/check-seller-attention.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check seller-attention.js
      - run: |
          grep -q 'data-order' seller-orders.html
          grep -q 'data-review' seller-reviews.html
          grep -q 'focusDeepLink' seller-attention.js
