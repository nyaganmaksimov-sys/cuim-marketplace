<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Личный кабинет — ЦУИМ</title><link rel="icon" href="images/logo_cuim.png"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8fc;color:#0f172a}.top{background:#fff;border-bottom:1px solid #e2e8f0}.topin,.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.topin{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{width:250px;max-height:68px;object-fit:contain}.actions{display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:11px 14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:850;text-decoration:none;cursor:pointer}.btn.light{background:#fff;color:#334155;border:1px solid #cbd5e1}.wrap{padding:28px 0 60px}.hero{background:linear-gradient(135deg,#0f172a,#172554);color:#fff;border-radius:22px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 6px}.muted{color:#64748b}.hero .muted{color:#cbd5e1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px}.card h2{margin-top:0}.field{display:grid;gap:6px;margin-bottom:11px}.field label{font-size:12px;font-weight:800}.field input{padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.order,.fav{border-top:1px solid #eef2f7;padding:14px 0}.order:first-child,.fav:first-child{border-top:0}.status{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;display:inline-block;background:#eff6ff;color:#1d4ed8}.items{margin:8px 0;font-size:13px}.empty{padding:20px 0;color:#94a3b8}@media(max-width:720px){.grid{grid-template-columns:1fr}.topin{min-height:72px}.logo{width:180px}.actions .light{display:none}}</style></head><body><header class="top"><div class="topin"><a href="./"><img class="logo" src="images/logo_cuim.png" alt="ЦУИМ"></a><div class="actions"><a class="btn light" href="./cart.html">Корзина</a><a class="btn light" href="./">Marketplace</a><button class="btn" id="logout">Выйти</button></div></div></header><main class="wrap"><section class="hero"><h1>Личный кабинет</h1><div class="muted" id="email">Загрузка…</div></section><div class="grid"><section class="card"><h2>Мой профиль</h2><div class="field"><label>Имя</label><input id="name"></div><div class="field"><label>Телефон</label><input id="phone"></div><div class="field"><label>Город</label><input id="city"></div><button class="btn" id="save">Сохранить</button><div id="msg" class="muted" style="margin-top:9px"></div></section><section class="card"><h2>Мои заказы</h2><div id="orders"><div class="empty">Загрузка…</div></div></section><section class="card" style="grid-column:1/-1"><h2>Избранное</h2><div id="favorites"><div class="empty">Загрузка…</div></div></section></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])),labels={NEW:'Новый',CONFIRMED:'Подтверждён',IN_PROGRESS:'В работе',READY:'Готов',COMPLETED:'Выполнен',CANCELLED:'Отменён'};const{data:{session}}=await s.auth.getSession();if(!session)location.href='./login.html';const u=session.user;$('email').textContent=u.email||'';let{data:p}=await s.from('marketplace_profiles').select('*').eq('user_id',u.id).maybeSingle();if(!p){const seed={user_id:u.id,full_name:u.user_metadata?.full_name||'',phone:u.user_metadata?.phone||''};await s.from('marketplace_profiles').insert(seed);p=seed}$('name').value=p.full_name||'';$('phone').value=p.phone||'';$('city').value=p.city||'';$('save').onclick=async()=>{const{error}=await s.from('marketplace_profiles').upsert({user_id:u.id,full_name:$('name').value.trim(),phone:$('phone').value.trim(),city:$('city').value.trim(),updated_at:new Date().toISOString()});$('msg').textContent=error?'Ошибка: '+error.message:'Сохранено'};$('logout').onclick=async()=>{await s.auth.signOut();location.href='./'};async function loadOrders(){const{data,error}=await s.from('marketplace_orders').select('id,status,total,created_at,delivery_method,delivery_city,delivery_address,partner_comment,partners(name),marketplace_order_items(title,price,quantity)').order('created_at',{ascending:false});if(error){$('orders').textContent=error.message;return}const a=data||[];$('orders').innerHTML=a.length?a.map(o=>`<div class="order"><div><b>Заказ ${esc(o.id.slice(0,8))}</b> <span class="status">${esc(labels[o.status]||o.status)}</span></div><div class="muted">${new Date(o.created_at).toLocaleString('ru-RU')} · ${esc(o.partners?.name||'Исполнитель')}</div><div class="items">${(o.marketplace_order_items||[]).map(i=>`${esc(i.title)} × ${Number(i.quantity)}`).join('<br>')}</div><b>${Number(o.total||0).toLocaleString('ru-RU')} ₽</b>${o.delivery_method?`<div class="muted">${o.delivery_method==='DELIVERY'?'Доставка':'Самовывоз'}${o.delivery_city?' · '+esc(o.delivery_city):''}${o.delivery_address?' · '+esc(o.delivery_address):''}</div>`:''}${o.partner_comment?`<div class="muted">Комментарий исполнителя: ${esc(o.partner_comment)}</div>`:''}</div>`).join(''):'<div class="empty">Заказов пока нет.</div>'}async function loadFav(){const{data,error}=await s.from('marketplace_favorites').select('id,product_id,partner_products(title,price,image_url,partners(name))').order('created_at',{ascending:false});if(error){$('favorites').textContent=error.message;return}const a=data||[];$('favorites').innerHTML=a.length?a.map(f=>`<div class="fav"><b>${esc(f.partner_products?.title||'Товар')}</b><div class="muted">${esc(f.partner_products?.partners?.name||'')}</div><div>${Number(f.partner_products?.price||0).toLocaleString('ru-RU')} ₽</div><button class="btn light" data-del="${f.id}" style="margin-top:7px">Удалить</button></div>`).join(''):'<div class="empty">Избранных товаров пока нет.</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await s.from('marketplace_favorites').delete().eq('id',b.dataset.del);loadFav()})}await loadOrders();await loadFav();</script></body></html>
