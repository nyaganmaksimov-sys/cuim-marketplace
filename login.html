<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — ЦУИМ</title><link rel="icon" href="images/logo_cuim.png"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#eff6ff,#f5f3ff);color:#0f172a;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(480px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:28px;box-shadow:0 24px 70px #0f172a18}.logo{display:block;width:260px;max-width:100%;margin:0 auto 22px}h1{font-size:28px;margin:0 0 8px}.muted{color:#64748b;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0}.tab{border:1px solid #dbe3ee;background:#fff;border-radius:11px;padding:11px;font-weight:800;cursor:pointer}.tab.active{background:#2563eb;color:#fff;border-color:#2563eb}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800}.field input{padding:13px;border:1px solid #cbd5e1;border-radius:11px;font:inherit}.btn{border:0;border-radius:11px;padding:13px 15px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:900;cursor:pointer}.back{display:block;text-align:center;margin-top:16px;color:#475569;text-decoration:none}.msg{font-size:13px;min-height:20px}.hidden{display:none}</style></head><body><main class="card"><img class="logo" src="images/logo_cuim.png" alt="ЦУИМ"><h1>Личный кабинет покупателя</h1><div class="muted">Входите, сохраняйте товары и отслеживайте свои заказы.</div><div class="tabs"><button class="tab active" data-mode="login">Войти</button><button class="tab" data-mode="signup">Регистрация</button></div><div class="form"><div class="field signup hidden"><label>Имя</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Пароль</label><input id="password" type="password" minlength="6"></div><div class="field signup hidden"><label>Телефон</label><input id="phone"></div><button class="btn" id="submit">Войти</button><div id="msg" class="msg"></div></div><a class="back" href="./">← Вернуться в Marketplace</a></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'),$=id=>document.getElementById(id);let mode='login';const allowed=new Set(['cart.html','account.html']),next=allowed.has(new URLSearchParams(location.search).get('next'))?new URLSearchParams(location.search).get('next'):'account.html',go=()=>location.href='./'+next;const{data:{session}}=await s.auth.getSession();if(session)go();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.signup').forEach(x=>x.classList.toggle('hidden',mode!=='signup'));$('submit').textContent=mode==='login'?'Войти':'Создать аккаунт';$('msg').textContent=''});$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){$('msg').textContent='Укажите email и пароль минимум из 6 символов';return}$('submit').disabled=true;if(mode==='login'){const{error}=await s.auth.signInWithPassword({email,password});if(error)$('msg').textContent='Ошибка: '+error.message;else go()}else{const{data,error}=await s.auth.signUp({email,password,options:{data:{full_name:$('name').value.trim(),phone:$('phone').value.trim()}}});if(error)$('msg').textContent='Ошибка: '+error.message;else if(data.session)go();else $('msg').textContent='Аккаунт создан. Подтвердите email по ссылке из письма.'}$('submit').disabled=false};</script></body></html>
