<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7fb"><title>Мои записи — ЦУИМ</title><link rel="icon" href="/images/logo_cuim.png"><style>:root{--ink:#172033;--muted:#64748b;--line:#e5e7eb;--pink:#db2777;--purple:#7c3aed;--green:#059669;--red:#be123c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f8fb;color:var(--ink)}button{font:inherit}a{text-decoration:none;color:inherit}.wrap{width:min(980px,calc(100% - 28px));margin:auto}.top{height:74px;background:#fff;border-bottom:1px solid #e5e7eb}.topin{height:100%;display:flex;align-items:center;gap:10px}.logo{width:190px;height:54px;object-fit:contain}.top-actions{margin-left:auto;display:flex;gap:7px}.btn{border:0;border-radius:12px;padding:10px 13px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn.light{background:#fff;color:#475569;border:1px solid #d6dae2}.btn.red{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.btn.small{padding:8px 10px;font-size:9px}.main{padding:25px 0 70px}.hero{background:linear-gradient(135deg,#fff,#fff7fb 60%,#f5f3ff);border:1px solid #eadde6;border-radius:23px;padding:22px}.hero h1{margin:0;font-size:29px}.hero p{margin:6px 0 0;color:#64748b;font-size:11px;line-height:1.55}.tabs{display:flex;gap:6px;overflow:auto;margin:13px 0;scrollbar-width:none}.tabs button{border:1px solid #dbe2ea;background:#fff;color:#475569;border-radius:999px;padding:8px 11px;font-size:9px;font-weight:900;white-space:nowrap;cursor:pointer}.tabs button.active{background:#831843;color:#fff;border-color:#831843}.list{display:grid;gap:10px}.booking{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:15px;display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:13px;align-items:center;box-shadow:0 7px 24px #0f172a05}.avatar{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#fce7f3,#ede9fe);display:grid;place-items:center;font-weight:950;color:#831843;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.copy h3{margin:0;font-size:14px}.master{font-size:10px;color:#db2777;font-weight:900;margin-top:4px}.meta{font-size:9px;color:#64748b;line-height:1.65;margin-top:6px}.status{display:inline-flex;padding:5px 7px;border-radius:999px;font-size:8px;font-weight:900}.status.BOOKED{background:#eff6ff;color:#1d4ed8}.status.DONE{background:#ecfdf5;color:#047857}.status.CANCELLED{background:#fff1f2;color:#be123c}.status.NO_SHOW{background:#fff7ed;color:#c2410c}.side{text-align:right}.side .btn{margin-top:7px}.empty{padding:55px 20px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:20px;color:#64748b}.empty b{display:block;color:#172033;font-size:18px;margin-bottom:5px}.hidden{display:none!important}@media(max-width:650px){.top{height:66px}.logo{width:155px}.top-actions .hide{display:none}.main{padding-top:14px}.hero{padding:18px}.hero h1{font-size:25px}.booking{grid-template-columns:50px 1fr;padding:12px}.avatar{width:50px;height:50px;border-radius:15px}.side{grid-column:1/-1;text-align:left;display:flex;gap:6px;align-items:center}.side .btn{margin-top:0}}</style></head><body><header class="top"><div class="wrap topin"><a href="/"><img class="logo" src="/images/logo_cuim.png" alt="ЦУИМ"></a><div class="top-actions"><a class="btn light hide" href="/catalog/services/beauty/">Найти мастера</a><a class="btn light" href="/notifications.html">🔔</a></div></div></header><main class="wrap main"><section class="hero"><h1>Мои записи</h1><p>Все ваши записи к мастерам красоты ЦУИМ. Предстоящую запись можно отменить — время сразу вернётся в свободные окна мастера.</p></section><div class="tabs" id="tabs"><button class="active" data-filter="UPCOMING">Предстоящие</button><button data-filter="ALL">Все</button><button data-filter="DONE">Завершённые</button><button data-filter="CANCELLED">Отменённые</button></div><div id="list" class="list"><div class="empty">Загрузка записей…</div></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[],filter='UPCOMING';const labels={BOOKED:'Запланировано',DONE:'Выполнено',CANCELLED:'Отменено',NO_SHOW:'Не состоялось'};function initials(v){return String(v||'М').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function upcoming(x){return x.status==='BOOKED'&&new Date(x.booking_date+'T'+x.end_time+':00')>=new Date()}function render(){let a=rows;if(filter==='UPCOMING')a=a.filter(upcoming);else if(filter==='DONE')a=a.filter(x=>x.status==='DONE');else if(filter==='CANCELLED')a=a.filter(x=>x.status==='CANCELLED');$('list').innerHTML=a.length?a.map(x=>`<article class="booking"><div class="avatar">${x.master_avatar_url?`<img src="${esc(x.master_avatar_url)}" alt="">`:esc(initials(x.master_name))}</div><div class="copy"><h3>${esc(x.service_title)}</h3><div class="master">${esc(x.master_name)}</div><div class="meta">📅 ${new Date(x.booking_date+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})} · ${esc(x.start_time)}–${esc(x.end_time)}<br>📍 ${esc([x.master_city,x.master_address].filter(Boolean).join(', ')||'Адрес уточните у мастера')}${x.comment?`<br>💬 ${esc(x.comment)}`:''}</div></div><div class="side"><span class="status ${x.status}">${labels[x.status]||x.status}</span><br><a class="btn light small" href="/beauty-master.html?id=${encodeURIComponent(x.profile_id)}">Мастер</a>${upcoming(x)?` <button class="btn red small" data-cancel="${x.id}">Отменить</button>`:''}</div></article>`).join(''):'<div class="empty"><b>Записей здесь пока нет</b><a href="/catalog/services/beauty/" style="color:#7c3aed;font-weight:900">Выбрать мастера →</a></div>';document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelBooking(b.dataset.cancel))}async function cancelBooking(id){if(!confirm('Отменить эту запись? Свободное время снова станет доступно другим клиентам.'))return;const{error}=await s.rpc('marketplace_cancel_my_beauty_booking',{p_booking_id:id});if(error)return alert(error.message);await load()}async function load(){const{data:{session}}=await s.auth.getSession();if(!session){location.href='/login.html?next='+encodeURIComponent('/beauty-bookings.html');return}const{data,error}=await s.rpc('marketplace_my_beauty_bookings');if(error){$('list').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=data||[];render()}$('tabs').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()};load();</script></body></html>
