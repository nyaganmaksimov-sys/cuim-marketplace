<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7fb"><title>Мои записи — ЦУИМ</title><link rel="icon" href="/images/logo_cuim.png"><style>:root{--ink:#172033;--muted:#64748b;--line:#e5e7eb;--pink:#db2777;--purple:#7c3aed;--green:#059669;--red:#be123c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f8fb;color:var(--ink)}button,input,textarea{font:inherit}a{text-decoration:none;color:inherit}.wrap{width:min(980px,calc(100% - 28px));margin:auto}.top{height:74px;background:#fff;border-bottom:1px solid #e5e7eb}.topin{height:100%;display:flex;align-items:center;gap:10px}.logo{width:190px;height:54px;object-fit:contain}.top-actions{margin-left:auto;display:flex;gap:7px}.btn{border:0;border-radius:12px;padding:10px 13px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn.light{background:#fff;color:#475569;border:1px solid #d6dae2}.btn.red{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.btn.green{background:#059669}.btn.small{padding:8px 10px;font-size:9px}.main{padding:25px 0 70px}.hero{background:linear-gradient(135deg,#fff,#fff7fb 60%,#f5f3ff);border:1px solid #eadde6;border-radius:23px;padding:22px}.hero h1{margin:0;font-size:29px}.hero p{margin:6px 0 0;color:#64748b;font-size:11px;line-height:1.55}.tabs{display:flex;gap:6px;overflow:auto;margin:13px 0;scrollbar-width:none}.tabs button{border:1px solid #dbe2ea;background:#fff;color:#475569;border-radius:999px;padding:8px 11px;font-size:9px;font-weight:900;white-space:nowrap;cursor:pointer}.tabs button.active{background:#831843;color:#fff;border-color:#831843}.list{display:grid;gap:10px}.booking{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:15px;display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:13px;align-items:center;box-shadow:0 7px 24px #0f172a05}.avatar{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#fce7f3,#ede9fe);display:grid;place-items:center;font-weight:950;color:#831843;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.copy h3{margin:0;font-size:14px}.master{font-size:10px;color:#db2777;font-weight:900;margin-top:4px}.meta{font-size:9px;color:#64748b;line-height:1.65;margin-top:6px}.status{display:inline-flex;padding:5px 7px;border-radius:999px;font-size:8px;font-weight:900}.status.BOOKED{background:#eff6ff;color:#1d4ed8}.status.DONE{background:#ecfdf5;color:#047857}.status.CANCELLED{background:#fff1f2;color:#be123c}.status.NO_SHOW{background:#fff7ed;color:#c2410c}.side{text-align:right}.side .actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;margin-top:7px}.review-note{font-size:8px;color:#a16207;background:#fffbeb;border-radius:8px;padding:5px 7px;margin-top:6px;display:inline-block}.empty{padding:55px 20px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:20px;color:#64748b}.empty b{display:block;color:#172033;font-size:18px;margin-bottom:5px}.modal{position:fixed;inset:0;background:#0f172aa6;z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:19px}.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.modalhead h2{margin:0;font-size:19px}.close{border:0;background:#f1f5f9;width:34px;height:34px;border-radius:50%;cursor:pointer}.field{display:grid;gap:5px;margin-top:12px}.field label{font-size:9px;font-weight:900;color:#475569}.field input,.field textarea{border:1px solid #cbd5e1;border-radius:11px;padding:10px}.times{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.time{border:1px solid #d6dbe5;border-radius:10px;background:#fff;padding:9px 11px;font-weight:900;font-size:10px;cursor:pointer}.time.active{background:#831843;color:#fff;border-color:#831843}.stars-pick{display:flex;gap:6px;margin-top:8px}.star{border:0;background:#f8fafc;border-radius:10px;width:42px;height:42px;font-size:23px;color:#cbd5e1;cursor:pointer}.star.active{color:#f59e0b;background:#fffbeb}.modal-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}.hidden{display:none!important}@media(max-width:650px){.top{height:66px}.logo{width:155px}.top-actions .hide{display:none}.main{padding-top:14px}.hero{padding:18px}.hero h1{font-size:25px}.booking{grid-template-columns:50px 1fr;padding:12px}.avatar{width:50px;height:50px;border-radius:15px}.side{grid-column:1/-1;text-align:left}.side .actions{justify-content:flex-start}.modalbox{padding:16px}}</style></head><body><header class="top"><div class="wrap topin"><a href="/"><img class="logo" src="/images/logo_cuim.png" alt="ЦУИМ"></a><div class="top-actions"><a class="btn light hide" href="/catalog/services/beauty/">Найти мастера</a><a class="btn light" href="/notifications.html">🔔</a></div></div></header><main class="wrap main"><section class="hero"><h1>Мои записи</h1><p>Здесь можно отменить или перенести предстоящий визит. После выполненной услуги — поставить оценку и оставить отзыв мастеру.</p></section><div class="tabs" id="tabs"><button class="active" data-filter="UPCOMING">Предстоящие</button><button data-filter="ALL">Все</button><button data-filter="DONE">Завершённые</button><button data-filter="CANCELLED">Отменённые</button></div><div id="list" class="list"><div class="empty">Загрузка записей…</div></div></main><div class="modal" id="rescheduleModal"><div class="modalbox"><div class="modalhead"><h2>Перенести запись</h2><button class="close" data-close="rescheduleModal">×</button></div><div id="rescheduleTitle" style="font-size:10px;color:#64748b;margin-top:5px"></div><div class="field"><label>Новая дата</label><input id="rescheduleDate" type="date"></div><div class="times" id="rescheduleTimes"><span style="font-size:10px;color:#64748b">Выберите дату.</span></div><div id="rescheduleSelected" style="font-size:10px;color:#831843;font-weight:900;margin-top:9px"></div><div class="modal-actions"><button class="btn light" data-close="rescheduleModal">Отмена</button><button class="btn" id="confirmReschedule" disabled>Перенести</button></div></div></div><div class="modal" id="reviewModal"><div class="modalbox"><div class="modalhead"><h2>Отзыв о мастере</h2><button class="close" data-close="reviewModal">×</button></div><div id="reviewTitle" style="font-size:10px;color:#64748b;margin-top:5px"></div><div class="field"><label>Оценка</label><div class="stars-pick" id="stars"></div></div><div class="field"><label>Отзыв</label><textarea id="reviewText" rows="5" maxlength="2000" placeholder="Что понравилось? Расскажите другим клиентам."></textarea></div><div class="modal-actions"><button class="btn light" data-close="reviewModal">Отмена</button><button class="btn green" id="submitReview">Сохранить отзыв</button></div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[],filter='UPCOMING',rescheduleRow=null,rescheduleTime=null,reviewRow=null,rating=5;const labels={BOOKED:'Запланировано',DONE:'Выполнено',CANCELLED:'Отменено',NO_SHOW:'Не состоялось'};function initials(v){return String(v||'М').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function localDate(d=new Date()){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function upcoming(x){return x.status==='BOOKED'&&new Date(x.booking_date+'T'+x.end_time+':00')>=new Date()}function dateText(x){return new Date(x+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}function render(){let a=rows;if(filter==='UPCOMING')a=a.filter(upcoming);else if(filter==='DONE')a=a.filter(x=>x.status==='DONE');else if(filter==='CANCELLED')a=a.filter(x=>x.status==='CANCELLED');$('list').innerHTML=a.length?a.map(x=>`<article class="booking"><div class="avatar">${x.master_avatar_url?`<img src="${esc(x.master_avatar_url)}" alt="">`:esc(initials(x.master_name))}</div><div class="copy"><h3>${esc(x.service_title)}</h3><div class="master">${esc(x.master_name)}</div><div class="meta">📅 ${dateText(x.booking_date)} · ${esc(x.start_time)}–${esc(x.end_time)}<br>📍 ${esc([x.master_city,x.master_address].filter(Boolean).join(', ')||'Адрес уточните у мастера')}${x.comment?`<br>💬 ${esc(x.comment)}`:''}</div>${x.review_rating?`<span class="review-note">★ ${x.review_rating} · отзыв сохранён</span>`:''}</div><div class="side"><span class="status ${x.status}">${labels[x.status]||x.status}</span><div class="actions"><a class="btn light small" href="/beauty-master.html?id=${encodeURIComponent(x.profile_id)}">Мастер</a>${upcoming(x)?`<button class="btn light small" data-reschedule="${x.id}">Перенести</button><button class="btn red small" data-cancel="${x.id}">Отменить</button>`:''}${x.status==='DONE'?`<button class="btn green small" data-review="${x.id}">${x.review_id?'Изменить отзыв':'Оставить отзыв'}</button>`:''}</div></div></article>`).join(''):'<div class="empty"><b>Записей здесь пока нет</b><a href="/catalog/services/beauty/" style="color:#7c3aed;font-weight:900">Выбрать мастера →</a></div>';document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelBooking(b.dataset.cancel));document.querySelectorAll('[data-reschedule]').forEach(b=>b.onclick=()=>openReschedule(b.dataset.reschedule));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>openReview(b.dataset.review))}async function cancelBooking(id){if(!confirm('Отменить эту запись? Свободное время снова станет доступно другим клиентам.'))return;const{error}=await s.rpc('marketplace_cancel_my_beauty_booking',{p_booking_id:id});if(error)return alert(error.message);await load()}function openModal(id){$(id).classList.add('open');document.body.style.overflow='hidden'}function closeModal(id){$(id).classList.remove('open');document.body.style.overflow=''}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)closeModal(m.id)});function openReschedule(id){rescheduleRow=rows.find(x=>x.id===id);if(!rescheduleRow)return;rescheduleTime=null;$('rescheduleTitle').textContent=`${rescheduleRow.service_title} · ${rescheduleRow.master_name}`;$('rescheduleDate').min=localDate();const max=new Date();max.setDate(max.getDate()+180);$('rescheduleDate').max=localDate(max);$('rescheduleDate').value=rescheduleRow.booking_date;$('rescheduleSelected').textContent='';$('confirmReschedule').disabled=true;openModal('rescheduleModal');loadRescheduleTimes()}async function loadRescheduleTimes(){if(!rescheduleRow)return;$('rescheduleTimes').innerHTML='<span style="font-size:10px;color:#64748b">Ищем свободное время…</span>';const{data,error}=await s.rpc('marketplace_beauty_available_times',{p_profile_id:rescheduleRow.profile_id,p_service_id:rescheduleRow.service_id,p_date:$('rescheduleDate').value});if(error){$('rescheduleTimes').innerHTML=`<span style="font-size:10px;color:#be123c">${esc(error.message)}</span>`;return}let a=data||[];if($('rescheduleDate').value===rescheduleRow.booking_date&&!a.some(x=>x.start_time===rescheduleRow.start_time))a=[{start_time:rescheduleRow.start_time,end_time:rescheduleRow.end_time},...a];$('rescheduleTimes').innerHTML=a.length?a.map(x=>`<button class="time" data-time="${x.start_time}">${esc(x.start_time)}</button>`).join(''):'<span style="font-size:10px;color:#64748b">Свободного времени нет.</span>';document.querySelectorAll('#rescheduleTimes [data-time]').forEach(b=>b.onclick=()=>{rescheduleTime=b.dataset.time;document.querySelectorAll('#rescheduleTimes .time').forEach(x=>x.classList.toggle('active',x===b));$('rescheduleSelected').textContent=`${dateText($('rescheduleDate').value)} · ${rescheduleTime}`;$('confirmReschedule').disabled=false})}$('rescheduleDate').onchange=()=>{rescheduleTime=null;$('confirmReschedule').disabled=true;$('rescheduleSelected').textContent='';loadRescheduleTimes()};$('confirmReschedule').onclick=async()=>{if(!rescheduleRow||!rescheduleTime)return;const b=$('confirmReschedule');b.disabled=true;const{error}=await s.rpc('marketplace_reschedule_my_beauty_booking',{p_booking_id:rescheduleRow.id,p_date:$('rescheduleDate').value,p_start_time:rescheduleTime});if(error){b.disabled=false;alert(error.message);return}closeModal('rescheduleModal');await load()};function renderStars(){$('stars').innerHTML=[1,2,3,4,5].map(n=>`<button class="star ${n<=rating?'active':''}" data-star="${n}" type="button">★</button>`).join('');document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{rating=Number(b.dataset.star);renderStars()})}function openReview(id){reviewRow=rows.find(x=>x.id===id);if(!reviewRow)return;rating=Number(reviewRow.review_rating||5);$('reviewText').value='';$('reviewTitle').textContent=`${reviewRow.service_title} · ${reviewRow.master_name}`;renderStars();openModal('reviewModal')}$('submitReview').onclick=async()=>{if(!reviewRow)return;const b=$('submitReview');b.disabled=true;const{error}=await s.rpc('marketplace_submit_beauty_review',{p_booking_id:reviewRow.id,p_rating:rating,p_review_text:$('reviewText').value.trim()||null});b.disabled=false;if(error)return alert(error.message);closeModal('reviewModal');await load()};async function load(){const{data:{session}}=await s.auth.getSession();if(!session){location.href='/login.html?next='+encodeURIComponent('/beauty-bookings.html');return}const{data,error}=await s.rpc('marketplace_my_beauty_bookings');if(error){$('list').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=data||[];render()}$('tabs').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()};load();</script></body></html>
