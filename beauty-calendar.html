</head><body><header class="top"><div class="wrap topin"><a href="/"><img class="logo" src="/images/logo_cuim.png" alt="ЦУИМ"></a><nav class="topnav"><a class="btn light hide-md" href="/catalog/services/beauty/">Каталог красоты</a><a class="btn light hide-sm" href="/beauty-clients.html">Клиенты</a><a class="btn light" href="/beauty-workspace.html">Beauty Pro</a></nav></div></header><main class="wrap main"><section class="hero"><div><div class="eyebrow">Beauty Pro · Календарь</div><h1>Записи и рабочий день</h1><p>Недельная сетка, ручная запись, перенос визитов и статусы клиентов в одном рабочем экране.</p></div><div class="hero-controls"><div class="field profile-select"><label>Мастер</label><select id="profileSelect"><option>Загрузка…</option></select></div><button class="btn" id="newBooking">+ Новая запись</button></div></section><nav class="subnav"><a href="/beauty-workspace.html">Настройки</a><a class="active" href="/beauty-calendar.html">Календарь</a><a href="/beauty-clients.html">CRM клиентов</a><a href="/beauty-workspace.html#services">Услуги</a><a href="/beauty-workspace.html#schedule">График</a><a href="/beauty-workspace.html#portfolio">Портфолио</a></nav><section class="stats"><div class="stat"><small>Записей сегодня</small><b id="statToday">0</b></div><div class="stat"><small>На этой неделе</small><b id="statWeek">0</b></div><div class="stat"><small>Выполнено</small><b id="statDone">0</b></div><div class="stat"><small>Выручка недели</small><b id="statRevenue">0 ₽</b></div></section><section class="card calendar-card"><div class="calendar-toolbar"><div class="calendar-toolbar-left"><button class="btn light small" id="prevWeek">←</button><button class="btn light small" id="todayBtn">Сегодня</button><button class="btn light small" id="nextWeek">→</button><div class="date-title" id="weekTitle"></div></div><div class="calendar-toolbar-right"><div class="view-switch"><button class="active" data-view="week">Неделя</button><button data-view="day">День</button></div><button class="btn light small" id="refreshBtn">Обновить</button></div></div><div class="calendar-scroll" id="calendarScroll"><div id="calendar"></div></div></section></main><div class="modal-shade" id="modalShade"></div><aside class="modal" id="bookingModal"><div class="modal-head"><h2 id="modalTitle">Новая запись</h2><button class="close" data-close>×</button></div><div class="modal-body"><form class="form-grid" id="manualForm"><div class="field"><label>Клиент</label><input id="customerName" required placeholder="Имя клиента"></div><div class="field"><label>Телефон</label><input id="customerPhone" required inputmode="tel" placeholder="+7 999 000-00-00"></div><div class="field"><label>Услуга</label><select id="serviceSelect" required></select></div><div class="form-two"><div class="field"><label>Дата</label><input id="bookingDate" type="date" required></div><div class="field"><label>Время</label><input id="bookingTime" type="time" step="1800" required></div></div><div class="field"><label>Комментарий</label><textarea id="bookingComment" rows="3" placeholder="Пожелания, заметка к визиту"></textarea></div><label class="check"><input id="outsideSchedule" type="checkbox"> Разрешить запись вне рабочего графика</label><button class="btn" type="submit">Сохранить запись</button></form><div id="bookingDetails" class="hidden"></div></div></aside><div class="toast" id="toast"></div><script type="module" src="/beauty-calendar.js"></script></body></html>
