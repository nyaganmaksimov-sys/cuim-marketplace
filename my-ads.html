<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafc">
<title>Мои объявления — ЦУИМ</title><link rel="icon" href="/images/logo_cuim.png">
<style>
:root{--bg:#f6f8fb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#172554;--orange:#f97316;--green:#059669;--red:#dc2626;--amber:#d97706}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.hidden{display:none!important}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.topin,.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.topin{height:100%;display:flex;align-items:center;gap:12px}.logo{width:195px;height:54px;object-fit:contain}.top-actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.orange{background:linear-gradient(135deg,#fb923c,#ea580c)}.btn.light{background:#fff;color:#334155;border:1px solid #cbd5e1}.btn.green{background:#059669}.btn.red{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.btn.small{padding:8px 10px;font-size:10px}.wrap{padding:24px 0 60px}.hero{display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(135deg,#fff,#f8fbff 58%,#fff7ed);border:1px solid #e5eaf1;border-radius:24px;padding:24px;box-shadow:0 8px 28px #0f172a06}.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.stat span{display:block;color:var(--muted);font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.05em}.stat b{display:block;font-size:24px;margin-top:4px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;gap:8px;align-items:center;margin-bottom:12px}.tabs{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid #dbe2ea;background:#fff;color:#475569;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:900;cursor:pointer}.tabs button.active{background:#172554;color:#fff;border-color:#172554}.search{margin-left:auto;width:min(300px,40vw);border:1px solid #cbd5e1;border-radius:11px;padding:9px 11px;outline:none}.search:focus{border-color:#fb923c;box-shadow:0 0 0 3px #ffedd5}.list{display:grid;gap:10px}.ad{background:#fff;border:1px solid var(--line);border-radius:19px;padding:12px;display:grid;grid-template-columns:145px minmax(0,1fr) auto;gap:14px;align-items:center;box-shadow:0 7px 22px #0f172a06}.photo{height:108px;border-radius:14px;background:#eef2f7;overflow:hidden;display:grid;place-items:center;color:#94a3b8;font-size:25px}.photo img{width:100%;height:100%;object-fit:cover}.copy{min-width:0}.copy h3{margin:0;font-size:15px;line-height:1.35}.price{font-size:18px;font-weight:950;margin-top:6px}.meta{font-size:9px;color:var(--muted);margin-top:6px;line-height:1.6}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{padding:5px 7px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:8px;font-weight:900}.chip.active{background:#ecfdf5;color:#047857}.chip.pending{background:#fffbeb;color:#b45309}.chip.rejected{background:#fef2f2;color:#b91c1c}.chip.sold{background:#eff6ff;color:#1d4ed8}.chip.withdrawn{background:#f1f5f9;color:#475569}.chip.draft{background:#f5f3ff;color:#6d28d9}.moderation-note{margin-top:7px;padding:8px 9px;border-radius:10px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-size:9px;line-height:1.45}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}.empty{padding:50px 20px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:20px;color:var(--muted)}.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:5px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}.loginbox img{display:block;width:190px;margin:0 auto 17px}.loginbox h1{font-size:23px;margin:0 0 4px}.field{display:grid;gap:5px;margin-top:12px}.field label{font-size:10px;font-weight:900;color:#475569}.field input{border:1px solid #cbd5e1;border-radius:11px;padding:10px}.msg{font-size:10px;color:var(--red);margin-top:8px}@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.ad{grid-template-columns:120px 1fr}.actions{grid-column:1/-1;justify-content:flex-start;max-width:none}.toolbar{display:block}.search{margin:9px 0 0;width:100%}}@media(max-width:560px){.top-actions .hide-mobile{display:none}.logo{width:165px}.wrap{width:min(100% - 20px,1180px);padding-top:15px}.hero{display:block;padding:19px}.hero h1{font-size:25px}.hero .btn{margin-top:13px;width:100%}.stat{padding:12px}.ad{grid-template-columns:92px 1fr;gap:10px}.photo{height:84px}.actions .btn{flex:1}.copy h3{font-size:13px}}
</style>
</head><body>
<div id="login" class="login"><form id="loginForm" class="loginbox"><img src="/images/logo_cuim.png" alt="ЦУИМ"><h1>Мои объявления</h1><div style="font-size:10px;color:#64748b">Войдите в аккаунт продавца.</div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Пароль</label><input id="password" type="password" required></div><button class="btn orange" style="width:100%;margin-top:13px">Войти</button><div id="loginMsg" class="msg"></div></form></div>
<div id="app" class="hidden"><header class="top"><div class="topin"><a href="/"><img class="logo" src="/images/logo_cuim.png" alt="ЦУИМ"></a><div class="top-actions"><a class="btn light hide-mobile" href="/catalog/ads/">Доска объявлений</a><a class="btn orange" href="/post-ad.html">+ Подать объявление</a><button class="btn light" id="logout">Выйти</button></div></div></header><main class="wrap"><section class="hero"><div><h1>Мои объявления</h1><p>Управляйте публикациями, отслеживайте просмотры и статус модерации.</p></div><a class="btn orange" href="/post-ad.html">+ Новое объявление</a></section><section class="stats"><div class="stat"><span>Всего</span><b id="stAll">—</b></div><div class="stat"><span>Активные</span><b id="stActive">—</b></div><div class="stat"><span>На модерации</span><b id="stPending">—</b></div><div class="stat"><span>Просмотры</span><b id="stViews">—</b></div></section><section class="toolbar"><div class="tabs" id="tabs"><button class="active" data-filter="ALL">Все</button><button data-filter="ACTIVE">Активные</button><button data-filter="PENDING">На модерации</button><button data-filter="SOLD">Продано</button><button data-filter="WITHDRAWN">Снято</button><button data-filter="DRAFT">Черновики</button></div><input class="search" id="q" placeholder="Поиск по моим объявлениям"></section><div id="list" class="list"><div class="empty">Загрузка…</div></div></main></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';
const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu');
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));
let rows=[],filter='ALL';
async function guard(){const{data:{session}}=await s.auth.getSession();if(!session)return false;const{data:id,error}=await s.rpc('current_partner_id');if(error||!id){$('loginMsg').textContent='Для этого аккаунта не найден профиль продавца.';return false}$('login').classList.add('hidden');$('app').classList.remove('hidden');await load();return true}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='';const{error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('loginMsg').textContent=error.message;if(!await guard())await s.auth.signOut()};$('logout').onclick=async()=>{await s.auth.signOut();location.reload()};
const listingLabel={ACTIVE:'Активно',SOLD:'Продано',WITHDRAWN:'Снято',DRAFT:'Черновик'},moderationLabel={PENDING:'На модерации',APPROVED:'Проверено',REJECTED:'Отклонено'};
function statusClass(x){return String(x||'').toLowerCase()}
function isPublic(x){return x.listing_status==='ACTIVE'&&x.moderation_status==='APPROVED'}
function actions(x){const a=[`<a class="btn light small" href="/edit-ad.html?id=${encodeURIComponent(x.id)}">✎ Редактировать</a>`];if(isPublic(x))a.push(`<a class="btn light small" href="/ad/?id=${encodeURIComponent(x.id)}">Открыть</a>`);if(x.listing_status==='ACTIVE')a.push(`<button class="btn light small" data-status="SOLD" data-id="${x.id}">Продано</button>`,`<button class="btn red small" data-status="WITHDRAWN" data-id="${x.id}">Снять</button>`);else if(['SOLD','WITHDRAWN','DRAFT'].includes(x.listing_status))a.push(`<button class="btn green small" data-status="ACTIVE" data-id="${x.id}">Опубликовать снова</button>`);return a.join('')}
function card(x){const d=x.marketplace_details||{},facts=[];if(d.negotiable)facts.push('Торг');if(d.exchange)facts.push('Обмен');return`<article class="ad"><div class="photo">${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.title)}" loading="lazy">`:'📷'}</div><div class="copy"><h3>${esc(x.title)}</h3><div class="price">${x.price==null?'Цена по договорённости':money(x.price)}</div><div class="meta">${esc(x.subcategory_title||'Объявление')} · ${Number(x.view_count||0)} просмотров${facts.length?' · '+facts.join(' · '):''}</div><div class="chips"><span class="chip ${statusClass(x.listing_status)}">${esc(listingLabel[x.listing_status]||x.listing_status)}</span><span class="chip ${statusClass(x.moderation_status)}">${esc(moderationLabel[x.moderation_status]||x.moderation_status)}</span></div>${x.moderation_status==='REJECTED'&&x.moderation_note?`<div class="moderation-note"><b>Причина:</b> ${esc(x.moderation_note)}</div>`:''}</div><div class="actions">${actions(x)}</div></article>`}
function render(){const q=$('q').value.trim().toLowerCase();let a=rows.filter(x=>!q||[x.title,x.description,x.subcategory_title].filter(Boolean).join(' ').toLowerCase().includes(q));if(filter==='PENDING')a=a.filter(x=>x.moderation_status==='PENDING');else if(filter!=='ALL')a=a.filter(x=>x.listing_status===filter);$('list').innerHTML=a.length?a.map(card).join(''):`<div class="empty"><b>Объявлений здесь нет</b>${filter==='ALL'?'Создайте первое объявление — это занимает пару минут.':'Попробуйте выбрать другой статус.'}</div>`;document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.status))}
async function setStatus(id,status){const b=document.querySelector(`[data-id="${CSS.escape(id)}"][data-status="${status}"]`);if(b)b.disabled=true;const{error}=await s.rpc('marketplace_set_my_classified_status',{p_product_id:id,p_status:status});if(error){alert(error.message);if(b)b.disabled=false;return}await load()}
function stats(){$('stAll').textContent=rows.length;$('stActive').textContent=rows.filter(isPublic).length;$('stPending').textContent=rows.filter(x=>x.moderation_status==='PENDING').length;$('stViews').textContent=rows.reduce((n,x)=>n+Number(x.view_count||0),0)}
async function load(){const{data,error}=await s.rpc('marketplace_my_classifieds');if(error){$('list').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=data||[];stats();render()}
$('tabs').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()};$('q').oninput=render;if(await guard()){};
</script></body></html>
