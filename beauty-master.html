<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7fb"><title>Мастер красоты — ЦУИМ</title><link rel="icon" href="/images/logo_cuim.png"><style>:root{--ink:#172033;--muted:#64748b;--line:#eadde6;--pink:#db2777;--purple:#7c3aed;--green:#059669}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff,#fff8fc 420px,#f8fafc);color:var(--ink)}button,input,textarea{font:inherit}a{text-decoration:none;color:inherit}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.top{height:74px;background:#fff;border-bottom:1px solid #f0e4eb}.topin{height:100%;display:flex;align-items:center;gap:12px}.logo{width:190px;height:54px;object-fit:contain}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:13px;padding:11px 15px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn.light{background:#fff;color:#475569;border:1px solid #d9dde6}.main{padding:28px 0 70px}.layout{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}.card{background:#fff;border:1px solid #e9e1e7;border-radius:22px;padding:20px;box-shadow:0 10px 32px #0f172a08}.profile{display:flex;gap:16px;align-items:center}.avatar{width:92px;height:92px;border-radius:28px;background:linear-gradient(135deg,#fce7f3,#ede9fe);display:grid;place-items:center;font-size:34px;font-weight:950;color:#831843;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.profile h1{margin:0;font-size:29px}.spec{font-size:11px;color:var(--pink);font-weight:950;margin-top:5px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{padding:6px 8px;border-radius:999px;background:#f8fafc;font-size:9px;font-weight:850;color:#475569}.tag.rating{background:#fffbeb;color:#a16207}.tag.salon{background:#f5f3ff;color:#6d28d9}.bio{font-size:12px;line-height:1.65;color:#475569;margin-top:17px;white-space:pre-wrap}.section-title{margin:24px 0 10px;font-size:21px}.services{display:grid;gap:9px}.service{border:1px solid #e8e1e7;border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px;cursor:pointer}.service.active{border-color:#f472b6;background:#fff7fb}.service h3{margin:0 0 5px;font-size:14px}.service p{margin:0;color:#64748b;font-size:10px;line-height:1.45}.service-price{text-align:right;font-weight:950}.service-price small{display:block;color:#64748b;font-weight:700;margin-top:3px}.portfolio{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.work{border-radius:16px;overflow:hidden;background:#f1f5f9;position:relative;aspect-ratio:1/1}.work img{width:100%;height:100%;object-fit:cover}.work span{position:absolute;left:8px;right:8px;bottom:8px;background:#0f172abf;color:#fff;border-radius:10px;padding:7px 8px;font-size:8px;line-height:1.35}.reviews{display:grid;gap:9px}.review{border:1px solid #e8e1e7;border-radius:16px;padding:13px}.review-top{display:flex;justify-content:space-between;gap:8px}.review b{font-size:11px}.stars{color:#f59e0b;letter-spacing:1px;font-size:13px}.review-text{font-size:10px;color:#475569;line-height:1.55;margin-top:7px;white-space:pre-wrap}.reply{margin-top:9px;padding:9px;border-radius:11px;background:#f8fafc;font-size:9px;color:#475569;line-height:1.5}.booking{position:sticky;top:16px}.booking h2{margin:0 0 5px;font-size:21px}.hint{font-size:10px;color:#64748b;line-height:1.5}.field{display:grid;gap:5px;margin-top:12px}.field label{font-size:9px;font-weight:900;color:#475569}.field input,.field textarea{border:1px solid #cbd5e1;border-radius:11px;padding:10px 11px;outline:none}.times{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.time{border:1px solid #d6dbe5;border-radius:10px;background:#fff;padding:9px 11px;font-weight:900;font-size:10px;cursor:pointer}.time.active{background:#831843;color:#fff;border-color:#831843}.selected{margin-top:12px;padding:10px 11px;border-radius:12px;background:#fdf2f8;color:#831843;font-size:10px;font-weight:850}.success{margin-top:12px;padding:12px;border-radius:13px;background:#ecfdf5;color:#047857;font-size:11px;line-height:1.5}.success a{font-weight:950;text-decoration:underline}.empty{padding:28px;text-align:center;color:#64748b;border:1px dashed #d8cbd4;border-radius:16px}.loading{padding:60px;text-align:center}.hidden{display:none!important}@media(max-width:820px){.layout{grid-template-columns:1fr}.booking{position:static}.profile{align-items:flex-start}.avatar{width:76px;height:76px;border-radius:22px}.profile h1{font-size:25px}}@media(max-width:620px){.portfolio{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.top{height:66px}.logo{width:155px}.actions .hide{display:none}.main{padding-top:16px}.card{padding:15px;border-radius:18px}.profile{display:block}.avatar{margin-bottom:12px}.service{grid-template-columns:1fr}.service-price{text-align:left}.portfolio{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="wrap topin"><a href="/"><img class="logo" src="/images/logo_cuim.png" alt="ЦУИМ"></a><div class="actions"><a class="btn light hide" href="/catalog/services/beauty/">← Все мастера</a><a class="btn light" href="/beauty-bookings.html">Мои записи</a><a class="btn light hide" href="/beauty-workspace.html">Beauty Pro</a></div></div></header><main class="wrap main"><div id="loading" class="loading">Загружаем профиль мастера…</div><div id="page" class="layout hidden"><section><div class="card"><div class="profile"><div class="avatar" id="avatar">М</div><div><h1 id="name">Мастер</h1><div class="spec" id="spec"></div><div class="meta" id="meta"></div></div></div><div class="bio" id="bio"></div></div><h2 class="section-title">Услуги и цены</h2><div class="services" id="services"></div><section id="portfolioSection" class="hidden"><h2 class="section-title">Портфолио</h2><div class="portfolio" id="portfolio"></div></section><section id="reviewsSection" class="hidden"><h2 class="section-title">Отзывы <span id="reviewCount" style="font-size:11px;color:#64748b"></span></h2><div class="reviews" id="reviews"></div></section></section><aside class="card booking"><h2>Онлайн-запись</h2><div class="hint">Выберите услугу, дату и свободное время. Учтены рабочий график, перерывы и уже занятые записи.</div><div class="field"><label>Дата</label><input id="date" type="date"></div><div class="times" id="times"><span class="hint">Сначала выберите услугу.</span></div><div id="selected" class="selected hidden"></div><div id="form" class="hidden"><div class="field"><label>Ваше имя</label><input id="customerName" maxlength="120" placeholder="Как к вам обращаться"></div><div class="field"><label>Телефон</label><input id="phone" maxlength="40" placeholder="+7 ..."></div><div class="field"><label>Комментарий</label><textarea id="comment" rows="3" maxlength="500" placeholder="Например, пожелания к услуге"></textarea></div><button class="btn" id="book" style="width:100%;margin-top:12px">Записаться</button></div><div id="success" class="success hidden"></div></aside></div><div id="error" class="empty hidden">Профиль мастера не найден или пока не опубликован.</div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const specs={NAILS:'Ногти',HAIR:'Парикмахер',BROWS:'Брови',LASHES:'Ресницы',MAKEUP:'Макияж',COSMETOLOGY:'Косметология',MASSAGE:'Массаж',BARBER:'Барбер',DEPILATION:'Депиляция',OTHER:'Мастер красоты'};const id=new URLSearchParams(location.search).get('id');let profile=null,service=null,time=null;function money(v){return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0))}function initials(v){return String(v||'М').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function localDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}const now=new Date(),max=new Date();max.setDate(max.getDate()+60);$('date').min=localDate(now);$('date').max=localDate(max);$('date').value=localDate(now);async function load(){if(!id)return fail();const{data,error}=await s.rpc('marketplace_beauty_profile',{p_profile_id:id});profile=data?.[0];if(error||!profile)return fail();$('loading').classList.add('hidden');$('page').classList.remove('hidden');document.title=`${profile.display_name} — запись онлайн | ЦУИМ`;$('name').textContent=profile.display_name;$('spec').textContent=specs[profile.specialty]||'Мастер красоты';$('avatar').innerHTML=profile.avatar_url?`<img src="${esc(profile.avatar_url)}" alt="${esc(profile.display_name)}">`:esc(initials(profile.display_name));$('meta').innerHTML=`${profile.rating?`<span class="tag rating">★ ${esc(profile.rating)} · ${Number(profile.review_count||0)} отзывов</span>`:''}<span class="tag">📍 ${esc(profile.city||'Город')}</span>${profile.address?`<span class="tag">${esc(profile.address)}</span>`:''}${profile.experience_years!=null?`<span class="tag">Опыт ${profile.experience_years} г.</span>`:''}${profile.salon_name?`<a class="tag salon" href="/beauty-salon.html?id=${encodeURIComponent(profile.salon_id)}">🏢 ${esc(profile.salon_name)} →</a>`:''}`;$('bio').textContent=profile.bio||profile.headline||'Мастер красоты ЦУИМ.';const a=Array.isArray(profile.services)?profile.services:[];$('services').innerHTML=a.length?a.map(x=>`<div class="service" data-id="${x.id}"><div><h3>${esc(x.title)}</h3><p>${esc(x.description||'')}</p></div><div class="service-price">${money(x.price)}<small>${x.duration_minutes} мин.</small></div></div>`).join(''):'<div class="empty">Мастер пока не добавил услуги.</div>';document.querySelectorAll('.service').forEach(el=>el.onclick=()=>selectService(a.find(x=>x.id===el.dataset.id),el));const works=Array.isArray(profile.portfolio)?profile.portfolio:[];if(works.length){$('portfolioSection').classList.remove('hidden');$('portfolio').innerHTML=works.map(x=>`<div class="work"><img src="${esc(x.image_url)}" alt="${esc(x.caption||'Работа мастера')}" loading="lazy">${x.caption?`<span>${esc(x.caption)}</span>`:''}</div>`).join('')}const reviews=Array.isArray(profile.reviews)?profile.reviews:[];if(reviews.length){$('reviewsSection').classList.remove('hidden');$('reviewCount').textContent=`(${reviews.length})`;$('reviews').innerHTML=reviews.map(r=>`<article class="review"><div class="review-top"><b>${esc(r.author_name||'Клиент')}</b><span class="stars">${'★'.repeat(Number(r.rating||0))}${'☆'.repeat(5-Number(r.rating||0))}</span></div>${r.text?`<div class="review-text">${esc(r.text)}</div>`:''}${r.master_reply?`<div class="reply"><b>Ответ мастера:</b><br>${esc(r.master_reply)}</div>`:''}</article>`).join('')}if(a.length)selectService(a[0],document.querySelector('.service'))}function fail(){$('loading').classList.add('hidden');$('error').classList.remove('hidden')}async function selectService(x,el){service=x;time=null;document.querySelectorAll('.service').forEach(v=>v.classList.toggle('active',v===el));$('form').classList.add('hidden');$('selected').classList.add('hidden');await loadTimes()}async function loadTimes(){if(!service)return;$('times').innerHTML='<span class="hint">Ищем свободное время…</span>';const{data,error}=await s.rpc('marketplace_beauty_available_times',{p_profile_id:id,p_service_id:service.id,p_date:$('date').value});if(error){$('times').innerHTML=`<span class="hint">${esc(error.message)}</span>`;return}const a=data||[];$('times').innerHTML=a.length?a.map(x=>`<button class="time" data-time="${x.start_time}">${esc(x.start_time)}</button>`).join(''):'<span class="hint">На эту дату свободных окон нет.</span>';document.querySelectorAll('.time').forEach(b=>b.onclick=()=>chooseTime(b.dataset.time,b))}function chooseTime(v,b){time=v;document.querySelectorAll('.time').forEach(x=>x.classList.toggle('active',x===b));$('selected').textContent=`${service.title} · ${new Date($('date').value+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})} · ${v} · ${money(service.price)}`;$('selected').classList.remove('hidden');$('form').classList.remove('hidden');$('success').classList.add('hidden')}$('date').onchange=()=>{time=null;$('form').classList.add('hidden');$('selected').classList.add('hidden');loadTimes()};$('book').onclick=async()=>{if(!service||!time)return;const{data:{session}}=await s.auth.getSession();if(!session){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return}const name=$('customerName').value.trim(),phone=$('phone').value.trim();if(name.length<2||phone.length<5)return alert('Укажите имя и телефон.');$('book').disabled=true;const bookedTime=time;const{error}=await s.rpc('marketplace_book_beauty_slot',{p_profile_id:id,p_service_id:service.id,p_date:$('date').value,p_start_time:bookedTime,p_customer_name:name,p_customer_phone:phone,p_comment:$('comment').value.trim()||null});$('book').disabled=false;if(error){alert(error.message);await loadTimes();return}$('success').innerHTML=`<b>Запись подтверждена.</b><br>${esc(service.title)} · ${new Date($('date').value+'T00:00:00').toLocaleDateString('ru-RU')} · ${esc(bookedTime)}.<br><a href="/beauty-bookings.html">Открыть мои записи →</a>`;$('success').classList.remove('hidden');$('form').classList.add('hidden');$('selected').classList.add('hidden');time=null;await loadTimes()};load();</script></body></html>
