<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>Уведомления — ЦУИМ</title><link rel="icon" href="/images/logo_cuim.png"><style>
:root{--bg:#f6f8fb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--nav:#172554;--orange:#f97316;--red:#e11d48}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.hidden{display:none!important}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.topin,.wrap{width:min(960px,calc(100% - 28px));margin:auto}.topin{height:100%;display:flex;align-items:center;gap:10px}.logo{width:195px;height:54px;object-fit:contain}.top-actions{margin-left:auto;display:flex;gap:7px}.btn{border:0;border-radius:12px;padding:10px 13px;background:var(--nav);color:#fff;text-decoration:none;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.light{background:#fff;color:#334155;border:1px solid #cbd5e1}.btn.orange{background:linear-gradient(135deg,#fb923c,#ea580c)}.wrap{padding:24px 0 60px}.hero{background:linear-gradient(135deg,#fff,#f8fbff 58%,#fff7ed);border:1px solid #e5eaf1;border-radius:24px;padding:23px;display:flex;align-items:center;justify-content:space-between;gap:15px}.hero h1{margin:0;font-size:29px}.hero p{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.hero-count{min-width:82px;text-align:center;border:1px solid #e2e8f0;background:#fff;border-radius:16px;padding:10px}.hero-count span{display:block;font-size:8px;color:var(--muted);font-weight:900;text-transform:uppercase}.hero-count b{display:block;font-size:24px;margin-top:2px}.toolbar{display:flex;align-items:center;gap:8px;margin:13px 0;background:#fff;border:1px solid var(--line);border-radius:17px;padding:9px}.tabs{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.tabs button{border:1px solid #dbe2ea;background:#fff;color:#475569;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:900;white-space:nowrap;cursor:pointer}.tabs button.active{background:#172554;color:#fff;border-color:#172554}.toolbar .allread{margin-left:auto}.list{display:grid;gap:9px}.note{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 16px;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:start;box-shadow:0 7px 24px #0f172a05;cursor:pointer}.note.unread{border-color:#fdba74;background:linear-gradient(135deg,#fff,#fffaf5)}.note.unread:before{content:"";position:absolute;left:-4px;top:19px;width:8px;height:8px;border-radius:50%;background:#f97316}.ico{width:46px;height:46px;border-radius:14px;background:#f1f5f9;display:grid;place-items:center;font-size:20px}.note.unread .ico{background:#fff7ed}.copy{min-width:0}.copy h3{margin:1px 0 5px;font-size:13px;line-height:1.35}.copy p{margin:0;color:#64748b;font-size:10px;line-height:1.55;white-space:pre-wrap}.meta{font-size:8px;color:#94a3b8;margin-top:7px}.note-actions{display:flex;align-items:center;gap:5px}.open{font-size:10px;color:#2563eb;font-weight:900;white-space:nowrap}.mark{border:0;background:#f1f5f9;border-radius:9px;padding:7px 8px;color:#475569;font-size:9px;font-weight:900;cursor:pointer}.empty{padding:60px 20px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:20px;color:#64748b}.empty b{display:block;font-size:18px;color:#0f172a;margin-bottom:5px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}.loginbox img{display:block;width:190px;margin:0 auto 18px}.loginbox h1{margin:0 0 4px;font-size:23px}.field{display:grid;gap:5px;margin-top:12px}.field label{font-size:9px;font-weight:900;color:#475569}.field input{border:1px solid #cbd5e1;border-radius:11px;padding:10px}.msg{font-size:10px;color:#dc2626;margin-top:8px}@media(max-width:680px){.top{height:66px}.logo{width:165px;height:48px}.top-actions .hide-mobile{display:none}.wrap{width:min(100% - 20px,960px);padding-top:15px}.hero{padding:19px}.hero h1{font-size:25px}.toolbar{display:block}.toolbar .allread{width:100%;margin-top:8px}.note{grid-template-columns:40px 1fr;padding:13px;gap:10px}.ico{width:40px;height:40px;border-radius:12px}.note-actions{grid-column:2;justify-content:flex-start}.open{display:none}}
</style><script src="/maintenance-guard.js"></script>
</head><body>
<div id="login" class="login"><form id="loginForm" class="loginbox"><img src="/images/logo_cuim.png" alt="ЦУИМ"><h1>Уведомления</h1><div style="font-size:10px;color:#64748b">Войдите, чтобы увидеть сообщения ЦУИМ.</div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Пароль</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn orange" style="width:100%;margin-top:13px">Войти</button><div id="loginMsg" class="msg"></div></form></div>
<div id="app" class="hidden"><header class="top"><div class="topin"><a href="/"><img class="logo" src="/images/logo_cuim.png" alt="ЦУИМ"></a><div class="top-actions"><a class="btn light hide-mobile" href="/messages.html">Сообщения</a><a class="btn light hide-mobile" href="/my-ads.html">Мои объявления</a><button class="btn light" id="logout">Выйти</button></div></div></header><main class="wrap"><section class="hero"><div><h1>Уведомления</h1><p>Сообщения, заказы, отзывы, объявления, онлайн-записи и важные события вашего аккаунта ЦУИМ.</p></div><div class="hero-count"><span>Непрочитано</span><b id="unread">0</b></div></section><section class="toolbar"><div class="tabs" id="tabs"><button class="active" data-filter="ALL">Все</button><button data-filter="UNREAD">Непрочитанные</button><button data-filter="CLASSIFIED">Объявления</button><button data-filter="BEAUTY">Записи</button><button data-filter="STORE">Магазин</button><button data-filter="MESSAGE">Сообщения</button></div><button class="btn light allread" id="allRead">Прочитать всё</button></section><div id="list" class="list"><div class="empty">Загрузка…</div></div></main></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';
const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let session=null,rows=[],filter='ALL',channel=null;
const icons={MESSAGE:'💬',CLASSIFIED_APPROVED:'✅',CLASSIFIED_REJECTED:'✏️',CLASSIFIED_HIDDEN:'⛔',CLASSIFIED_EXPIRING:'⏳',CLASSIFIED_EXPIRED:'⌛',BEAUTY_BOOKING_NEW:'📅',BEAUTY_BOOKING_CONFIRMED:'💗',BEAUTY_BOOKING_STATUS:'✂️',BEAUTY_BOOKING_CANCELLED_BY_CUSTOMER:'❌',BEAUTY_BOOKING_RESCHEDULED:'🔄',BEAUTY_REVIEW_NEW:'⭐',BEAUTY_REVIEW_REPLY:'💬',BEAUTY_REMINDER_24H:'⏰',BEAUTY_REMINDER_2H:'⏰',MARKETPLACE_ORDER_NEW:'🛍️',MARKETPLACE_REVIEW_NEW:'⭐'};
function age(v){if(!v)return'';const d=new Date(v),ms=Date.now()-d.getTime(),m=Math.floor(ms/60000);if(m<1)return'только что';if(m<60)return`${m} мин. назад`;const h=Math.floor(m/60);if(h<24)return`${h} ч. назад`;const days=Math.floor(h/24);if(days<7)return`${days} дн. назад`;return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function safeUrl(v){const x=String(v||'');return x.startsWith('/')&&!x.startsWith('//')?x:'/notifications.html'}
function classifiedType(t){return String(t||'').startsWith('CLASSIFIED_')}function beautyType(t){return String(t||'').startsWith('BEAUTY_')}function storeType(t){return String(t||'').startsWith('MARKETPLACE_ORDER_')||String(t||'').startsWith('MARKETPLACE_REVIEW_')}
function render(){let a=rows;if(filter==='UNREAD')a=a.filter(x=>!x.is_read);else if(filter==='CLASSIFIED')a=a.filter(x=>classifiedType(x.type));else if(filter==='BEAUTY')a=a.filter(x=>beautyType(x.type));else if(filter==='STORE')a=a.filter(x=>storeType(x.type));else if(filter==='MESSAGE')a=a.filter(x=>x.type==='MESSAGE');$('unread').textContent=rows.filter(x=>!x.is_read).length;$('allRead').disabled=!rows.some(x=>!x.is_read);$('list').innerHTML=a.length?a.map(x=>`<article class="note ${x.is_read?'':'unread'}" data-open="${x.id}" data-url="${esc(safeUrl(x.url))}"><div class="ico">${icons[x.type]||'🔔'}</div><div class="copy"><h3>${esc(x.title)}</h3>${x.body?`<p>${esc(x.body)}</p>`:''}<div class="meta">${esc(age(x.created_at))}</div></div><div class="note-actions">${x.is_read?'':`<button class="mark" data-read="${x.id}">Прочитано</button>`}<span class="open">Открыть →</span></div></article>`).join(''):'<div class="empty"><b>Здесь пока тихо</b>Новые события появятся в этом разделе.</div>';document.querySelectorAll('[data-read]').forEach(b=>b.onclick=async e=>{e.stopPropagation();await markRead(b.dataset.read)});document.querySelectorAll('[data-open]').forEach(n=>n.onclick=async()=>{const id=n.dataset.open;if(!rows.find(x=>x.id===id)?.is_read)await markRead(id,false);location.href=n.dataset.url})}
async function markRead(id,rerender=true){const{error}=await s.from('marketplace_notifications').update({is_read:true,read_at:new Date().toISOString()}).eq('id',id).eq('recipient_auth_user_id',session.user.id);if(error)return alert(error.message);const x=rows.find(v=>v.id===id);if(x){x.is_read=true;x.read_at=new Date().toISOString()}if(rerender)render()}
async function load(){const{data,error}=await s.from('marketplace_notifications').select('id,type,title,body,url,entity_type,entity_id,is_read,read_at,created_at').eq('recipient_auth_user_id',session.user.id).order('created_at',{ascending:false}).limit(200);if(error){$('list').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=data||[];render()}
async function installRealtime(){if(channel)await s.removeChannel(channel);channel=s.channel(`notification-center-${session.user.id}`).on('postgres_changes',{event:'*',schema:'public',table:'marketplace_notifications',filter:`recipient_auth_user_id=eq.${session.user.id}`},()=>load()).subscribe()}
async function guard(){session=(await s.auth.getSession()).data.session;if(!session)return false;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load();await installRealtime();return true}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='';const{error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('loginMsg').textContent=error.message;await guard()};$('logout').onclick=async()=>{await s.auth.signOut();location.reload()};$('tabs').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()};$('allRead').onclick=async()=>{if(!rows.some(x=>!x.is_read))return;const{error}=await s.from('marketplace_notifications').update({is_read:true,read_at:new Date().toISOString()}).eq('recipient_auth_user_id',session.user.id).eq('is_read',false);if(error)return alert(error.message);rows.forEach(x=>{x.is_read=true});render()};await guard();
</script></body></html>
