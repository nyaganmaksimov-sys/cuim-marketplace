.below{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;margin:22px 0 48px}.content-stack{display:grid;gap:16px}.content-card{padding:22px}.content-card h2,.seller-card h2{font-size:20px;margin:0 0 14px}.description{color:#334155;line-height:1.7;font-size:14px;white-space:pre-wrap}.description.empty{color:#94a3b8}.specs{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.spec{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid #eef2f7;font-size:12px}.spec span{color:var(--m)}.spec b{text-align:right;font-weight:850}.seller-card{padding:20px;height:max-content;position:sticky;top:96px}.seller-head{display:flex;align-items:center;gap:12px}.seller-avatar{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#38bdf8,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:950;font-size:17px}.seller-copy b{display:block;font-size:15px}.seller-copy span{display:block;color:var(--m);font-size:11px;margin-top:3px}.seller-desc{font-size:12px;line-height:1.55;color:#475569;margin:14px 0}.seller-actions{display:grid;gap:8px}.similar-wrap{margin-bottom:58px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 0 14px}.section-head h2{margin:0;font-size:26px}.section-head span{color:var(--m);font-size:12px}.similar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.similar-item{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 7px 22px #0f172a07;transition:.18s}.similar-item:hover{transform:translateY(-2px);border-color:#c7d2fe;box-shadow:0 14px 32px #0f172a12}.similar-img{height:180px;background:linear-gradient(145deg,#f8fafc,#eef2ff);display:grid;place-items:center;overflow:hidden}.similar-img img{width:100%;height:100%;object-fit:contain;padding:8px}.similar-body{padding:13px}.similar-seller{font-size:9px;color:var(--b);font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.similar-item h3{font-size:13px;line-height:1.35;margin:5px 0;min-height:35px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.similar-price{font-size:18px;font-weight:950}.error{padding:70px 20px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:22px;color:var(--m)}.error h1{color:var(--ink);font-size:27px}.mobile-bar{display:none}footer{background:var(--nav);color:#aebbd0;padding:30px 0;margin-top:20px}.foot{display:flex;justify-content:space-between;gap:16px}.foot b{color:#fff}
@media(max-width:1050px){.offer-grid{grid-template-columns:minmax(0,1fr) 370px}.below{grid-template-columns:1fr 320px}.similar{grid-template-columns:repeat(3,1fr)}}@media(max-width:820px){.utility,.nav{display:none}.brand{width:178px}.actions .hide-mobile{display:none}.wrap{width:min(100% - 20px,1380px)}.offer-grid{grid-template-columns:1fr}.main-photo{height:min(78vw,560px);min-height:300px}.buy-card{position:static;padding:19px}.buy-actions{display:none}.below{grid-template-columns:1fr}.seller-card{position:static}.similar{grid-template-columns:repeat(2,1fr)}.mobile-bar{display:grid;grid-template-columns:1fr 1.15fr;gap:8px;position:fixed;z-index:100;left:0;right:0;bottom:0;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:#fffffff2;border-top:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 -10px 30px #0f172a12}.mobile-bar .btn{min-height:48px}.similar-wrap{margin-bottom:100px}footer{margin-bottom:74px}}@media(max-width:520px){.main-photo{height:82vw;min-height:270px}.gallery{padding:10px;border-radius:18px}.main-photo{border-radius:13px}.gallery-badge{left:18px;top:18px}.buy-card h1{font-size:27px}.price{font-size:31px}.content-card{padding:17px}.specs{grid-template-columns:1fr}.similar{grid-template-columns:1fr 1fr;gap:9px}.similar-img{height:145px}.similar-body{padding:10px}.similar-price{font-size:16px}.section-head h2{font-size:22px}.foot{display:block}}

<body>
<div class="utility"><div class="wrap"><span>ЦУИМ — городской маркетплейс</span><span>Товары · Услуги · Компании · Город</span></div></div>
<header class="top"><div class="wrap topin"><a class="brand" href="/"><img src="/images/logo_cuim.png" alt="ЦУИМ"></a><nav class="nav"><a href="/catalog/">Каталог</a><a href="/#companies">Компании</a><a href="/messages.html">Сообщения</a></nav><div class="actions"><a class="btn light cart-link hide-mobile" href="/cart.html">🛒 Корзина <span id="cartCount" class="cart-count"></span></a><a class="btn hide-mobile" id="accountLink" href="/login.html">Личный кабинет</a></div></div></header>
<main class="wrap"><div class="crumbs" id="crumbs"><a href="/">Главная</a><span>›</span><a href="/catalog/">Каталог</a><span>›</span><span>Предложение</span></div><div id="app"><div class="error">Загрузка предложения…</div></div></main>

<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';
const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu');
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));
const id=new URLSearchParams(location.search).get('id');let item=null,session=null;
const typeName={PRODUCT:'Товар',SERVICE:'Услуга',JOB:'Работа',FOOD:'Еда',AUTO:'Авто',EVENT:'Событие'};
const conditionName={NEW:'Новое',USED:'Б/у',REFURBISHED:'Восстановленное',OTHER:'Другое'};
function initials(v){return String(v||'Ц').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'Ц'}
function cart(){try{return JSON.parse(localStorage.getItem('cuim-cart:v1')||'[]')}catch{return[]}}
function updateCart(){const n=cart().reduce((a,x)=>a+Math.max(1,Number(x.quantity)||1),0),b=$('cartCount');if(b){b.textContent=n>99?'99+':n;b.classList.toggle('show',n>0)}}
const STOCK_STATES=['IN_STOCK','LOW_STOCK','ON_ORDER','OUT_OF_STOCK'];
function stockStatus(x=item){const explicit=x?.marketplace_details?.stock_status;if(STOCK_STATES.includes(explicit))return explicit;if(x?.quantity==null)return'IN_STOCK';const q=Number(x.quantity);if(!Number.isFinite(q))return'IN_STOCK';if(q<=0)return'OUT_OF_STOCK';if(q<=3)return'LOW_STOCK';return'IN_STOCK'}
function stockMax(x=item){if(stockStatus(x)==='OUT_OF_STOCK')return 0;const q=Number(x?.quantity);return x?.quantity==null||!Number.isFinite(q)?99:Math.max(0,Math.min(99,Math.trunc(q)))}
function canBuy(x=item){return stockStatus(x)!=='OUT_OF_STOCK'&&stockMax(x)>0}
function addCart(){if(!item||!canBuy(item))return;const a=cart(),x=a.find(v=>v.product_id===item.id),max=stockMax(item);if(x)x.quantity=Math.min(max,Math.max(1,Number(x.quantity)||1)+1);else a.push({product_id:item.id,quantity:1});localStorage.setItem('cuim-cart:v1',JSON.stringify(a));updateCart();for(const b of document.querySelectorAll('[data-primary],#mobilePrimary')){b.textContent='Добавлено ✓';setTimeout(()=>b.textContent=primaryLabel(),1200)}}
function primaryLabel(){if(!canBuy(item))return'Нет в наличии';return stockStatus(item)==='ON_ORDER'?'Заказать':'В корзину'}
function canCart(){return ['PRODUCT','FOOD'].includes(item?.marketplace_offer_type)}
function primaryActionHtml(){if(!canCart())return`<button class="btn" data-message>${item.marketplace_offer_type==='SERVICE'?'Заказать':'Связаться'}</button>`;if(!canBuy(item))return'<button class="btn light" disabled>Нет в наличии</button>';return`<button class="btn" data-primary>${primaryLabel()}</button>`}
async function auth(){session=(await s.auth.getSession()).data.session;if(session){const a=$('accountLink');if(a){a.href='/account.html';a.textContent='Личный кабинет'}}}
async function messageSeller(){if(!item)return;if(!session){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return}const{data,error}=await s.rpc('marketplace_open_product_conversation',{p_product_id:item.id});if(error){alert(error.message);return}location.href='/messages.html?conversation='+encodeURIComponent(data)}
function locationText(){return[item?.city,item?.address].filter(Boolean).join(', ')||'Местонахождение уточняется у продавца'}
function formatDate(v){if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
function stockInfo(){if(!canCart())return['Предложение активно',''];const st=stockStatus(item),q=Number(item?.quantity);if(st==='OUT_OF_STOCK')return['Нет в наличии','none'];if(st==='ON_ORDER')return['Под заказ','order'];if(st==='LOW_STOCK')return[Number.isFinite(q)&&q>0?`Осталось ${q} шт.`:'Ограниченный остаток','low'];return[Number.isFinite(q)&&q>0&&q<=10?`В наличии: ${q} шт.`:'В наличии','']}
function detailPairs(){const d=item?.marketplace_details||{},pairs=[];const add=(k,v)=>{if(v!==null&&v!==undefined&&v!==''&&v!==false)pairs.push([k,v===true?'Да':v])};add('Категория',item?.category);add('Артикул',item?.sku);add('Единица',item?.unit);if(d.condition)add('Состояние',conditionName[d.condition]||d.condition);if(d.brand)add('Бренд',d.brand);if(d.model)add('Модель',d.model);if(d.model_compatibility)add('Совместимость',d.model_compatibility);if(d.warranty_months)add('Гарантия',`${d.warranty_months} мес.`);if(d.format)add('Формат',{ONSITE:'На месте',REMOTE:'Удалённо',HYBRID:'На месте или удалённо'}[d.format]||d.format);if(d.duration_minutes)add('Продолжительность',`${d.duration_minutes} мин.`);if(d.service_area)add('Зона оказания',d.service_area);if(d.weight)add('Вес',`${d.weight} ${d.weight_unit||'г'}`);if(d.cooking_minutes)add('Время приготовления',`≈ ${d.cooking_minutes} мин.`);if(d.venue)add('Место',d.venue);if(d.age_limit)add('Возраст',d.age_limit);if(d.start_at)add('Дата события',new Date(d.start_at).toLocaleString('ru-RU'));if(d.employment_type)add('Занятость',{FULL:'Полная',PART:'Частичная',PROJECT:'Проектная',INTERNSHIP:'Стажировка'}[d.employment_type]||d.employment_type);if(d.schedule)add('График',d.schedule);if(d.remote)add('Удалённо','Да');if(d.experience)add('Опыт',{NONE:'Без опыта','1_3':'1–3 года','3_6':'3–6 лет','6_PLUS':'6+ лет'}[d.experience]||d.experience);if(d.delivery)add('Доставка','Есть');if(d.pickup)add('Самовывоз','Есть');return pairs}
function priceHtml(){if(item.price==null)return`<div class="price">Цена по запросу</div>`;const old=Number(item.old_price),cur=Number(item.price),discount=old>cur?Math.round((1-cur/old)*100):0;return`<div class="price-row"><div class="price">${money(cur)}</div>${item.unit?`<span class="unit">/ ${esc(item.unit)}</span>`:''}${old>cur?`<span class="old-price">${money(old)}</span><span class="discount">−${discount}%</span>`:''}</div>`}
function deliveryBenefits(){const d=item.marketplace_details||{},a=[];if(d.delivery)a.push(['🚚','Доставка','Условия и срок уточняются у продавца']);if(d.pickup)a.push(['🏪','Самовывоз','Можно забрать у продавца']);if(d.warranty_months)a.push(['✓','Гарантия',`${d.warranty_months} мес.`]);if(!a.length)a.push(['💬','Уточните условия','Наличие, сроки и способ получения — в сообщениях ЦУИМ']);return a}
function render(){const [stock,stockClass]=stockInfo(),pairs=detailPairs(),seller=item.partner_name||'Участник города',desc=String(item.description||'').trim();document.title=`${item.title} — ЦУИМ`;document.querySelector('meta[name="description"]')?.setAttribute('content',(desc||`${item.title} — предложение ${seller} в ЦУИМ`).slice(0,155));$('crumbs').innerHTML=`<a href="/">Главная</a><span>›</span><a href="/catalog/">Каталог</a><span>›</span>${item.marketplace_section_key?`<a href="/catalog/${encodeURIComponent(item.marketplace_section_key)}/">${esc(item.category||typeName[item.marketplace_offer_type]||'Каталог')}</a><span>›</span>`:''}<span>${esc(item.title)}</span>`;const sellerUrl='/seller.html?id='+encodeURIComponent(item.partner_id);$('app').innerHTML=`<section class="offer-grid"><article class="gallery"><div class="main-photo">${item.image_url?`<img src="${esc(item.image_url)}" alt="${esc(item.title)}">`:'<div class="no-photo"><strong>▣</strong><span>Изображение пока не добавлено</span></div>'}</div><span class="gallery-badge">${esc(item.category||typeName[item.marketplace_offer_type]||'Предложение')}</span></article><aside class="buy-card"><div class="offer-type"><span class="pill blue">${esc(typeName[item.marketplace_offer_type]||'Предложение')}</span>${item.marketplace_details?.condition?`<span class="pill">${esc(conditionName[item.marketplace_details.condition]||item.marketplace_details.condition)}</span>`:''}<span class="pill good">● Опубликовано</span></div><h1>${esc(item.title)}</h1><div class="seller-line">Продавец: <a href="${sellerUrl}">${esc(seller)}</a></div><div class="pricebox">${priceHtml()}<div class="stock ${stockClass}">${esc(stock)}</div></div><div class="buy-actions">${primaryActionHtml()}<button class="btn light" data-message>Написать</button><a class="btn soft wide" href="${sellerUrl}">Открыть профиль продавца</a></div><div class="benefits">${deliveryBenefits().map(x=>`<div class="benefit"><i>${x[0]}</i><div><b>${esc(x[1])}</b><span>${esc(x[2])}</span></div></div>`).join('')}</div><div class="location"><b>📍 ${esc(item.city||'Город не указан')}</b><br>${esc(item.address||'Точный адрес и условия получения уточняются у продавца.')}</div></aside></section><section class="below"><div class="content-stack"><article class="content-card"><h2>Описание</h2><div class="description ${desc?'':'empty'}">${esc(desc||'Продавец пока не добавил подробное описание. Задайте вопрос через сообщения ЦУИМ.')}</div></article><article class="content-card"><h2>Характеристики</h2><div class="specs">${pairs.length?pairs.map(([k,v])=>`<div class="spec"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join(''):'<div class="description empty">Характеристики пока не заполнены.</div>'}</div></article></div><aside class="seller-card"><h2>Продавец</h2><div class="seller-head"><div class="seller-avatar">${esc(initials(seller))}</div><div class="seller-copy"><b>${esc(seller)}</b><span>${esc(item.city||'Участник городской платформы')}</span></div></div><div class="seller-desc">${esc(String(item.partner_description||'').trim()||'Публичный участник ЦУИМ. Уточняйте наличие, сроки, доставку и другие условия напрямую в сообщениях.')}</div><div class="seller-actions"><button class="btn" data-message>Написать продавцу</button><a class="btn light" href="${sellerUrl}">Все предложения продавца</a></div></aside></section><section class="similar-wrap" id="similarBlock" hidden><div class="section-head"><div><h2>Похожие предложения</h2><span>В вашем городе и этой категории</span></div><a href="/catalog/" class="btn light">В каталог</a></div><div class="similar" id="similar"></div></section>`;bind();loadSimilar();const mobilePrimary=$('mobilePrimary');mobilePrimary.disabled=false;if(canCart()){mobilePrimary.textContent=primaryLabel();if(canBuy(item))mobilePrimary.onclick=addCart;else{mobilePrimary.disabled=true;mobilePrimary.onclick=null}}else{mobilePrimary.textContent=item.marketplace_offer_type==='SERVICE'?'Заказать':'Связаться';mobilePrimary.onclick=messageSeller}$('mobileMessage').onclick=messageSeller}
function bind(){document.querySelectorAll('[data-primary]').forEach(b=>b.onclick=addCart);document.querySelectorAll('[data-message]').forEach(b=>b.onclick=messageSeller)}
function localGeo(){try{return JSON.parse(localStorage.getItem('cuim-geo:v1')||'null')}catch{return null}}
async function loadSimilar(){const g=localGeo()||{};const{data,error}=await s.rpc('marketplace_catalog_products_v4',{p_query:null,p_section:item.marketplace_section_key||null,p_subcategory:item.marketplace_subcategory_key||null,p_partner_id:null,p_city_id:g.city_id||null,p_area_id:g.area_id||null,p_metro_id:g.metro_id||null,p_radius_m:Number(g.radius_m||3000)});if(error)return;let a=(data||[]).filter(x=>x.id!==item.id);if(a.length<4&&item.marketplace_subcategory_key){const r=await s.rpc('marketplace_catalog_products_v4',{p_query:null,p_section:item.marketplace_section_key||null,p_subcategory:null,p_partner_id:null,p_city_id:g.city_id||null,p_area_id:g.area_id||null,p_metro_id:g.metro_id||null,p_radius_m:Number(g.radius_m||3000)});if(!r.error)a=(r.data||[]).filter(x=>x.id!==item.id)}a=a.slice(0,4);if(!a.length)return;$('similar').innerHTML=a.map(x=>`<a class="similar-item" href="/offer.html?id=${encodeURIComponent(x.id)}"><div class="similar-img">${x.image_url?`<img src="${esc(x.image_url)}" loading="lazy" alt="${esc(x.title)}">`:'<span style="color:#94a3b8">Нет фото</span>'}</div><div class="similar-body"><div class="similar-seller">${esc(x.partner_name||'Участник города')}</div><h3>${esc(x.title)}</h3><div class="similar-price">${x.price==null?'Цена по запросу':money(x.price)}</div></div></a>`).join('');$('similarBlock').hidden=false}
async function load(){updateCart();await auth();if(!id){$('app').innerHTML='<div class="error"><h1>Предложение не указано</h1><p>Вернитесь в каталог и выберите товар или услугу.</p><a class="btn" href="/catalog/">Открыть каталог</a></div>';$('mobileBar').style.display='none';return}const{data,error}=await s.rpc('marketplace_public_product',{p_product_id:id});if(error||!data?.length){$('app').innerHTML=`<div class="error"><h1>Предложение недоступно</h1><p>${esc(error?.message||'Возможно, товар снят с публикации или продавец временно отключил профиль.')}</p><a class="btn" href="/catalog/">Вернуться в каталог</a></div>`;$('mobileBar').style.display='none';return}item=data[0];render()}
load();
</script>
