<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сообщения — ЦУИМ</title><link rel="icon" href="images/logo_cuim.png"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8fc;color:#0f172a}.top{background:#fff;border-bottom:1px solid #e2e8f0}.topin,.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.topin{min-height:80px;display:flex;align-items:center;justify-content:space-between}.logo{width:230px;max-height:64px;object-fit:contain}.btn{border:0;border-radius:11px;padding:11px 14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.wrap{padding:28px 0}.grid{display:grid;grid-template-columns:310px 1fr;gap:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden}.dialog{padding:14px;border-bottom:1px solid #eef2f7;cursor:pointer}.dialog.active,.dialog:hover{background:#eff6ff}.head{padding:16px;border-bottom:1px solid #eef2f7}.messages{height:52vh;overflow:auto;padding:18px;background:#f8fafc}.msg{max-width:76%;background:#fff;border:1px solid #e2e8f0;padding:10px 13px;border-radius:14px;margin:7px 0}.msg.mine{margin-left:auto;background:#dbeafe}.msg small{display:block;color:#64748b;margin-top:5px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px}.composer textarea{min-height:68px;padding:11px;border:1px solid #cbd5e1;border-radius:11px}.muted{color:#64748b;font-size:13px}.empty{padding:30px;text-align:center;color:#94a3b8}@media(max-width:720px){.grid{grid-template-columns:1fr}.card:first-child{max-height:240px;overflow:auto}}</style></head><body><header class="top"><div class="topin"><a href="./"><img class="logo" src="images/logo_cuim.png"></a><a class="btn" href="./account.html">Личный кабинет</a></div></header><main class="wrap"><h1>Сообщения</h1><p class="muted">Общайтесь с исполнителями прямо по заказам ЦУИМ.</p><div class="grid"><section class="card" id="dialogs"><div class="empty">Загрузка…</div></section><section class="card"><div class="head"><b id="title">Выберите заказ</b><div class="muted" id="sub"></div></div><div class="messages" id="messages"><div class="empty">Переписка появится здесь</div></div><div class="composer"><textarea id="text" placeholder="Сообщение исполнителю…"></textarea><button class="btn" id="send">Отправить</button></div></section></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));let current=null,rows=[];const{data:{session}}=await s.auth.getSession();if(!session)location.href='./login.html?next=messages.html';async function loadDialogs(){const{data:orders,error}=await s.from('marketplace_orders').select('id,created_at,partners(name)').order('created_at',{ascending:false});if(error){$('dialogs').textContent=error.message;return}rows=orders||[];$('dialogs').innerHTML=rows.map(o=>`<div class="dialog" data-order="${o.id}"><b>${esc(o.partners?.name||'Исполнитель')}</b><div class="muted">Заказ ${o.id.slice(0,8)}</div></div>`).join('')||'<div class="empty">Заказов пока нет</div>';document.querySelectorAll('[data-order]').forEach(x=>x.onclick=()=>openOrder(x.dataset.order))}async function openOrder(order){const{data:id,error}=await s.rpc('marketplace_open_conversation',{p_order_id:order});if(error){alert(error.message);return}current=id;const o=rows.find(x=>x.id===order);$('title').textContent=o?.partners?.name||'Исполнитель';$('sub').textContent='Заказ '+order.slice(0,8);document.querySelectorAll('.dialog').forEach(x=>x.classList.toggle('active',x.dataset.order===order));await loadMessages()}async function loadMessages(){if(!current)return;const{data,error}=await s.from('marketplace_messages').select('*').eq('conversation_id',current).order('created_at');if(error){$('messages').textContent=error.message;return}$('messages').innerHTML=(data||[]).map(m=>`<div class="msg ${m.sender_type==='CUSTOMER'?'mine':''}"><b>${m.sender_type==='CUSTOMER'?'Вы':m.sender_type==='AI'?'Помощник':'Исполнитель'}</b><div>${esc(m.body)}</div><small>${new Date(m.created_at).toLocaleString('ru-RU')}</small></div>`).join('')||'<div class="empty">Начните диалог с исполнителем</div>';$('messages').scrollTop=$('messages').scrollHeight}$('send').onclick=async()=>{const body=$('text').value.trim();if(!current||!body)return;$('send').disabled=true;const{error}=await s.rpc('marketplace_send_message',{p_conversation_id:current,p_body:body});$('send').disabled=false;if(error){alert(error.message);return}$('text').value='';await loadMessages()};$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}};await loadDialogs();</script></body></html>
