<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>Сообщения — ЦУИМ</title><link rel="icon" href="/images/logo_cuim.png"><style>:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#172554;--accent:#4f46e5}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f8fc;color:var(--ink)}button,textarea{font:inherit}.top{background:#fff;border-bottom:1px solid var(--line);height:74px}.topin,.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.topin{height:100%;display:flex;align-items:center;gap:10px}.logo{width:195px;height:54px;object-fit:contain}.top-actions{margin-left:auto;display:flex;gap:7px}.btn{border:0;border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:900;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn.light{background:#fff;color:#334155;border:1px solid #cbd5e1}.wrap{padding:18px 0 14px}.titlebar{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:12px}.titlebar h1{margin:0;font-size:30px}.titlebar p{margin:4px 0 0;color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:350px 1fr;gap:14px;height:calc(100vh - 170px);min-height:500px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;min-height:0;box-shadow:0 8px 28px #0f172a06}.dialogs-card{display:flex;flex-direction:column}.dialogs-head{padding:13px;border-bottom:1px solid #eef2f7;display:flex;align-items:center;justify-content:space-between}.dialogs-head b{font-size:12px}.dialogs{overflow:auto;min-height:0}.dialog{padding:13px 14px;border-bottom:1px solid #eef2f7;cursor:pointer;transition:.12s}.dialog.active,.dialog:hover{background:#eef2ff}.dialog-top{display:flex;justify-content:space-between;gap:10px}.dialog b{font-size:12px}.dialog-time{font-size:8px;color:#94a3b8;white-space:nowrap}.dialog-sub{font-size:10px;color:#475569;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{font-size:8px;font-weight:900;margin-top:5px;color:#64748b}.chatcard{display:flex;flex-direction:column}.head{padding:13px 16px;border-bottom:1px solid #eef2f7;flex:0 0 auto}.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.head b{font-size:14px}.muted{color:#64748b;font-size:10px}.productref{display:flex;gap:10px;align-items:center;margin-top:9px;border:1px solid #edf0f5;border-radius:13px;padding:8px;text-decoration:none;color:inherit;background:#fafbfc}.productref:hover{background:#f8fafc}.productref img{width:48px;height:48px;object-fit:cover;border-radius:10px;background:#eef2f7}.productref .go{margin-left:auto;color:#4f46e5;font-size:9px;font-weight:900}.messages{flex:1 1 auto;min-height:0;overflow:auto;padding:18px;background:linear-gradient(180deg,#f8fafc,#f5f7fb)}.msg{max-width:76%;background:#fff;border:1px solid #e2e8f0;padding:10px 13px;border-radius:15px 15px 15px 5px;margin:7px 0;box-shadow:0 3px 12px #0f172a04}.msg.mine{margin-left:auto;background:#dbeafe;border-color:#bfdbfe;border-radius:15px 15px 5px 15px}.msg b{font-size:9px;color:#475569}.msg-body{font-size:12px;line-height:1.5;margin-top:3px;white-space:pre-wrap}.msg small{display:block;color:#94a3b8;margin-top:5px;font-size:8px}.quick{padding:9px 14px 0;background:#fff;border-top:1px solid #eef2f7;display:flex;gap:6px;overflow:auto;scrollbar-width:none}.quick button{white-space:nowrap;border:1px solid #dbe2ea;background:#fff;color:#475569;border-radius:999px;padding:8px 10px;font-size:9px;font-weight:850;cursor:pointer}.quick button:hover{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 14px 13px;background:#fff}.composer textarea{min-height:56px;max-height:120px;padding:11px;border:1px solid #cbd5e1;border-radius:12px;resize:vertical;outline:none}.composer textarea:focus{border-color:#818cf8;box-shadow:0 0 0 3px #eef2ff}.composer .btn{align-self:stretch;min-width:112px}.empty{padding:32px;text-align:center;color:#94a3b8;font-size:11px}.empty b{display:block;color:#334155;font-size:15px;margin-bottom:4px}.connection{font-size:8px;color:#94a3b8}.connection.online{color:#059669}@media(max-width:760px){.top{height:66px}.logo{width:165px}.top-actions .hide{display:none}.wrap{padding:12px 0;width:min(100% - 18px,1120px)}.titlebar h1{font-size:25px}.grid{grid-template-columns:1fr;height:auto;min-height:0}.dialogs-card{max-height:220px}.chatcard{height:calc(100vh - 330px);min-height:440px}.messages{padding:12px}.composer{grid-template-columns:1fr}.composer .btn{min-height:44px}.msg{max-width:88%}.productref .go{display:none}}</style><script src="/maintenance-guard.js"></script>
</head><body><header class="top"><div class="topin"><a href="/"><img class="logo" src="/images/logo_cuim.png" alt="ЦУИМ"></a><div class="top-actions"><a class="btn light hide" href="/notifications.html">🔔 Уведомления</a><a class="btn" href="/account.html">Личный кабинет</a></div></div></header><main class="wrap"><div class="titlebar"><div><h1>Сообщения</h1><p>Общайтесь по товарам, услугам и объявлениям. Продавцы видят свои клиентские диалоги здесь же.</p></div><span id="connection" class="connection">Подключение…</span></div><div class="grid"><section class="card dialogs-card"><div class="dialogs-head"><b>Диалоги</b><button class="btn light" id="refresh" style="padding:7px 9px;font-size:9px">↻</button></div><div class="dialogs" id="dialogs"><div class="empty">Загрузка…</div></div></section><section class="card chatcard"><div class="head"><div class="headrow"><div><b id="title">Выберите диалог</b><div class="muted" id="sub"></div></div><a id="sellerLink" class="btn light" style="padding:7px 9px;font-size:9px;display:none">Профиль</a></div><div id="productRef"></div></div><div class="messages" id="messages"><div class="empty"><b>Выберите диалог</b>История переписки появится здесь.</div></div><div class="quick" id="quick"></div><div class="composer"><textarea id="text" placeholder="Напишите сообщение…"></textarea><button class="btn" id="send">Отправить</button></div></section></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let current=null,rows=[],session=null,partnerId=null,msgChannel=null,dialogsChannel=null;function isPartner(c){return !!partnerId&&c.partner_id===partnerId}function mine(c,m){return isPartner(c)?m.sender_type==='PARTNER':m.sender_type==='CUSTOMER'}function quickTexts(c){return isPartner(c)?['Здравствуйте! Да, предложение актуально.','Когда вам будет удобно?','Можно посмотреть/забрать по договорённости.','Сейчас уточню и отвечу.']:['Здравствуйте! Актуально?','Можно немного дешевле?','Где можно посмотреть?','Когда можно забрать?']}function itemUrl(c){if(!c.product_id)return null;return c.partner_products?.marketplace_offer_type==='AD'?`/ad/?id=${c.product_id}`:`/offer.html?id=${c.product_id}`}async function init(){session=(await s.auth.getSession()).data.session;if(!session){location.href='/login.html?next='+encodeURIComponent('/messages.html'+location.search);return}const p=await s.rpc('current_partner_id');partnerId=p.error?null:p.data;await loadDialogs();installDialogRealtime();const requested=new URLSearchParams(location.search).get('conversation');if(requested&&rows.some(x=>x.id===requested))await openChat(requested);else if(rows.length)await openChat(rows[0].id)}async function loadDialogs(){const{data,error}=await s.from('marketplace_conversations').select('id,order_id,product_id,partner_id,customer_user_id,subject,last_message_at,partners(name),partner_products(title,image_url,marketplace_offer_type)').order('last_message_at',{ascending:false});if(error){$('dialogs').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=data||[];$('dialogs').innerHTML=rows.length?rows.map(c=>`<div class="dialog ${current===c.id?'active':''}" data-id="${c.id}"><div class="dialog-top"><b>${esc(isPartner(c)?'Покупатель':(c.partners?.name||'Продавец'))}</b><span class="dialog-time">${new Date(c.last_message_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div><div class="dialog-sub">${esc(c.product_id?(c.partner_products?.title||c.subject||'Обсуждение предложения'):'Заказ '+String(c.order_id||'').slice(0,8))}</div><div class="role">${isPartner(c)?'Вы отвечаете как продавец':'Вы пишете как покупатель'}</div></div>`).join(''):'<div class="empty"><b>Диалогов пока нет</b>Нажмите «Написать» в карточке товара, услуги или объявления.</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openChat(x.dataset.id))}async function openChat(id){current=id;const c=rows.find(x=>x.id===id);if(!c)return;await loadDialogs();$('title').textContent=isPartner(c)?'Покупатель':(c.partners?.name||'Продавец');$('sub').textContent=c.product_id?(isPartner(c)?'Вопрос клиента по предложению':'Обсуждение предложения'):'Заказ '+String(c.order_id||'').slice(0,8);$('sellerLink').style.display=isPartner(c)?'none':'inline-flex';if(!isPartner(c)){$('sellerLink').href='/seller.html?id='+encodeURIComponent(c.partner_id)}const url=itemUrl(c);$('productRef').innerHTML=c.product_id?`<a class="productref" href="${esc(url||'#')}">${c.partner_products?.image_url?`<img src="${esc(c.partner_products.image_url)}" alt="">`:'<span style="width:48px;height:48px;border-radius:10px;background:#eef2f7;display:grid;place-items:center">▣</span>'}<div><b>${esc(c.partner_products?.title||c.subject||'Предложение')}</b><div class="muted">${isPartner(c)?'Клиент пишет по этому предложению':'Открыть карточку предложения'}</div></div><span class="go">Открыть →</span></a>`:'';$('quick').innerHTML=quickTexts(c).map(t=>`<button data-quick="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{$('text').value=b.dataset.quick;$('text').focus()});await loadMessages();installMessageRealtime(id)}async function loadMessages(){if(!current)return;const c=rows.find(x=>x.id===current);const{data,error}=await s.from('marketplace_messages').select('id,sender_type,sender_user_id,body,created_at').eq('conversation_id',current).eq('is_ai_draft',false).order('created_at');if(error){$('messages').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}$('messages').innerHTML=(data||[]).length?(data||[]).map(m=>`<div class="msg ${mine(c,m)?'mine':''}"><b>${mine(c,m)?'Вы':m.sender_type==='AI'?'Помощник':isPartner(c)?'Покупатель':'Продавец'}</b><div class="msg-body">${esc(m.body)}</div><small>${new Date(m.created_at).toLocaleString('ru-RU')}</small></div>`).join(''):'<div class="empty"><b>Начните диалог</b>Можно использовать быстрый вопрос ниже.</div>';$('messages').scrollTop=$('messages').scrollHeight}async function send(){const body=$('text').value.trim();if(!current||!body)return;$('send').disabled=true;const{error}=await s.rpc('marketplace_send_message',{p_conversation_id:current,p_body:body});$('send').disabled=false;if(error){alert(error.message);return}$('text').value='';s.functions.invoke('partner-push-notify',{body:{conversation_id:current,body}}).catch(()=>{});await loadMessages();await loadDialogs()}function installMessageRealtime(id){if(msgChannel)s.removeChannel(msgChannel);msgChannel=s.channel('chat-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'marketplace_messages',filter:`conversation_id=eq.${id}`},()=>{loadMessages();loadDialogs()}).subscribe(st=>$('connection').className='connection '+(st==='SUBSCRIBED'?'online':''))}function installDialogRealtime(){dialogsChannel=s.channel('conversation-list-'+session.user.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'marketplace_conversations'},()=>loadDialogs()).subscribe(st=>{if(st==='SUBSCRIBED'){$('connection').textContent='● Онлайн';$('connection').classList.add('online')}})}$('send').onclick=send;$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('refresh').onclick=()=>{loadDialogs();if(current)loadMessages()};init();</script></body></html>
