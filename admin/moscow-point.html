<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЦУИМ — Московская точка</title><link rel="stylesheet" href="./admin.css"></head><body><main class="main" style="margin-left:0"><header class="topbar"><div class="top-title"><b>Московская точка продавца</b><span>география и профиль для запуска</span></div><div class="top-actions"><a class="btn light small" href="./launch.html">← Контроль запуска</a></div></header><div class="content"><div class="card"><div class="card-head"><div><h2>Данные точки</h2><div class="hint">Система сама определит Москву, район и ближайшее метро по координатам.</div></div></div><form id="form" class="formcard"><div class="field"><label>Продавец</label><select id="partner" required></select></div><div class="field"><label>Описание *</label><textarea id="description" rows="4" required></textarea></div><div class="field"><label>Фото / логотип (HTTPS URL) *</label><input id="photo" type="url" required placeholder="https://..."></div><div class="field"><label>Обложка (HTTPS URL)</label><input id="cover" type="url" placeholder="https://..."></div><div class="field"><label>Фактический адрес в Москве *</label><input id="address" required placeholder="Москва, ..."></div><div class="formgrid"><div class="field"><label>Широта *</label><input id="lat" type="number" step="any" required placeholder="55.7558"></div><div class="field"><label>Долгота *</label><input id="lng" type="number" step="any" required placeholder="37.6176"></div></div><div class="formgrid"><div class="field"><label>Режим обслуживания</label><select id="mode"><option value="LOCAL">На месте</option><option value="DELIVERY">Доставка</option><option value="BOTH">На месте + доставка</option><option value="REMOTE">Удалённо</option></select></div><div class="field"><label>Радиус, м</label><input id="radius" type="number" min="0" max="100000" value="5000"></div></div><button class="btn">Сохранить и проверить Москву</button><div id="msg" class="status-msg"></div></form></div></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'),$=id=>document.getElementById(id);async function init(){const{data:{session}}=await s.auth.getSession();if(!session){location.href='./index.html#partners';return}const{data:ok}=await s.rpc('marketplace_admin_guard');if(!ok){location.href='./index.html';return}const{data,error}=await s.rpc('marketplace_admin_partners');if(error){$('msg').textContent=error.message;return}$('partner').innerHTML=(data||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Проверяем географию и сохраняем…';const{data,error}=await s.rpc('marketplace_admin_update_partner_marketplace_profile',{p_partner_id:$('partner').value,p_description:$('description').value.trim(),p_photo_url:$('photo').value.trim(),p_cover_url:$('cover').value.trim()||null,p_address:$('address').value.trim(),p_latitude:Number($('lat').value),p_longitude:Number($('lng').value),p_service_mode:$('mode').value,p_service_radius_m:Number($('radius').value)});if(error){$('msg').textContent=error.message;return}const district=data?.district?.name||data?.district_name||'определён';const metro=data?.metro?.name||data?.metro_name||'определено';$('msg').textContent=`Сохранено. Район: ${district}. Ближайшее метро: ${metro}.`;setTimeout(()=>location.href='./launch.html',1200)};init();</script></body></html>
