<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Иконки категорий — ЦУИМ Admin</title>
<link rel="icon" href="../images/logo_cuim.png">
<style>
:root{--bg:#f5f7fb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--violet:#7c3aed;--navy:#071633;--ok:#047857;--err:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.topin,.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.topin{min-height:76px;display:flex;align-items:center;gap:14px}.logo{width:190px;height:52px;object-fit:contain}.top-actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:10px 14px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.light{background:#fff;color:#334155;border:1px solid #cbd5e1}.btn.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca}.wrap{padding:28px 0 60px}.hero{background:linear-gradient(135deg,#071633,#172554 60%,#312e81);color:#fff;border-radius:24px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0;color:#cbd5e1;line-height:1.5}.hint{font-size:12px;color:var(--muted)}.status{margin:10px 0 0;font-size:12px}.ok{color:var(--ok)}.err{color:var(--err)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 24px #0f172a08}.head{display:flex;gap:14px;align-items:center}.icon{width:84px;height:84px;border-radius:20px;flex:0 0 84px;display:grid;place-items:center;background:linear-gradient(135deg,#eff6ff,#f5f3ff);border:1px solid #dbeafe;font-size:34px;overflow:hidden}.icon img{width:100%;height:100%;object-fit:cover;display:block}.head h2{margin:0 0 4px;font-size:18px}.key{font-size:11px;color:#94a3b8;font-weight:800}.upload{margin-top:16px;border:2px dashed #cbd5e1;border-radius:14px;padding:16px;text-align:center;background:#f8fafc;cursor:pointer;display:block}.upload:hover{border-color:#818cf8;background:#faf5ff}.upload input{display:none}.upload b{display:block;margin-bottom:3px}.urlrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.urlrow input{min-width:0;border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.filemeta{min-height:18px;margin-top:7px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}.loginbox img{width:190px;display:block;margin:0 auto 18px}.field{display:grid;gap:6px;margin-bottom:10px}.field label{font-size:12px;font-weight:850}.field input{border:1px solid #cbd5e1;border-radius:10px;padding:11px}.loading{padding:38px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:18px;color:#64748b}@media(max-width:760px){.grid{grid-template-columns:1fr}.top-actions .hide-mobile{display:none}.icon{width:72px;height:72px;flex-basis:72px}.urlrow{grid-template-columns:1fr}.urlrow .btn{width:100%}}
</style>
</head>
<body>
<div id="login" class="login">
<form id="loginForm" class="loginbox"><img src="../images/logo_cuim.png" alt="ЦУИМ"><h2>Иконки категорий</h2><p class="hint">Доступ только администраторам.</p><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Пароль</label><input id="password" type="password" required></div><button class="btn" style="width:100%">Войти</button><div id="loginErr" class="status err"></div></form>
</div>
<div id="app" style="display:none">
<header class="top"><div class="topin"><a href="./"><img class="logo" src="../images/logo_cuim.png" alt="ЦУИМ"></a><div class="top-actions"><a class="btn light hide-mobile" href="./">← Админка</a><a class="btn light" href="../" target="_blank">Открыть сайт ↗</a><button class="btn" id="logout">Выйти</button></div></div></header>
<main class="wrap"><section class="hero"><h1>Иконки городских категорий</h1><p>Загружай новую картинку — она сохраняется в Storage и после сохранения автоматически появляется на главной странице ЦУИМ.</p></section><div id="globalMsg" class="status"></div><div id="categoryGrid" class="grid"><div class="loading">Загрузка категорий…</div></div></main>
</div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu');
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let rows=[];
async function guard(){const{data:{session}}=await s.auth.getSession();if(!session)return false;const{data,error}=await s.rpc('marketplace_admin_guard');if(error||!data)return false;$('login').style.display='none';$('app').style.display='block';await load();return true}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginErr').textContent='';const{error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('loginErr').textContent=error.message;if(!await guard()){$('loginErr').textContent='Нет прав администратора';await s.auth.signOut()}};
$('logout').onclick=async()=>{await s.auth.signOut();location.reload()};
function iconHtml(x){return x.icon_url?`<img src="${esc(x.icon_url)}" alt="${esc(x.title)}">`:esc(x.icon_fallback||'•')}
function render(){const root=$('categoryGrid');root.innerHTML=rows.map(x=>`<article class="card" data-card="${esc(x.section_key)}"><div class="head"><div class="icon" data-preview="${esc(x.section_key)}">${iconHtml(x)}</div><div><h2>${esc(x.title)}</h2><div class="hint">${esc(x.subtitle||'')}</div><div class="key">${esc(x.section_key)}</div></div></div><label class="upload"> <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" data-file="${esc(x.section_key)}"><b>⬆ Выбрать новую иконку</b><span class="hint">PNG, JPG, WebP или GIF · до 4 МБ</span></label><div class="filemeta hint" data-meta="${esc(x.section_key)}"></div><div class="urlrow"><input data-url="${esc(x.section_key)}" value="${esc(x.icon_url||'')}" placeholder="URL изображения"><button class="btn" data-save="${esc(x.section_key)}">Сохранить</button></div><div class="actions"><button class="btn light" data-preview-url="${esc(x.section_key)}">Показать URL</button><button class="btn danger" data-reset="${esc(x.section_key)}">Вернуть стандартную</button></div><div class="status" data-msg="${esc(x.section_key)}"></div></article>`).join('');
document.querySelectorAll('[data-file]').forEach(inp=>inp.onchange=()=>upload(inp.dataset.file,inp.files?.[0]));
document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));
document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>resetIcon(b.dataset.reset));
document.querySelectorAll('[data-preview-url]').forEach(b=>b.onclick=()=>previewFromUrl(b.dataset.previewUrl));}
async function load(){const{data,error}=await s.from('marketplace_city_sections').select('section_key,title,subtitle,icon_url,icon_fallback,sort_order,active').order('sort_order');if(error){$('categoryGrid').innerHTML=`<div class="loading err">${esc(error.message)}</div>`;return}rows=data||[];render()}
function ext(file){const n=String(file.name||'').toLowerCase();if(n.endsWith('.png'))return'png';if(n.endsWith('.webp'))return'webp';if(n.endsWith('.gif'))return'gif';return'jpg'}
async function upload(key,file){if(!file)return;const msg=document.querySelector(`[data-msg="${CSS.escape(key)}"]`),meta=document.querySelector(`[data-meta="${CSS.escape(key)}"]`);msg.textContent='';msg.className='status';if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){msg.textContent='Нужен файл изображения.';msg.className='status err';return}if(file.size>4*1024*1024){msg.textContent='Файл больше 4 МБ.';msg.className='status err';return}meta.textContent=`${file.name} · ${(file.size/1024/1024).toFixed(2)} МБ · загружаю…`;const path=`category-icons/${key}-${Date.now()}.${ext(file)}`;const{error}=await s.storage.from('marketplace-banners').upload(path,file,{cacheControl:'31536000',contentType:file.type,upsert:false});if(error){msg.textContent='Ошибка загрузки: '+error.message;msg.className='status err';return}const{data:urlData}=s.storage.from('marketplace-banners').getPublicUrl(path);const url=urlData?.publicUrl||'';document.querySelector(`[data-url="${CSS.escape(key)}"]`).value=url;const p=document.querySelector(`[data-preview="${CSS.escape(key)}"]`);p.innerHTML=`<img src="${esc(url)}" alt="">`;meta.textContent=`${file.name} · загружено. Нажми «Сохранить».`;msg.textContent='Изображение загружено, осталось сохранить категорию.';msg.className='status ok'}
async function save(key){const input=document.querySelector(`[data-url="${CSS.escape(key)}"]`),msg=document.querySelector(`[data-msg="${CSS.escape(key)}"]`),url=input.value.trim()||null;msg.textContent='Сохраняю…';msg.className='status';const{data,error}=await s.from('marketplace_city_sections').update({icon_url:url,updated_at:new Date().toISOString()}).eq('section_key',key).select('section_key,icon_url').single();if(error){msg.textContent='Ошибка: '+error.message;msg.className='status err';return}const row=rows.find(x=>x.section_key===key);if(row)row.icon_url=data.icon_url;msg.textContent='Готово. Иконка сохранена и будет показана на главной.';msg.className='status ok'}
async function resetIcon(key){const msg=document.querySelector(`[data-msg="${CSS.escape(key)}"]`);if(!confirm('Вернуть стандартную иконку этой категории?'))return;const{error}=await s.from('marketplace_city_sections').update({icon_url:null,updated_at:new Date().toISOString()}).eq('section_key',key);if(error){msg.textContent='Ошибка: '+error.message;msg.className='status err';return}const row=rows.find(x=>x.section_key===key);if(row)row.icon_url=null;document.querySelector(`[data-url="${CSS.escape(key)}"]`).value='';document.querySelector(`[data-preview="${CSS.escape(key)}"]`).innerHTML=esc(row?.icon_fallback||'•');msg.textContent='Стандартная иконка восстановлена.';msg.className='status ok'}
function previewFromUrl(key){const url=document.querySelector(`[data-url="${CSS.escape(key)}"]`).value.trim(),p=document.querySelector(`[data-preview="${CSS.escape(key)}"]`),row=rows.find(x=>x.section_key===key);p.innerHTML=url?`<img src="${esc(url)}" alt="">`:esc(row?.icon_fallback||'•')}
await guard();
</script>
</body></html>
