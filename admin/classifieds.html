<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Модерация объявлений — ЦУИМ</title><link rel="icon" href="/images/logo_cuim.png"><style>
:root{--bg:#f5f7fb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--nav:#071633;--green:#059669;--red:#dc2626;--orange:#f97316}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.topin,.wrap{width:min(1320px,calc(100% - 28px));margin:auto}.topin{height:100%;display:flex;align-items:center;gap:10px}.logo{width:190px;height:52px;object-fit:contain}.actions{margin-left:auto;display:flex;gap:7px}.btn{border:0;border-radius:11px;padding:9px 12px;background:var(--nav);color:#fff;text-decoration:none;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}.btn.light{background:#fff;color:#334155;border:1px solid #cbd5e1}.btn.green{background:#059669}.btn.red{background:#dc2626}.btn.orange{background:#ea580c}.btn.small{padding:7px 9px;font-size:9px}.wrap{padding:22px 0 60px}.hero{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0 0;color:var(--muted);font-size:11px}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{border-radius:14px;padding:10px 13px;background:#f8fafc;border:1px solid #e2e8f0;min-width:105px}.stat span{font-size:8px;color:var(--muted);font-weight:900;text-transform:uppercase}.stat b{display:block;font-size:20px;margin-top:2px}.toolbar{display:grid;grid-template-columns:1fr 190px 190px auto;gap:8px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:9px;margin:12px 0}.toolbar input,.toolbar select{border:1px solid #cbd5e1;border-radius:10px;padding:9px;background:#fff}.list{display:grid;gap:9px}.row{background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px;display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:13px;align-items:center}.photo{height:92px;border-radius:12px;overflow:hidden;background:#eef2f7;display:grid;place-items:center;color:#94a3b8;font-size:24px}.photo img{width:100%;height:100%;object-fit:cover}.copy{min-width:0}.copy h3{margin:0;font-size:14px}.meta{font-size:9px;color:var(--muted);line-height:1.65;margin-top:5px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{padding:5px 7px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:8px;font-weight:900}.chip.pending{background:#fffbeb;color:#b45309}.chip.approved{background:#ecfdf5;color:#047857}.chip.rejected{background:#fef2f2;color:#b91c1c}.chip.report{background:#fff1f2;color:#be123c}.row-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:350px}.empty{padding:50px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:18px;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:21px;padding:24px}.loginbox img{display:block;width:190px;margin:0 auto 17px}.field{display:grid;gap:5px;margin-top:11px}.field label{font-size:9px;font-weight:900;color:#475569}.field input{border:1px solid #cbd5e1;border-radius:10px;padding:10px}.msg{font-size:10px;color:#dc2626;margin-top:7px}.modal{position:fixed;inset:0;background:#0f172a99;z-index:80;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalbox{width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;padding:19px}.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.modalhead h2{margin:0;font-size:18px}.close{border:0;background:#f1f5f9;border-radius:50%;width:35px;height:35px;cursor:pointer}.reports{display:grid;gap:7px;margin-top:12px}.report{border:1px solid #e2e8f0;border-radius:12px;padding:10px}.report b{font-size:10px}.report p{font-size:10px;color:#475569;margin:5px 0}.report small{font-size:8px;color:#94a3b8}.preview-gallery{display:flex;gap:7px;overflow:auto;margin-top:12px}.preview-gallery img{width:150px;height:115px;object-fit:cover;border-radius:12px;background:#eef2f7}.preview-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.preview-info div{background:#f8fafc;border:1px solid #eef2f7;border-radius:11px;padding:9px}.preview-info small{display:block;color:#64748b;font-size:8px}.preview-info b{display:block;font-size:11px;margin-top:3px}.preview-desc{margin-top:12px;white-space:pre-wrap;font-size:11px;line-height:1.6;color:#334155;border-top:1px solid #eef2f7;padding-top:12px}@media(max-width:850px){.hero{display:block}.stats{margin-top:12px}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.row{grid-template-columns:100px 1fr}.row-actions{grid-column:1/-1;justify-content:flex-start;max-width:none}}@media(max-width:560px){.actions .hide-mobile{display:none}.logo{width:160px}.wrap{width:min(100% - 20px,1320px)}.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.row{grid-template-columns:80px 1fr}.photo{height:75px}.row-actions .btn{flex:1}.preview-info{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><form id="loginForm" class="loginbox"><img src="/images/logo_cuim.png" alt="ЦУИМ"><h1 style="font-size:22px;margin:0">Модерация объявлений</h1><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Пароль</label><input id="password" type="password" required></div><button class="btn" style="width:100%;margin-top:12px">Войти</button><div id="loginMsg" class="msg"></div></form></div>
<div id="app" class="hidden"><header class="top"><div class="topin"><a href="/"><img class="logo" src="/images/logo_cuim.png" alt="ЦУИМ"></a><div class="actions"><a class="btn light hide-mobile" href="/admin/advertising.html">Реклама</a><a class="btn light hide-mobile" href="/manage/">Админка</a><button class="btn light" id="logout">Выйти</button></div></div></header><main class="wrap"><section class="hero"><div><h1>Модерация объявлений</h1><p>Новые публикации, повторная проверка после редактирования и пользовательские жалобы.</p></div><div class="stats"><div class="stat"><span>Всего</span><b id="stAll">—</b></div><div class="stat"><span>Ожидают</span><b id="stPending">—</b></div><div class="stat"><span>Новые жалобы</span><b id="stReports">—</b></div></div></section><section class="toolbar"><input id="q" placeholder="Поиск по объявлению или продавцу"><select id="moderation"><option value="ALL">Любая модерация</option><option value="PENDING">На модерации</option><option value="APPROVED">Одобрено</option><option value="REJECTED">Отклонено</option></select><select id="issues"><option value="ALL">Все объявления</option><option value="REPORTS">Только с жалобами</option></select><button id="refresh" class="btn light">Обновить</button></section><div id="list" class="list"><div class="empty">Загрузка…</div></div></main></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Просмотр</h2><button class="close" id="close">×</button></div><div id="modalContent" class="reports"></div></div></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]),),money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));let rows=[];
async function guard(){const{data:{session}}=await s.auth.getSession();if(!session)return false;const{data,error}=await s.rpc('marketplace_admin_guard');if(error||!data){$('loginMsg').textContent='Нужны права администратора.';return false}$('login').classList.add('hidden');$('app').classList.remove('hidden');await load();return true}
$('loginForm').onsubmit=async e=>{e.preventDefault();const{error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('loginMsg').textContent=error.message;if(!await guard())await s.auth.signOut()};$('logout').onclick=async()=>{await s.auth.signOut();location.reload()};const reason={FRAUD:'Мошенничество',PROHIBITED:'Запрещённый товар / услуга',DUPLICATE:'Дубликат',WRONG_INFO:'Неверная информация',SOLD:'Уже продано',OTHER:'Другое'};
function card(x){return`<article class="row"><div class="photo">${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.title)}" loading="lazy">`:'📷'}</div><div class="copy"><h3>${esc(x.title)}</h3><div class="meta">${esc(x.partner_name||'Продавец')} · ${esc(x.subcategory_title||'Без категории')} · ${Number(x.view_count||0)} просмотров</div><div class="chips"><span class="chip ${String(x.moderation_status).toLowerCase()}">${x.moderation_status==='PENDING'?'На модерации':x.moderation_status==='APPROVED'?'Одобрено':'Отклонено'}</span><span class="chip">${esc(x.listing_status)}</span>${Number(x.new_report_count||0)?`<span class="chip report">⚑ ${Number(x.new_report_count)} новых жалоб</span>`:''}</div>${x.moderation_note?`<div class="meta">Комментарий: ${esc(x.moderation_note)}</div>`:''}</div><div class="row-actions"><button class="btn light small" data-preview="${x.id}">Просмотр</button>${x.moderation_status==='APPROVED'?`<a class="btn light small" href="/ad/?id=${encodeURIComponent(x.id)}" target="_blank">Публичная страница</a>`:''}${Number(x.report_count||0)?`<button class="btn light small" data-reports="${x.id}" data-title="${esc(x.title)}">Жалобы (${Number(x.report_count)})</button>`:''}<button class="btn green small" data-action="APPROVE" data-id="${x.id}">Одобрить</button><button class="btn red small" data-action="REJECT" data-id="${x.id}">Отклонить</button><button class="btn orange small" data-action="HIDE" data-id="${x.id}">Снять</button></div></article>`}
function render(){const q=$('q').value.trim().toLowerCase(),m=$('moderation').value,iss=$('issues').value;let a=rows.filter(x=>!q||[x.title,x.partner_name,x.subcategory_title].filter(Boolean).join(' ').toLowerCase().includes(q));if(m!=='ALL')a=a.filter(x=>x.moderation_status===m);if(iss==='REPORTS')a=a.filter(x=>Number(x.report_count||0)>0);$('list').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Ничего не найдено.</div>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>review(b.dataset.id,b.dataset.action));document.querySelectorAll('[data-reports]').forEach(b=>b.onclick=()=>openReports(b.dataset.reports,b.dataset.title));document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>openPreview(b.dataset.preview))}
async function review(id,action){let note='';if(action==='REJECT'||action==='HIDE'){note=prompt(action==='REJECT'?'Причина отклонения объявления:':'Причина снятия объявления:')||'';if(!note.trim())return}if(!confirm(action==='APPROVE'?'Одобрить объявление и разрешить показ?':action==='REJECT'?'Отклонить объявление?':'Снять объявление с публикации?'))return;const{error}=await s.rpc('marketplace_admin_review_classified',{p_product_id:id,p_action:action,p_note:note||null});if(error)return alert(error.message);await load()}
function showModal(title,html){$('modalTitle').textContent=title;$('modalContent').innerHTML=html;$('modal').classList.add('open')}
async function openReports(id,title){showModal(`Жалобы · ${title}`,'Загрузка…');const{data,error}=await s.rpc('marketplace_admin_classified_reports',{p_product_id:id});if(error){$('modalContent').textContent=error.message;return}$('modalContent').innerHTML=(data||[]).length?(data||[]).map(r=>`<div class="report"><b>${esc(reason[r.reason]||r.reason)} · ${esc(r.status)}</b>${r.comment?`<p>${esc(r.comment)}</p>`:''}<small>${new Date(r.created_at).toLocaleString('ru-RU')}</small></div>`).join(''):'Жалоб нет.'}
async function openPreview(id){showModal('Просмотр объявления','Загрузка…');const{data,error}=await s.rpc('marketplace_admin_classified_detail',{p_product_id:id});if(error||!data){$('modalContent').textContent=error?.message||'Не найдено';return}const d=data.marketplace_details||{},pics=Array.isArray(data.pictures)?data.pictures.filter(Boolean):[];$('modalTitle').textContent=data.title;$('modalContent').innerHTML=`${pics.length?`<div class="preview-gallery">${pics.map(u=>`<img src="${esc(u)}" alt="Фото">`).join('')}</div>`:'<div class="empty" style="padding:20px">Без фотографий</div>'}<div class="preview-info"><div><small>Продавец</small><b>${esc(data.partner_name||'—')}</b></div><div><small>Категория</small><b>${esc(data.subcategory_title||'—')}</b></div><div><small>Цена</small><b>${data.price==null?'По договорённости':money(data.price)}</b></div><div><small>Состояние</small><b>${esc(d.condition||'—')}${d.negotiable?' · Торг':''}${d.exchange?' · Обмен':''}</b></div><div><small>Статус</small><b>${esc(data.listing_status)} · ${esc(data.moderation_status)}</b></div><div><small>Статистика</small><b>${Number(data.view_count||0)} просмотров · ${Number(data.report_count||0)} жалоб</b></div></div><div class="preview-desc">${esc(data.description||'Описание не указано')}</div>`}
$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};async function load(){const{data,error}=await s.rpc('marketplace_admin_classified_queue',{p_limit:500});if(error){$('list').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=data||[];$('stAll').textContent=rows.length;$('stPending').textContent=rows.filter(x=>x.moderation_status==='PENDING').length;$('stReports').textContent=rows.reduce((n,x)=>n+Number(x.new_report_count||0),0);render()}$('q').oninput=render;$('moderation').onchange=render;$('issues').onchange=render;$('refresh').onclick=load;if(await guard()){};
</script></body></html>
