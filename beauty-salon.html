<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7fb"><title>Салон красоты — ЦУИМ</title><link rel="icon" href="/images/logo_cuim.png"><style>:root{--ink:#172033;--muted:#64748b;--line:#eadde6;--pink:#db2777;--purple:#7c3aed}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff,#fff8fc 420px,#f8fafc);color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.top{height:74px;background:#fff;border-bottom:1px solid #f0e4eb}.topin{height:100%;display:flex;align-items:center;gap:10px}.logo{width:190px;height:54px;object-fit:contain}.actions{margin-left:auto;display:flex;gap:7px}.btn{border:0;border-radius:12px;padding:10px 13px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:900;display:inline-flex;align-items:center;justify-content:center}.btn.light{background:#fff;color:#475569;border:1px solid #d6dae2}.main{padding:28px 0 70px}.hero{display:grid;grid-template-columns:100px 1fr;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 10px 32px #0f172a07}.avatar{width:100px;height:100px;border-radius:28px;background:linear-gradient(135deg,#fce7f3,#ede9fe);display:grid;place-items:center;font-size:34px;font-weight:950;color:#831843;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.hero h1{margin:0;font-size:31px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{padding:6px 8px;border-radius:999px;background:#f8fafc;font-size:9px;font-weight:850;color:#475569}.desc{font-size:12px;line-height:1.65;color:#475569;margin-top:13px;white-space:pre-wrap}.head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:25px 0 11px}.head h2{margin:0;font-size:23px}.masters{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.master{background:#fff;border:1px solid #e8e2e8;border-radius:20px;padding:15px;box-shadow:0 8px 28px #0f172a06;transition:.15s}.master:hover{transform:translateY(-2px)}.master-top{display:flex;gap:10px;align-items:center}.mavatar{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#fce7f3,#ede9fe);display:grid;place-items:center;font-weight:950;color:#831843;overflow:hidden}.mavatar img{width:100%;height:100%;object-fit:cover}.master h3{margin:0;font-size:15px}.spec{font-size:9px;color:#db2777;font-weight:900;margin-top:3px}.headline{font-size:10px;color:#64748b;line-height:1.5;min-height:31px;margin:11px 0}.facts{display:flex;gap:5px;flex-wrap:wrap}.fact{padding:5px 7px;border-radius:999px;background:#f8fafc;font-size:8px;font-weight:850;color:#475569}.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid #f0edf0}.price{font-size:12px;font-weight:950}.go{font-size:9px;font-weight:900;color:#7c3aed}.empty{padding:55px 20px;text-align:center;background:#fff;border:1px dashed #d8cbd4;border-radius:20px;color:#64748b}@media(max-width:850px){.masters{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top{height:66px}.logo{width:155px}.actions .hide{display:none}.main{padding-top:16px}.hero{grid-template-columns:1fr}.avatar{width:82px;height:82px}.hero h1{font-size:26px}.masters{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap topin"><a href="/"><img class="logo" src="/images/logo_cuim.png" alt="ЦУИМ"></a><div class="actions"><a class="btn light hide" href="/catalog/services/beauty/">← Красота и уход</a><a class="btn light" href="/beauty-bookings.html">Мои записи</a></div></div></header><main class="wrap main"><div id="loading" class="empty">Загружаем салон…</div><div id="page" class="hidden"><section class="hero"><div class="avatar" id="logoBox">С</div><div><h1 id="name"></h1><div class="meta" id="meta"></div><div class="desc" id="description"></div></div></section><div class="head"><div><h2>Команда мастеров</h2><div style="font-size:10px;color:#64748b;margin-top:4px">Выберите специалиста и свободное время</div></div><span id="count" style="font-size:10px;color:#64748b"></span></div><div class="masters" id="masters"></div></div><div id="error" class="empty hidden">Салон не найден или его страница пока не опубликована.</div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const specs={NAILS:'Ногти',HAIR:'Парикмахер',BROWS:'Брови',LASHES:'Ресницы',MAKEUP:'Макияж',COSMETOLOGY:'Косметология',MASSAGE:'Массаж',BARBER:'Барбер',DEPILATION:'Депиляция',OTHER:'Мастер красоты'};const id=new URLSearchParams(location.search).get('id');function money(v){return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0))}function initials(v){return String(v||'С').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}async function load(){if(!id)return fail();const{data,error}=await s.rpc('marketplace_beauty_salon_public',{p_salon_id:id});const x=data?.[0];if(error||!x)return fail();$('loading').classList.add('hidden');$('page').classList.remove('hidden');document.title=`${x.name} — салон красоты | ЦУИМ`;$('name').textContent=x.name;$('logoBox').innerHTML=x.logo_url?`<img src="${esc(x.logo_url)}" alt="${esc(x.name)}">`:esc(initials(x.name));$('meta').innerHTML=`<span class="tag">📍 ${esc(x.city||'Город')}</span>${x.address?`<span class="tag">${esc(x.address)}</span>`:''}${x.phone?`<a class="tag" href="tel:${String(x.phone).replace(/[^+\d]/g,'')}">☎ ${esc(x.phone)}</a>`:''}`;$('description').textContent=x.description||'Салон красоты на городской платформе ЦУИМ.';const a=Array.isArray(x.masters)?x.masters:[];$('count').textContent=`${a.length} ${a.length===1?'мастер':'мастеров'}`;$('masters').innerHTML=a.length?a.map(m=>`<a class="master" href="/beauty-master.html?id=${encodeURIComponent(m.id)}"><div class="master-top"><div class="mavatar">${m.avatar_url?`<img src="${esc(m.avatar_url)}" alt="">`:esc(initials(m.display_name))}</div><div><h3>${esc(m.display_name)}</h3><div class="spec">${esc(specs[m.specialty]||'Мастер')}</div></div></div><div class="headline">${esc(m.headline||'Специалист салона')}</div><div class="facts">${m.rating?`<span class="fact">★ ${m.rating} · ${Number(m.review_count||0)} отзывов</span>`:''}${m.experience_years!=null?`<span class="fact">Опыт ${m.experience_years} г.</span>`:''}</div><div class="bottom"><span class="price">${m.starting_price!=null?'от '+money(m.starting_price):'Цены в профиле'}</span><span class="go">Записаться →</span></div></a>`).join(''):'<div class="empty" style="grid-column:1/-1">В салоне пока нет опубликованных мастеров.</div>'}function fail(){$('loading').classList.add('hidden');$('error').classList.remove('hidden')}load();</script></body></html>
