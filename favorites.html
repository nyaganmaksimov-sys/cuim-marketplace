<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Избранное — ЦУИМ</title>
<meta name="description" content="Сохранённые товары и предложения в городском маркетплейсе ЦУИМ.">
<link rel="icon" href="/images/logo_cuim.png">
<style>
:root{--b:#2563eb;--v:#7c3aed;--ink:#0f172a;--m:#64748b;--line:#e2e8f0;--bg:#f6f8fc;--nav:#071633}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,a{font:inherit}.wrap{width:min(1320px,calc(100% - 28px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}.topin{min-height:76px;display:flex;align-items:center;gap:15px}.logo{width:205px;max-height:58px;object-fit:contain}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:12px;min-height:42px;padding:10px 14px;background:linear-gradient(135deg,var(--b),var(--v));color:#fff;font-weight:900;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn.light{background:#fff;color:#334155;border:1px solid var(--line)}main{padding:28px 0 64px}.crumbs{font-size:12px;color:var(--m);margin-bottom:15px}.crumbs a{color:#475569;text-decoration:none}.hero{background:linear-gradient(135deg,#071633,#172554 58%,#312e81);color:#fff;border-radius:25px;padding:28px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px;box-shadow:0 18px 46px #0f172a18}.hero h1{font-size:34px;margin:0;letter-spacing:-.03em}.hero p{margin:7px 0 0;color:#dbeafe;font-size:13px}.heart-big{font-size:58px;color:#fda4af}.notice{padding:13px 15px;border-radius:15px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:12px;line-height:1.5;margin-bottom:16px}.notice a{color:inherit;font-weight:900}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:18px 0 13px}.head h2{margin:0;font-size:24px}.count{font-size:12px;color:var(--m);font-weight:850}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.product{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;min-width:0}.product-img{height:210px;position:relative;display:grid;place-items:center;padding:12px;background:linear-gradient(145deg,#fff,#f7f9ff);overflow:hidden}.product-img img{width:100%;height:100%;object-fit:contain}.badge{position:absolute;left:10px;top:10px;padding:6px 9px;border-radius:999px;background:#fffffff0;border:1px solid var(--line);font-size:9px;font-weight:900;color:#475569}.body{padding:14px 15px 15px;display:flex;flex-direction:column;flex:1}.seller{font-size:10px;color:#2563eb;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product h3{font-size:14px;line-height:1.38;margin:7px 0 0;min-height:39px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price-row{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;margin-top:10px}.price{font-size:21px;font-weight:950}.old-price{color:#94a3b8;font-size:12px;text-decoration:line-through}.stock{margin-top:7px;font-size:11px;font-weight:850;color:#047857}.stock.low{color:#b45309}.stock.order{color:#6d28d9}.stock.none{color:#b91c1c}.meta{font-size:10px;color:#64748b;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto;padding-top:12px}.product-actions .btn{font-size:10px;min-height:38px;padding:8px}.empty{grid-column:1/-1;padding:54px 24px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:20px;color:#64748b}.empty b{display:block;color:#0f172a;font-size:20px;margin-bottom:8px}.empty .btn{margin-top:16px}footer{background:var(--nav);color:#aebbd0;padding:27px 0;margin-top:20px}.foot{display:flex;justify-content:space-between;gap:14px}.foot b{color:#fff}@media(max-width:1050px){.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.products{grid-template-columns:repeat(2,1fr);gap:9px}.logo{width:165px}.actions .hide{display:none}.hero{padding:22px}.hero h1{font-size:29px}.heart-big{font-size:44px}.product-img{height:165px}.body{padding:11px}.product-actions{grid-template-columns:1fr}.foot{display:block}}@media(max-width:430px){.wrap{width:min(100% - 18px,1320px)}.topin{min-height:68px}.logo{width:150px}.hero{border-radius:19px}.products{grid-template-columns:1fr 1fr}.product-img{height:145px}.product h3{font-size:12px}.price{font-size:18px}}
</style>
<script src="/maintenance-guard.js"></script>
</head>
<body>
<header class="top"><div class="wrap topin"><a href="/"><img class="logo" src="/images/logo_cuim.png" alt="ЦУИМ"></a><div class="actions"><a class="btn light mc-favorites-link" href="/favorites.html"><span>♥</span><span class="mc-fav-text">Избранное</span><span class="mc-favorites-count"></span></a><a class="btn light hide" href="/cart.html">🛒 Корзина</a><a class="btn" id="accountLink" href="/login.html">Личный кабинет</a></div></div></header>
<main class="wrap"><div class="crumbs"><a href="/">Главная</a> · Избранное</div><section class="hero"><div><h1>Избранное</h1><p>Сохраняйте товары и предложения, чтобы быстро вернуться к ним позже.</p></div><div class="heart-big">♥</div></section><div id="notice"></div><div class="head"><h2>Сохранённые предложения</h2><span class="count" id="count"></span></div><section class="products" id="products"><div class="empty">Загружаем избранное…</div></section></main>
<footer><div class="wrap foot"><b>ЦУИМ — городской маркетплейс</b><span>Всё в городе — в одном месте</span></div></footer>
<script type="module">
import'/marketplace-card-ui.js';import'/marketplace-favorites.js';import'/marketplace-reviews.js';
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';
const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu');
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));
const LOCAL_KEY='cuim-favorites-local:v1',STOCK=['IN_STOCK','LOW_STOCK','ON_ORDER','OUT_OF_STOCK'];let all=[],session=null,reloadTimer=null;
function localIds(){try{const a=JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');return Array.isArray(a)?a.map(String):[]}catch{return[]}}
function stockStatus(x){const st=x?.marketplace_details?.stock_status;if(STOCK.includes(st))return st;if(x?.quantity==null)return x?.marketplace_offer_type==='PRODUCT'?'ON_ORDER':'IN_STOCK';const q=Number(x.quantity);return q<=0?'OUT_OF_STOCK':q<=3?'LOW_STOCK':'IN_STOCK'}
function stockLine(x){const st=stockStatus(x),q=Number(x.quantity);if(st==='OUT_OF_STOCK')return'<div class="stock none">Нет в наличии</div>';if(st==='ON_ORDER')return'<div class="stock order">Под заказ</div>';if(st==='LOW_STOCK')return`<div class="stock low">${Number.isFinite(q)&&q>0?'Осталось '+q:'Ограниченный остаток'}</div>`;return'<div class="stock">В наличии</div>'}
function card(x){const d=x.marketplace_details||{},old=Number(x.old_price),cur=Number(x.price),hasOld=Number.isFinite(old)&&Number.isFinite(cur)&&old>cur,canBuy=['PRODUCT','FOOD'].includes(x.marketplace_offer_type)&&stockStatus(x)!=='OUT_OF_STOCK';return`<article class="product" data-offer="${esc(x.id)}"><div class="product-img">${x.image_url?`<img src="${esc(x.image_url)}" loading="lazy" alt="${esc(x.title)}">`:'<span class="meta">Нет фото</span>'}<span class="badge">${esc(x.category||'Предложение')}</span></div><div class="body"><div class="seller">${esc(x.partner_name||'Участник ЦУИМ')}</div><div class="mc-trust-row"><span>☆ Без рейтинга</span><span class="mc-trust-dot">•</span><span class="mc-trust-brand">На ЦУИМ</span></div><h3>${esc(x.title)}</h3><div class="price-row"><span class="price">${x.price==null?'Цена по запросу':money(x.price)}</span>${hasOld?`<span class="old-price">${money(old)}</span>`:''}</div>${['PRODUCT','FOOD'].includes(x.marketplace_offer_type)?stockLine(x):''}${x.city?`<div class="meta">📍 ${esc(x.city)}</div>`:''}<div class="meta">${[d.delivery?'🚚 Доставка':'',d.pickup?'🏪 Самовывоз':''].filter(Boolean).join(' · ')}</div><div class="product-actions">${canBuy?`<button class="btn" data-cart="${esc(x.id)}">${stockStatus(x)==='ON_ORDER'?'Заказать':'В корзину'}</button>`:`<a class="btn" href="/offer.html?id=${encodeURIComponent(x.id)}">Подробнее</a>`}<a class="btn light" href="/offer.html?id=${encodeURIComponent(x.id)}">Открыть</a></div></div></article>`}
async function idsForUser(){const{data:{session:ses}}=await s.auth.getSession();session=ses||null;$('accountLink').href=session?'/account.html':'/login.html?next=%2Ffavorites.html';if(!session){$('notice').innerHTML='<div class="notice">Сейчас избранное хранится на этом устройстве. <a href="/login.html?next=%2Ffavorites.html">Войдите</a>, чтобы сохранить его в аккаунте и видеть на других устройствах.</div>';return localIds()}$('notice').innerHTML='';const local=localIds();if(local.length){await s.from('marketplace_favorites').upsert(local.map(product_id=>({user_id:session.user.id,product_id})),{onConflict:'user_id,product_id',ignoreDuplicates:true});localStorage.removeItem(LOCAL_KEY)}const{data,error}=await s.from('marketplace_favorites').select('product_id').eq('user_id',session.user.id);if(error)throw error;return(data||[]).map(x=>String(x.product_id))}
async function load(){try{const ids=await idsForUser();if(!ids.length){all=[];$('count').textContent='0';$('products').innerHTML='<div class="empty"><b>Здесь пока пусто</b>Нажимайте на сердечко в карточках товаров и услуг — они появятся здесь.<br><a class="btn" href="/catalog/">Перейти в каталог</a></div>';return}const{data,error}=await s.rpc('marketplace_cart_products_v2',{p_product_ids:ids});if(error)throw error;all=data||[];$('count').textContent=`${all.length} сохранено`;$('products').innerHTML=all.map(card).join('')||'<div class="empty"><b>Сохранённые предложения сейчас недоступны</b>Возможно, продавец временно снял их с публикации.</div>';document.querySelectorAll('.product[data-offer]').forEach(el=>el.onclick=e=>{if(e.target.closest('a,button'))return;location.href='/offer.html?id='+encodeURIComponent(el.dataset.offer)});document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const key='cuim-cart:v1';let a=[];try{a=JSON.parse(localStorage.getItem(key)||'[]')}catch{}const f=a.find(v=>v.product_id===b.dataset.cart);f?f.quantity=Math.min(99,Math.max(1,Number(f.quantity)||1)+1):a.push({product_id:b.dataset.cart,quantity:1});localStorage.setItem(key,JSON.stringify(a));b.textContent='Добавлено ✓';setTimeout(()=>b.textContent='В корзину',1100)})}catch(e){console.warn(e);$('products').innerHTML='<div class="empty"><b>Не удалось загрузить избранное</b>Обновите страницу или попробуйте позже.</div>'}}
window.addEventListener('cuim:favorites-change',()=>{clearTimeout(reloadTimer);reloadTimer=setTimeout(load,180)});load();
</script>
</body></html>
