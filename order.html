<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Заказ — ЦУИМ</title>
<link rel="icon" href="/images/logo_cuim.png">
<style>
:root{--b:#2563eb;--v:#7c3aed;--ink:#0f172a;--m:#64748b;--line:#e2e8f0;--bg:#f6f8fc;--nav:#071633;--green:#059669}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,a{font:inherit}.wrap{width:min(1060px,calc(100% - 28px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.topin{min-height:76px;display:flex;align-items:center;gap:15px}.logo{width:205px;max-height:58px;object-fit:contain}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:13px;min-height:43px;padding:10px 15px;background:linear-gradient(135deg,var(--b),var(--v));color:#fff;text-decoration:none;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn.light{background:#fff;color:#334155;border:1px solid var(--line)}main{padding:26px 0 60px}.crumbs{font-size:12px;color:var(--m);margin-bottom:15px}.crumbs a{color:#475569;text-decoration:none}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 28px #0f172a08}.hero{padding:24px;margin-bottom:16px}.toprow{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{font-size:10px;font-weight:900;color:var(--b);text-transform:uppercase;letter-spacing:.08em}.hero h1{margin:5px 0 7px;font-size:31px}.muted{color:var(--m);font-size:12px;line-height:1.55}.status{display:inline-flex;border-radius:999px;padding:8px 11px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:900}.status.done{background:#ecfdf5;color:#047857}.status.cancel{background:#fef2f2;color:#b91c1c}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(310px,.7fr);gap:16px;align-items:start}.card{padding:20px}.card h2{margin:0 0 13px;font-size:19px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:13px 0;border-top:1px solid #eef2f7}.item:first-of-type{border-top:0}.item-title{font-weight:850;line-height:1.4}.item-title a{color:inherit;text-decoration:none}.item-title a:hover{color:var(--b)}.item-meta{margin-top:5px;color:var(--m);font-size:11px}.item-sum{text-align:right;font-weight:950}.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #eef2f7;font-size:12px}.row span{color:var(--m)}.row b{text-align:right}.total{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding-top:16px;margin-top:8px}.total b{font-size:27px}.seller{display:flex;align-items:center;gap:12px;margin-bottom:15px}.avatar{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#38bdf8,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:950}.seller b{display:block}.seller span{font-size:11px;color:var(--m)}.note{padding:13px;border-radius:14px;background:#f8fafc;border:1px solid #eef2f7;font-size:12px;line-height:1.55;margin-top:13px}.side-actions{display:grid;gap:8px;margin-top:15px}.error{padding:60px 22px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:22px;color:var(--m)}.error h1{color:var(--ink)}@media(max-width:760px){.layout{grid-template-columns:1fr}.logo{width:165px}.actions .hide{display:none}.toprow{display:block}.status{margin-top:10px}.hero{padding:19px}.hero h1{font-size:27px}.card{padding:17px}}@media(max-width:480px){.wrap{width:min(100% - 18px,1060px)}.topin{min-height:68px}.logo{width:150px}.item{grid-template-columns:1fr}.item-sum{text-align:left}.hero h1{font-size:24px}}
</style>
<script src="/maintenance-guard.js"></script>
</head>
<body>
<header class="top"><div class="wrap topin"><a href="/"><img class="logo" src="/images/logo_cuim.png" alt="ЦУИМ"></a><div class="actions"><a class="btn light hide" href="/catalog/">Каталог</a><a class="btn" href="/account.html">Мои заказы</a></div></div></header>
<main class="wrap"><div class="crumbs"><a href="/">Главная</a> · <a href="/account.html">Личный кабинет</a> · Заказ</div><div id="app"><div class="error">Загрузка заказа…</div></div></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm';
const s=createClient('https://qgakliolffnwkymoqvzn.supabase.co','sb_publishable_WbZxATu_lxqWF21jR_qFag_fcEeVIMu');
const id=new URLSearchParams(location.search).get('id');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:2}).format(Number(v||0));
const labels={NEW:'Новый заказ',CONFIRMED:'Подтверждён',IN_WORK:'В работе',READY:'Готов к выдаче',COMPLETED:'Выполнен',CANCELLED:'Отменён'};
const deliveryLabels={NOT_REQUIRED:'Доставка не требуется',WAITING:'Ожидает обработки',OPEN:'Ищем курьера',ASSIGNED:'Курьер назначен',GOING_TO_PICKUP:'Курьер едет за заказом',PICKED_UP:'Заказ забран',IN_TRANSIT:'Заказ в пути',DELIVERED:'Доставлено',CANCELLED:'Доставка отменена'};
function initials(v){return String(v||'Ц').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'Ц'}
function fmtDate(v){try{return new Intl.DateTimeFormat('ru-RU',{dateStyle:'long',timeStyle:'short'}).format(new Date(v))}catch{return''}}
function err(title,text){document.getElementById('app').innerHTML=`<div class="error"><h1>${esc(title)}</h1><p>${esc(text)}</p><a class="btn" href="/account.html">Вернуться в кабинет</a></div>`}
const{data:{session}}=await s.auth.getSession();if(!session){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search)}else if(!id){err('Заказ не указан','Откройте заказ из личного кабинета.')}else{const{data:o,error}=await s.rpc('marketplace_my_order_detail',{p_order_id:id});if(error){err('Не удалось открыть заказ',error.message)}else if(!o){err('Заказ не найден','Он не существует или принадлежит другому пользователю.')}else{document.title=`Заказ ${String(o.id).slice(0,8).toUpperCase()} — ЦУИМ`;const items=Array.isArray(o.items)?o.items:[],goods=items.reduce((a,x)=>a+Number(x.price||0)*Number(x.quantity||0),0),statusClass=o.status==='COMPLETED'?'done':o.status==='CANCELLED'?'cancel':'';const firstProduct=items.find(x=>x.product_id)?.product_id||null;document.getElementById('app').innerHTML=`<section class="hero"><div class="toprow"><div><div class="eyebrow">Заказ ${esc(String(o.id).slice(0,8).toUpperCase())}</div><h1>${esc(o.partner_name||'Продавец')}</h1><div class="muted">Создан ${esc(fmtDate(o.created_at))}</div></div><span class="status ${statusClass}">${esc(labels[o.status]||o.status)}</span></div></section><div class="layout"><section class="card"><h2>Состав заказа</h2>${items.map(x=>`<div class="item"><div><div class="item-title">${x.product_id?`<a href="/offer.html?id=${encodeURIComponent(x.product_id)}">${esc(x.title)}</a>`:esc(x.title)}</div><div class="item-meta">${Number(x.quantity)} ${esc(x.unit||'шт.')} × ${money(x.price)}</div></div><div class="item-sum">${money(Number(x.price||0)*Number(x.quantity||0))}</div></div>`).join('')||'<div class="muted">Позиции заказа не найдены.</div>'}<div class="row"><span>Товары</span><b>${money(goods)}</b></div><div class="row"><span>Получение</span><b>${esc(o.delivery_method_title||o.delivery_method||'Самовывоз')}</b></div><div class="row"><span>Доставка</span><b>${money(o.delivery_price)}</b></div><div class="total"><span>Итого</span><b>${money(o.total)}</b></div>${o.comment?`<div class="note"><b>Комментарий к заказу</b><br>${esc(o.comment)}</div>`:''}${o.partner_comment?`<div class="note"><b>Комментарий продавца</b><br>${esc(o.partner_comment)}</div>`:''}</section><aside class="card"><h2>Получение и продавец</h2><div class="seller"><div class="avatar">${esc(initials(o.partner_name))}</div><div><b>${esc(o.partner_name||'Продавец')}</b><span>Участник ЦУИМ</span></div></div><div class="row"><span>Статус заказа</span><b>${esc(labels[o.status]||o.status)}</b></div><div class="row"><span>Статус доставки</span><b>${esc(deliveryLabels[o.delivery_status]||o.delivery_status||'—')}</b></div>${o.delivery_city?`<div class="row"><span>Город</span><b>${esc(o.delivery_city)}</b></div>`:''}${o.delivery_address?`<div class="row"><span>Адрес</span><b>${esc(o.delivery_address)}</b></div>`:''}${o.tracking_number?`<div class="row"><span>Трек-номер</span><b>${esc(o.tracking_number)}</b></div>`:''}<div class="side-actions"><a class="btn" href="/seller.html?id=${encodeURIComponent(o.partner_id)}">Профиль продавца</a>${firstProduct?`<button class="btn light" id="messageSeller">Написать продавцу</button>`:''}<a class="btn light" href="/account.html">Все мои заказы</a></div></aside></div>`;if(firstProduct){document.getElementById('messageSeller').onclick=async()=>{const b=document.getElementById('messageSeller');b.disabled=true;b.textContent='Открываем диалог…';const{data,error}=await s.rpc('marketplace_open_product_conversation',{p_product_id:firstProduct});if(error){b.disabled=false;b.textContent='Написать продавцу';alert(error.message);return}location.href='/messages.html?conversation='+encodeURIComponent(data)}}}}
</script>
</body>
</html>
